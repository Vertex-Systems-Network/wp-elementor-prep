      - name: Verify status contract
        run: node scripts/verify-readme-progress.mjs

      - name: Commit synchronized status without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "P6 Status Sync"
          git config user.email "p6-status-sync@invalid.local"
          git rm .github/workflows/p6-production-status-sync.yml
          git add README.md memory-bank/NEXT_ACTIONS.md memory-bank/PROJECT_STATE.md memory-bank/ROADMAP.md memory-bank/CHANGELOG.md
          git commit -m "Sync P6 production acceptance status"
          git push origin HEAD:docs/p6-production-acceptance-sync
