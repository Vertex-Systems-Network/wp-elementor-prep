name: P14 Receipt Integrity Patch

on:
  push:
    branches:
      - p14/retained-duplicate-core

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 917ae0ce690aa5445cfb1affe3db904e31f9e0f4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p14/retained-duplicate-core
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify bounded branch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA"..HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/p14-receipt-integrity-patch.yml
          docs/P14_FOUNDATION_IMPLEMENTATION.md
          scripts/tmp-p14-receipt-integrity.py
          src/core/p14-preparation-plan.ts
          src/core/p14-preparation-types.ts
          src/core/p14-retained-duplicate-transaction.ts
          tests/p14-retained-duplicate.test.ts
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Apply exact receipt integrity patch
        run: python scripts/tmp-p14-receipt-integrity.py
      - name: Install dependencies
        run: npm install
      - name: Verify focused P14 contracts
        run: |
          npm run typecheck
          npx vitest run tests/p14-retained-duplicate.test.ts
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/p14-retained-duplicate-transaction.ts tests/p14-retained-duplicate.test.ts
          git commit -m "P14: avoid unverified failure fingerprints"
      - name: Remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p14-receipt-integrity-patch.yml scripts/tmp-p14-receipt-integrity.py
          git commit -m "chore: remove temporary P14 receipt patch"
          git push origin HEAD:p14/retained-duplicate-core
