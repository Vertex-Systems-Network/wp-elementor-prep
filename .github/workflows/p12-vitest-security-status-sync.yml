name: P12 Vitest Security Status Sync

on:
  push:
    branches: [docs/p12-vitest-security-sync]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/p12-vitest-security-sync
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Apply targeted status synchronization
        run: node scripts/p12-sync-vitest-security-status.mjs
      - name: Verify status contract
        run: |
          npm install
          npm run status:verify
      - name: Remove one-shot helpers and commit docs-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "P12 Security Status Sync"
          git config user.email "p12-security-status-sync@invalid.local"
          git rm scripts/p12-sync-vitest-security-status.mjs .github/workflows/p12-vitest-security-status-sync.yml
          git add README.md memory-bank/PROJECT_STATE.md memory-bank/NEXT_ACTIONS.md memory-bank/ROADMAP.md memory-bank/CHANGELOG.md
          git diff --cached --name-only | sort
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "README.md memory-bank/CHANGELOG.md memory-bank/NEXT_ACTIONS.md memory-bank/PROJECT_STATE.md memory-bank/ROADMAP.md "
          git commit -m 'docs: record Vitest security remediation checkpoint'
          git push origin HEAD:docs/p12-vitest-security-sync
