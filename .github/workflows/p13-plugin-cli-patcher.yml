name: P13 Plugin CLI Patcher

on:
  push:
    branches:
      - p13/plugin-cli-integration
    paths:
      - .github/workflows/p13-plugin-cli-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p13/plugin-cli-integration
          fetch-depth: 0
      - name: Apply guarded plugin and UI integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          main_path = Path('src/plugin/main.ts')
          main = main_path.read_text()
          main = replace_once(
              main,
              "import { buildAuditReport } from '../core/scoring';",
              "import { buildBuildReadyReport, serializeBuildReadyReportJson } from '../core/build-ready';\nimport { buildAuditReport } from '../core/scoring';",
              'main import',
          )
          main = replace_once(
              main,
              "    const report = buildAuditReport(root, PLUGIN_VERSION);\n    const stored = await figma.clientStorage.getAsync(storageKey) as unknown;",
              "    const report = buildAuditReport(root, PLUGIN_VERSION);\n    const buildReady = buildBuildReadyReport(root, {}, report.generatedAt);\n    const stored = await figma.clientStorage.getAsync(storageKey) as unknown;",
              'main compute',
          )
          main = replace_once(
              main,
              "      report,\n      backlog,\n      auditJson: serializeAuditReportJson(report),",
              "      report,\n      backlog,\n      buildReady,\n      buildReadyJson: serializeBuildReadyReportJson(buildReady),\n      auditJson: serializeAuditReportJson(report),",
              'main message',
          )
          main_path.write_text(main)

          ui_path = Path('src/ui/ui.html')
          ui = ui_path.read_text()
          ui = replace_once(
              ui,
              '      <button id="export-backlog-md">Export backlog.md</button>\n',
              '      <button id="export-backlog-md">Export backlog.md</button>\n      <button id="export-build-ready-json">Export build-ready-report.json</button>\n',
              'ui export button',
          )
          ui = replace_once(
              ui,
              "    let latestBacklogMarkdown = '';\n",
              "    let latestBacklogMarkdown = '';\n    let latestBuildReadyJson = '';\n",
              'ui state',
          )
          ui = replace_once(
              ui,
              "    document.getElementById('export-backlog-md').addEventListener('click', () => {\n      downloadText('backlog.md', latestBacklogMarkdown, 'text/markdown;charset=utf-8');\n    });\n",
              "    document.getElementById('export-backlog-md').addEventListener('click', () => {\n      downloadText('backlog.md', latestBacklogMarkdown, 'text/markdown;charset=utf-8');\n    });\n    document.getElementById('export-build-ready-json').addEventListener('click', () => {\n      downloadText('build-ready-report.json', latestBuildReadyJson, 'application/json;charset=utf-8');\n    });\n",
              'ui export listener',
          )
          ui = replace_once(
              ui,
              '    function renderAudit(report, backlog) {\n',
              '    function renderAudit(report, backlog, buildReady) {\n',
              'ui render signature',
          )
          ui = replace_once(
              ui,
              "        <div>${sections || '<div class=\"empty\">No sections discovered yet.</div>'}</div>\n        ${renderBacklog(backlog)}`;",
              "        ${buildReady ? `\n          <div class=\"sectionTitle\">Build-Ready Score 2.0</div>\n          <div class=\"hero\">\n            <div class=\"score\">${buildReady.score.score === null ? '—' : buildReady.score.score}</div>\n            <div class=\"status\">${escapeHtml(buildReady.score.status)} · P13 IMPLEMENTATION CANDIDATE</div>\n            <div class=\"meta\">Responsive risk ${escapeHtml(buildReady.responsiveRisk.level)} · evidence coverage ${Math.round(buildReady.coverage.overallCoverage * 100)}%</div>\n            <div class=\"meta\">${buildReady.findings.length} findings · ${buildReady.limitations.length} explicit limitations · target-agnostic read-only analysis</div>\n          </div>` : ''}\n        <div>${sections || '<div class=\"empty\">No sections discovered yet.</div>'}</div>\n        ${renderBacklog(backlog)}`;",
              'ui Build-Ready summary',
          )
          ui = replace_once(
              ui,
              "        latestBacklogMarkdown = typeof message.backlogMarkdown === 'string' ? message.backlogMarkdown : '';\n        exportPanel.hidden = !(latestAuditJson && latestAuditMarkdown && latestBacklogJson && latestBacklogMarkdown);\n        renderAudit(message.report, message.backlog);",
              "        latestBacklogMarkdown = typeof message.backlogMarkdown === 'string' ? message.backlogMarkdown : '';\n        latestBuildReadyJson = typeof message.buildReadyJson === 'string' ? message.buildReadyJson : '';\n        exportPanel.hidden = !(latestAuditJson && latestAuditMarkdown && latestBacklogJson && latestBacklogMarkdown && latestBuildReadyJson);\n        renderAudit(message.report, message.backlog, message.buildReady);",
              'ui audit-result handler',
          )
          ui_path.write_text(ui)
      - name: Remove temporary workflow and commit guarded patch
        run: |
          git rm .github/workflows/p13-plugin-cli-patcher.yml
          git add src/plugin/main.ts src/ui/ui.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P13: bind Build-Ready report to plugin audit UI"
          git push origin HEAD:p13/plugin-cli-integration
