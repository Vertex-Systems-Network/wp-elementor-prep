name: P14 Run Identity Bounds

on:
  push:
    branches:
      - p14/bounded-input-preflight
    paths:
      - 'scripts/p14-run-identity-bounds.py'
      - '.github/workflows/p14-run-identity-bounds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v7
        uses: actions/checkout@v7
        with:
          ref: p14/bounded-input-preflight
          fetch-depth: 0

      - name: Run actions/setup-node@v7
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verify bounded branch scope
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "p14/bounded-input-preflight"
          test -f scripts/p14-run-identity-bounds.py
          test -f .github/workflows/p14-run-identity-bounds.yml

      - name: Apply exact run identity bounds patch
        run: python scripts/p14-run-identity-bounds.py

      - name: Install dependencies
        run: npm install

      - name: Verify focused P14 contracts
        run: |
          npm run typecheck
          npx vitest run tests/p14-input-bounds.test.ts tests/p14-retained-duplicate.test.ts tests/p14-integrity.test.ts

      - name: Commit product hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/p14-input-bounds.ts src/core/p14-retained-duplicate-transaction.ts tests/p14-input-bounds.test.ts
          if git diff --cached --quiet; then
            echo "No product changes staged"
            exit 1
          fi
          git commit -m "P14: bound run-level transaction identities"
          git push origin HEAD:p14/bounded-input-preflight

      - name: Remove temporary patch files
        if: success()
        run: |
          set -euo pipefail
          git pull --rebase origin p14/bounded-input-preflight
          git rm scripts/p14-run-identity-bounds.py .github/workflows/p14-run-identity-bounds.yml
          git commit -m "chore: remove temporary P14 run identity patch files"
          git push origin HEAD:p14/bounded-input-preflight
