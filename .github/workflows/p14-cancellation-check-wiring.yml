name: P14 Cancellation Check Wiring

on:
  push:
    branches:
      - p14/cancellation-check-hardening

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p14/cancellation-check-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify exact branch scope
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "p14/cancellation-check-hardening"
          test -f scripts/p14-cancellation-check-wiring.py
          test -f .github/workflows/p14-cancellation-check-wiring.yml
      - name: Apply exact cancellation-check wiring and README sync
        run: python scripts/p14-cancellation-check-wiring.py
      - name: Install dependencies
        run: npm install
      - name: Verify P14 cancellation-check contracts
        run: |
          set -euo pipefail
          npm run typecheck
          npx vitest run tests/p14-*.test.ts
      - name: Commit verified product wiring and README sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/core/p14-retained-duplicate-transaction.ts \
            README.md
          git diff --cached --quiet && { echo "No verified product/README changes staged"; exit 1; }
          git commit -m "feat: fail closed on P14 cancellation-check errors"
          git push origin HEAD:p14/cancellation-check-hardening
