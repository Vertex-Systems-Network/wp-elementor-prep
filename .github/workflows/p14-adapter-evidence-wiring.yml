name: P14 Adapter Evidence Wiring

on:
  push:
    branches:
      - p14/adapter-evidence-hardening

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p14/adapter-evidence-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify exact branch scope
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "p14/adapter-evidence-hardening"
          test -f scripts/p14-adapter-evidence-wiring.py
          test -f .github/workflows/p14-adapter-evidence-wiring.yml
      - name: Apply exact adapter evidence wiring
        run: python scripts/p14-adapter-evidence-wiring.py
      - name: Install dependencies
        run: npm install
      - name: Verify focused P14 adapter evidence contracts
        run: |
          set -euo pipefail
          npm run typecheck
          npx vitest run tests/p14-*.test.ts
      - name: Commit verified product wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/core/p14-retained-duplicate-transaction.ts \
            src/core/p14-preparation-receipt.ts
          git diff --cached --quiet && { echo "No product wiring changes staged"; exit 1; }
          git commit -m "feat: validate P14 adapter runtime evidence"
          git push origin HEAD:p14/adapter-evidence-hardening
