name: P14 Validation Profile Runtime Hardening

on:
  push:
    branches:
      - p14/validation-profile-coverage
    paths:
      - 'scripts/p14-validation-profile-runtime-hardening.py'
      - '.github/workflows/p14-validation-profile-runtime-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p14/validation-profile-coverage
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verify bounded branch scope
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "p14/validation-profile-coverage"
          test -f scripts/p14-validation-profile-runtime-hardening.py
          test -f .github/workflows/p14-validation-profile-runtime-hardening.yml

      - name: Apply exact runtime hardening
        run: python scripts/p14-validation-profile-runtime-hardening.py

      - name: Install dependencies
        run: npm install

      - name: Verify focused P14 runtime validation contracts
        run: |
          npm run typecheck
          npx vitest run \
            tests/p14-validation-profile-coverage.test.ts \
            tests/p14-retained-duplicate.test.ts \
            tests/p14-integrity.test.ts \
            tests/p14-plan-authorization.test.ts

      - name: Commit product hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/p14-retained-duplicate-transaction.ts tests/p14-validation-profile-coverage.test.ts
          if git diff --cached --quiet; then
            echo "No product changes staged"
            exit 1
          fi
          git commit -m "P14: fail closed on malformed validator evidence"
          git push origin HEAD:p14/validation-profile-coverage
