name: Temporary P16 destination docs sync 453

on:
  push:
    branches:
      - docs/p16-output-destination-sync-453

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p16-output-destination-sync-453
          fetch-depth: 0
      - name: Patch canonical docs with exact guards
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          readme = 'README.md'
          replace_once(
              readme,
              'bounded local JSON I/O with stable immutable read snapshots + output-parent snapshot revalidation + temporary payload identity binding + non-recursive temporary cleanup, iterative structural bounds',
              'bounded local JSON I/O with stable immutable read snapshots + output-parent snapshot revalidation + temporary payload identity binding + non-recursive temporary cleanup + output-destination state binding, iterative structural bounds',
          )
          replace_once(
              readme,
              'Current verified main before this documentation sync:\n\n`0c9325fe995e983b4c904f59f788ac91167276aa`',
              'Current verified main before this documentation sync:\n\n`f3306a3aba5b42544cbdabe950f975ce5ce338a9`',
          )
          readme_446 = '- PR #446 — removed recursive temporary-directory cleanup so cleanup attempts only non-recursive `rmdir` after parent/temp snapshot checks -> `0c9325fe995e983b4c904f59f788ac91167276aa`; exact head `efc6d1b34f238928635abb5eaa2d5afb20ff0b2b` passed CI #1223, P12 Final Release Artifact #534 and P12 Offline Acceptance #578.'
          replace_once(
              readme,
              readme_446,
              readme_446 + '\n- PR #448 — synchronized canonical docs through non-recursive temporary cleanup -> `af517e1477d57753993f805ccb4d0f770fdf51d5`; exact head `875c1ab816f67761be11f032a87cd3a4ec6e4d57` passed CI #1225, Integration Readiness #475, P12 Final Release Artifact #536 and P12 Offline Acceptance #580.\n- PR #452 — bound final atomic rename to captured output-destination state -> `f3306a3aba5b42544cbdabe950f975ce5ce338a9`; exact head `ae6fff73839f874ca5eb0b92d50e7632e74ce533` passed CI #1231, P12 Final Release Artifact #542 and P12 Offline Acceptance #586.',
          )
          replace_once(
              readme,
              '+ temporary payload identity binding + non-recursive temporary cleanup + depth/value/text-bounded accessor/own-shape-safe direct canonicalization',
              '+ temporary payload identity binding + non-recursive temporary cleanup + output-destination state binding + depth/value/text-bounded accessor/own-shape-safe direct canonicalization',
          )
          readme_parent = '- output-parent snapshot revalidation: the canonical output directory is captured as a frozen path/dev/ino snapshot after creation/resolution, checked again before temp creation and immediately before final rename, and must still be a directory that self-resolves to the same canonical path. When stable identity existed at capture, the same dev/ino directory identity is required; otherwise the fallback is canonical-path/directory consistency only;'
          replace_once(
              readme,
              readme_parent,
              readme_parent + '\n- output-destination state binding: the final output entry is captured before staging as either `ABSENT` or a frozen `EXISTING_REGULAR` canonical path + file snapshot. Immediately before rename, an absent destination must still be absent and an existing destination must still be the same observed regular file; observed creation, replacement, removal or type change fails closed with `Output path changed during write.`;',
          )
          replace_once(
              readme,
              'input/output-parent/temp-directory/payload snapshots are revalidated before atomic rename.',
              'input/output-parent/output-destination/temp-directory/payload snapshots are revalidated before atomic rename.',
          )
          replace_once(
              readme,
              'Output-parent snapshots bind the final rename to the canonical directory that was safety-checked. Temporary-directory snapshots and the opened payload handle/file snapshot separately bind payload creation, content write and rename to the temp subtree that was actually observed.',
              'Output-parent snapshots bind the final rename to the canonical directory that was safety-checked. Output-destination snapshots bind overwrite eligibility to the absent-or-existing regular entry observed before staging. Temporary-directory snapshots and the opened payload handle/file snapshot separately bind payload creation, content write and rename to the temp subtree that was actually observed.',
          )
          replace_once(
              readme,
              'Focused tests cover output symlink, hardlink and symlinked-parent aliases, stable input snapshots, post-read input replacement, immutable snapshot metadata, stable/replaced output-parent snapshots, stable/replaced temp-directory snapshots, opened payload handle/path mismatch, post-write payload replacement, empty owned-temp removal and non-empty temp-content preservation.',
              'Focused tests cover output symlink, hardlink and symlinked-parent aliases, stable input snapshots, post-read input replacement, immutable snapshot metadata, stable/replaced output-parent snapshots, absent/existing/replaced output-destination snapshots including inode-zero metadata fallback and unchanged-overwrite support, stable/replaced temp-directory snapshots, opened payload handle/path mismatch, post-write payload replacement, empty owned-temp removal and non-empty temp-content preservation.',
          )
          replace_once(
              readme,
              'These checks narrow path-swap/TOCTOU ambiguity but do not claim perfect race elimination when stable filesystem identity is unavailable.',
              'These checks narrow path-swap/TOCTOU ambiguity but do not claim perfect race elimination; a narrow final destination check→rename race remains without an OS-specific conditional-rename primitive, and metadata fallback is bounded when stable filesystem identity is unavailable.',
          )

          p14 = 'docs/P14_FOUNDATION_IMPLEMENTATION.md'
          replace_once(
              p14,
              '+ temporary payload identity binding + non-recursive temporary cleanup + iterative structural bounds',
              '+ temporary payload identity binding + non-recursive temporary cleanup + output-destination state binding + iterative structural bounds',
          )
          replace_once(
              p14,
              'Current verified main before this documentation sync:\n\n`0c9325fe995e983b4c904f59f788ac91167276aa`',
              'Current verified main before this documentation sync:\n\n`f3306a3aba5b42544cbdabe950f975ce5ce338a9`',
          )
          p14_parent = '- output-parent snapshot revalidation: the canonical output directory is captured as a frozen path/dev/ino snapshot after creation/resolution, checked again before temp creation and immediately before final rename, and must still be a directory that self-resolves to the same canonical path. When stable identity existed at capture, the same dev/ino directory identity is required; otherwise the fallback is canonical-path/directory consistency only;'
          replace_once(
              p14,
              p14_parent,
              p14_parent + '\n- output-destination state binding: the final output entry is captured before staging as `ABSENT` or frozen `EXISTING_REGULAR` canonical path/file metadata. Immediately before rename, it must still match that state; observed creation/replacement/removal/type change fails closed with `Output path changed during write.`, while overwrite of the same unchanged regular destination remains supported;',
          )
          replace_once(
              p14,
              'input/output-parent/temp-directory/payload snapshots are revalidated before atomic rename.',
              'input/output-parent/output-destination/temp-directory/payload snapshots are revalidated before atomic rename.',
          )
          replace_once(
              p14,
              'Output-parent snapshots bind the final rename to the canonical directory that was safety-checked. Temporary-directory snapshots and the opened payload handle/file snapshot separately bind payload creation, content write and rename to the temp subtree actually observed.',
              'Output-parent snapshots bind the final rename to the canonical directory that was safety-checked. Output-destination snapshots bind overwrite eligibility to the absent-or-existing regular entry observed before staging. Temporary-directory snapshots and the opened payload handle/file snapshot separately bind payload creation, content write and rename to the temp subtree actually observed.',
          )
          replace_once(
              p14,
              'Focused tests cover symlink, hardlink and symlinked-parent aliases, stable input snapshots, post-read pathname replacement, runtime-frozen snapshot metadata, stable/replaced output-parent snapshots, stable/replaced temp-directory snapshots, opened payload handle/path mismatch, post-write payload replacement, empty owned-temp removal and non-empty temp-content preservation.',
              'Focused tests cover symlink, hardlink and symlinked-parent aliases, stable input snapshots, post-read pathname replacement, runtime-frozen snapshot metadata, stable/replaced output-parent snapshots, absent/existing/replaced output-destination snapshots including inode-zero metadata fallback and unchanged-overwrite support, stable/replaced temp-directory snapshots, opened payload handle/path mismatch, post-write payload replacement, empty owned-temp removal and non-empty temp-content preservation.',
          )
          p14_446 = '- #446 non-recursive temporary-directory cleanup -> `0c9325fe995e983b4c904f59f788ac91167276aa`.'
          replace_once(
              p14,
              p14_446,
              p14_446 + '\n- #448 canonical non-recursive-cleanup docs sync -> `af517e1477d57753993f805ccb4d0f770fdf51d5`;\n- #452 output-destination state binding -> `f3306a3aba5b42544cbdabe950f975ce5ce338a9`.',
          )
          replace_once(
              p14,
              'These checks narrow path-swap/TOCTOU ambiguity but do not claim perfect race elimination where stable filesystem identity is unavailable.',
              'These checks narrow path-swap/TOCTOU ambiguity but do not claim perfect race elimination; a narrow final destination check→rename race remains without an OS-specific conditional-rename primitive, and metadata fallback is bounded where stable filesystem identity is unavailable.',
          )

          state = 'memory-bank/PROJECT_STATE.md'
          replace_once(
              state,
              '+ temporary payload identity binding + non-recursive temporary cleanup, depth/value/text-bounded',
              '+ temporary payload identity binding + non-recursive temporary cleanup + output-destination state binding, depth/value/text-bounded',
          )
          replace_once(
              state,
              'Current verified main before this documentation sync:\n\n`0c9325fe995e983b4c904f59f788ac91167276aa`',
              'Current verified main before this documentation sync:\n\n`f3306a3aba5b42544cbdabe950f975ce5ce338a9`',
          )
          state_446 = '- #446 non-recursive temporary-directory cleanup -> `0c9325fe995e983b4c904f59f788ac91167276aa`.'
          replace_once(
              state,
              state_446,
              state_446 + '\n- #448 canonical non-recursive-cleanup docs sync -> `af517e1477d57753993f805ccb4d0f770fdf51d5`;\n- #452 output-destination state binding -> `f3306a3aba5b42544cbdabe950f975ce5ce338a9`.',
          )
          state_parent = '- output-parent snapshot revalidation: the canonical output directory is captured as a frozen path/dev/ino snapshot after creation/resolution, revalidated before temporary output creation and immediately before final rename, and must remain a directory that self-resolves to the same canonical path. Where stable identity existed at capture, the same dev/ino directory identity is required; otherwise canonical-path/directory consistency is the bounded fallback;'
          replace_once(
              state,
              state_parent,
              state_parent + '\n- output-destination state binding: final output state is captured before staging as `ABSENT` or frozen `EXISTING_REGULAR` canonical path/file metadata, then revalidated immediately before rename. Observed creation/replacement/removal/type change fails closed with `Output path changed during write.`; unchanged existing regular output remains intentionally overwritable;',
          )
          replace_once(
              state,
              'input/output-parent/temp-directory/payload snapshots are revalidated before atomic rename.',
              'input/output-parent/output-destination/temp-directory/payload snapshots are revalidated before atomic rename.',
          )
          replace_once(
              state,
              'Output-parent snapshots bind the final rename to the canonical directory that was safety-checked. Temporary-directory snapshots and the opened payload handle/file snapshot separately bind temporary payload creation, content write and rename to the observed temp subtree.',
              'Output-parent snapshots bind the final rename to the canonical directory that was safety-checked. Output-destination snapshots bind overwrite eligibility to the absent-or-existing regular entry observed before staging. Temporary-directory snapshots and the opened payload handle/file snapshot separately bind temporary payload creation, content write and rename to the observed temp subtree.',
          )
          replace_once(
              state,
              'Focused output-path tests cover symlink, hardlink and symlinked-parent aliases and verify source input immutability.',
              'Focused output-path tests cover symlink, hardlink and symlinked-parent aliases, plus absent/existing/replaced output-destination snapshots, inode-zero metadata fallback and unchanged-existing-output overwrite support; source input immutability remains verified.',
          )
          replace_once(
              state,
              'These checks narrow path-swap/TOCTOU ambiguity but do not claim perfect race elimination when stable filesystem identity is unavailable.',
              'These checks narrow path-swap/TOCTOU ambiguity but do not claim perfect race elimination; a narrow final destination check→rename race remains without an OS-specific conditional-rename primitive, and metadata fallback is bounded when stable filesystem identity is unavailable.',
          )

          nxt = 'memory-bank/NEXT_ACTIONS.md'
          replace_once(
              nxt,
              '## Parallel P16 state — bounded code-side foundation complete through non-recursive temporary cleanup',
              '## Parallel P16 state — bounded code-side foundation complete through output-destination state binding',
          )
          next_446 = '- PR #446 — remove recursive temp-directory cleanup; cleanup now attempts only non-recursive `rmdir` after parent/temp snapshot checks.'
          replace_once(
              nxt,
              next_446,
              next_446 + '\n- PR #448 — canonical non-recursive-temp-cleanup docs sync.\n- PR #452 — capture final output destination as absent/existing-regular state and revalidate it immediately before atomic rename.',
          )
          replace_once(
              nxt,
              '- rejects an existing output regular file that shares stable filesystem identity with a file actually read when identity is available;',
              '- rejects an existing output regular file that shares stable filesystem identity with a file actually read when identity is available;\n- captures the final output destination before staging as `ABSENT` or frozen `EXISTING_REGULAR` canonical path + file identity/metadata, preserving overwrite only for the same unchanged existing regular destination;\n- immediately before rename, requires the captured destination state to remain unchanged and reports `Output path changed during write.` on observed creation, replacement, removal or type change;',
          )
          replace_once(
              nxt,
              '- preserves input-snapshot and output-parent revalidation immediately before rename, then atomically renames the bound payload into place;',
              '- preserves input-snapshot and output-parent revalidation immediately before rename, then revalidates output-destination state before atomically renaming the bound payload into place;',
          )
          replace_once(
              nxt,
              '- these checks narrow path-swap/TOCTOU ambiguity but are not claimed as perfect filesystem-race elimination where stable identity is unavailable.',
              '- these checks narrow path-swap/TOCTOU ambiguity but are not claimed as perfect filesystem-race elimination: a narrow final destination check→rename race remains without an OS-specific conditional-rename primitive, and metadata fallback is bounded where stable identity is unavailable.',
          )
          proof_446 = '- #446 non-recursive temp cleanup -> `0c9325fe995e983b4c904f59f788ac91167276aa`; exact head `efc6d1b34f238928635abb5eaa2d5afb20ff0b2b`; CI #1223, Final Release #534, Offline #578 PASS.'
          replace_once(
              nxt,
              proof_446,
              proof_446 + '\n- #448 docs sync -> `af517e1477d57753993f805ccb4d0f770fdf51d5`; exact head `875c1ab816f67761be11f032a87cd3a4ec6e4d57`; CI #1225, Integration #475, Final Release #536, Offline #580 PASS.\n- #452 output-destination state binding -> `f3306a3aba5b42544cbdabe950f975ce5ce338a9`; exact head `ae6fff73839f874ca5eb0b92d50e7632e74ce533`; CI #1231, Final Release #542, Offline #586 PASS.',
          )
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-p16-doc-sync-453.yml
      - name: Commit synchronized docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/P14_FOUNDATION_IMPLEMENTATION.md memory-bank/PROJECT_STATE.md memory-bank/NEXT_ACTIONS.md .github/workflows/tmp-p16-doc-sync-453.yml
          git diff --cached --check
          git commit -m 'Docs: sync P16 output destination state binding'
          git push origin HEAD:docs/p16-output-destination-sync-453
