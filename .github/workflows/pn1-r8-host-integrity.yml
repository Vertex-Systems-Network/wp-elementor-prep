name: Pella Nova Template 1 R8 Hosted R6 Integrity

on:
  push:
    branches:
      - pella-nova-template-1-media
    paths:
      - .github/workflows/pn1-r8-host-integrity.yml

permissions:
  contents: write

jobs:
  verify-hosted-r6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pella-nova-template-1-media

      - name: Audit hosted R6 candidate without aborting report
        shell: bash
        run: |
          set -u
          ROOT='public/pella-nova-template-1'
          ZIP="$ROOT/Pella-Nova-Elementor-Web-Template-1-PASS4-R6-RUNTIME-CANDIDATE.zip"
          REPORT="$ROOT/R8-HOSTED-R6-INTEGRITY.txt"
          EXPECTED_SHA='f27dd864bf9ce19b189b7cb686a92b5b05125f0dfad17605d8748f20cad8bccd'
          HOSTED_SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          HOSTED_BYTES=$(stat -c %s "$ZIP")
          FILE_TYPE=$(file -b "$ZIP" || true)
          MAGIC=$(od -An -tx1 -N16 "$ZIP" | tr -d ' \n' || true)
          unzip -t "$ZIP" > /tmp/r8-unzip-test.txt 2>&1
          UNZIP_EXIT=$?
          {
            echo 'PELLA NOVA TEMPLATE 1 — R8 HOSTED R6 INTEGRITY'
            echo
            echo "EXPECTED_CANONICAL_BYTES=67418"
            echo "EXPECTED_CANONICAL_SHA256=$EXPECTED_SHA"
            echo "HOSTED_BYTES=$HOSTED_BYTES"
            echo "HOSTED_SHA256=$HOSTED_SHA"
            echo "FILE_TYPE=$FILE_TYPE"
            echo "FIRST_16_BYTES_HEX=$MAGIC"
            echo "UNZIP_TEST_EXIT=$UNZIP_EXIT"
            echo
            echo '[UNZIP TEST OUTPUT]'
            cat /tmp/r8-unzip-test.txt
            echo
            if [ "$HOSTED_SHA" = "$EXPECTED_SHA" ] && [ "$HOSTED_BYTES" = '67418' ] && [ "$UNZIP_EXIT" = '0' ]; then
              echo 'CANONICAL_BYTE_MATCH=PASS'
              echo 'HOSTED_IMPORT_URL_SAFE=YES'
            else
              echo 'CANONICAL_BYTE_MATCH=FAIL'
              echo 'HOSTED_IMPORT_URL_SAFE=NO'
            fi
            if [ "$UNZIP_EXIT" = '0' ]; then
              echo
              echo '[ZIP LIST]'
              unzip -l "$ZIP" || true
              echo
              echo '[REQUIRED FILES]'
              for f in manifest.json site-settings.json content/page/100.json templates/101.json templates/102.json templates/103.json templates/104.json templates/105.json templates/106.json templates/107.json templates/108.json templates/109.json templates/110.json taxonomies/nav_menu.json taxonomies/category.json wp-content/nav_menu_item/nav_menu_item.xml; do
                if unzip -Z1 "$ZIP" | grep -Fxq "$f"; then echo "PASS $f"; else echo "MISSING $f"; fi
              done
            fi
          } > "$REPORT"

      - name: Commit integrity report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pella Nova Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/pella-nova-template-1/R8-HOSTED-R6-INTEGRITY.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Add R8 hosted R6 integrity report'
          git push origin HEAD:pella-nova-template-1-media
