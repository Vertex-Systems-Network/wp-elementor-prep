name: P14 Cancellation Docs Sync

on:
  push:
    branches:
      - p14/cancellation-check-hardening

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p14/cancellation-check-hardening
          fetch-depth: 0
      - name: Apply exact docs sync
        run: python scripts/p14-cancellation-docs-sync.py
      - name: Commit docs sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/P14_FOUNDATION_IMPLEMENTATION.md
          git diff --cached --quiet && { echo "No docs sync changes staged"; exit 1; }
          git commit -m "docs: record P14 cancellation-check hardening"
          git push origin HEAD:p14/cancellation-check-hardening
