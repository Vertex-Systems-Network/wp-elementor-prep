name: P7 Final Registration Preflight

on:
  push:
    branches:
      - chore/register-p7-final-d6bf2e1

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download exact retained P7 artifact ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10160543369/zip" \
            -o /tmp/p7-artifact.zip
          echo "b0f16004d35f70aca7bb9edc65f162afe731db4c7d02044b4518e4b31ef685fc  /tmp/p7-artifact.zip" | sha256sum -c -
          rm -rf /tmp/p7-artifact
          mkdir -p /tmp/p7-artifact
          unzip -q /tmp/p7-artifact.zip -d /tmp/p7-artifact
      - name: Run final-closure registry preflight
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npm run runtime:preflight -- p7 /tmp/p7-artifact --archive=/tmp/p7-artifact.zip --intent=final-closure
      - name: Verify import-ID rebind integrity
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/p7-artifact/prepare-figma-import.mjs 1679803102348456572 /tmp/p7-artifact /tmp/p7-import
          cmp /tmp/p7-artifact/code.js /tmp/p7-import/code.js
          cmp /tmp/p7-artifact/ui.html /tmp/p7-import/ui.html
          grep -q '"id": "1679803102348456572"' /tmp/p7-import/manifest.json
