name: Security Lockfile Bootstrap

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/security-lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/ci-supply-chain-285'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only
        shell: bash
        run: |
          test "$GITHUB_HEAD_REF" = "security/ci-supply-chain-285"
          git status --short
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: lock npm dependency graph'
          git push origin HEAD:"$GITHUB_HEAD_REF"
