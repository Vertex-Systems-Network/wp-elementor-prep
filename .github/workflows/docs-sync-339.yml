name: Docs Sync 339

on:
  push:
    branches:
      - docs/p15-review-packet-sync-339
    paths:
      - .github/workflows/docs-sync-339.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/p15-review-packet-sync-339
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm

      - name: Run bounded docs sync and verify
        env:
          BASE_SHA: 250f3d2f82f0f7ca8a5c374ff0199ffef39d16ba
        run: |
          set -euo pipefail
          python .github/scripts/docs-sync-339.py
          npm run status:verify
          git diff --check

          expected=$(printf '%s\n' \
            README.md \
            docs/P14_FOUNDATION_IMPLEMENTATION.md \
            memory-bank/NEXT_ACTIONS.md \
            memory-bank/PROJECT_STATE.md | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"

      - name: Commit canonical docs and remove temporary sync files
        env:
          BASE_SHA: 250f3d2f82f0f7ca8a5c374ff0199ffef39d16ba
        run: |
          set -euo pipefail
          rm .github/scripts/docs-sync-339.py .github/workflows/docs-sync-339.yml
          git add -A

          expected=$(printf '%s\n' \
            README.md \
            docs/P14_FOUNDATION_IMPLEMENTATION.md \
            memory-bank/NEXT_ACTIONS.md \
            memory-bank/PROJECT_STATE.md | sort)
          actual=$(git diff --cached --name-only "$BASE_SHA" | sort)
          test "$actual" = "$expected"

          git diff --cached --check
          git config user.name "WPEssential"
          git config user.email "wordpress.essential@gmail.com"
          git commit -m "docs: sync P15 closure review packet status"
          git push origin HEAD:docs/p15-review-packet-sync-339
