name: P18 React Runtime Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/targets/react/**'
      - 'src/targets/web/**'
      - 'scripts/p18-react-runtime-proof.mjs'
      - 'fixtures/p18-react-runtime/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p18-react-runtime-proof.yml'
  push:
    branches: [main]
    paths:
      - 'src/targets/react/**'
      - 'src/targets/web/**'
      - 'scripts/p18-react-runtime-proof.mjs'
      - 'fixtures/p18-react-runtime/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p18-react-runtime-proof.yml'

permissions:
  contents: read

concurrency:
  group: p18-react-runtime-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      P18_REACT_PROOF_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      P18_REACT_PROOF_RUN_ID: ${{ github.run_id }}
      P18_REACT_PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0

      - name: Install locked root dependencies
        run: npm ci

      - name: Resolve policy-supported Google Chrome
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Google Chrome is unavailable on the runner." >&2
            exit 2
          fi
          echo "P18_REACT_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Run React build and controlled preview proof
        run: npm run p18:react-runtime-proof

      - name: Upload React runtime proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p18-react-runtime-proof-${{ github.run_number }}
          path: dist-p18/react-runtime-proof/receipt.json
          if-no-files-found: error
          retention-days: 14
