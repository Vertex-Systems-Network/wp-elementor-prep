name: Docs Sync 297 Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/docs-sync-297-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/post-security-p13-parity-297'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact docs branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reuse bounded sync script and normalize modified hard-break
        shell: bash
        run: |
          test "$GITHUB_HEAD_REF" = "docs/post-security-p13-parity-297"
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/docs-sync-297-once.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/docs-sync-297.py').write_text(script)
          PY
          python3 /tmp/docs-sync-297.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('docs/P14_FOUNDATION_IMPLEMENTATION.md')
          text = path.read_text()
          old = 'Current status synchronization: #297  \n'
          if old not in text:
              raise SystemExit('Expected inherited Markdown hard-break was not found after sync.')
          path.write_text(text.replace(old, 'Current status synchronization: #297\n', 1))
          PY

      - name: Verify canonical status invariants
        shell: bash
        run: |
          node scripts/verify-readme-progress.mjs
          grep -F '| P14 Target-Ready Duplicate + Guided Prepare | CORE IMPLEMENTATION IN PROGRESS / RUNTIME UNWIRED | N/A | `──────────` |' README.md
          grep -F 'production registry remains empty' README.md
          grep -F 'Machine-readable operational registry: `config/runtime-artifacts.json` schema v3.' README.md
          grep -F '`config/runtime-artifacts.json` is runtime artifact registry schema v3' memory-bank/PROJECT_STATE.md
          grep -F 'Runtime artifact preflight requires `config/runtime-artifacts.json` schema-v3' memory-bank/NEXT_ACTIONS.md
          grep -F 'acceptanceAuthority=false' docs/P14_FOUNDATION_IMPLEMENTATION.md
          grep -F 'targetCompatibilityClaim=false' docs/P14_FOUNDATION_IMPLEMENTATION.md
          grep -F 'mutationEnabled=false' docs/P14_FOUNDATION_IMPLEMENTATION.md
          grep -F 'confirmationEnabled=false' docs/P14_FOUNDATION_IMPLEMENTATION.md
          git diff --check

      - name: Remove temporary workflows and commit docs
        shell: bash
        run: |
          rm .github/workflows/docs-sync-297-once.yml .github/workflows/docs-sync-297-recovery.yml
          git add -- README.md docs/P14_FOUNDATION_IMPLEMENTATION.md memory-bank/PROJECT_STATE.md memory-bank/NEXT_ACTIONS.md .github/workflows/docs-sync-297-once.yml .github/workflows/docs-sync-297-recovery.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/docs-sync-297-once.yml .github/workflows/docs-sync-297-recovery.yml README.md docs/P14_FOUNDATION_IMPLEMENTATION.md memory-bank/NEXT_ACTIONS.md memory-bank/PROJECT_STATE.md | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync security and analyzer-v2 P13 status'
          git push origin HEAD:"$GITHUB_HEAD_REF"
