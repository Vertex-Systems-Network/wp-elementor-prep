name: Docs Sync 309

on:
  push:
    branches: [docs/p14-p15-status-sync-309]
    paths:
      - '.github/workflows/docs-sync-309.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Apply exact canonical status replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # README
          replace_once('README.md',
              '- development-only read-only P14 Guided Prepare preview, proposed-change review binding and persisted-evidence diagnostics;\n- exact-build release/provenance tooling.',
              '- development-only read-only P14 Guided Prepare preview, proposed-change review binding, exact runtime review packet and persisted-evidence diagnostics;\n- P15 Elementor foundation: documented v0.4/container validation, bounded widget-capability reporting and a non-authorizing candidate artifact envelope;\n- exact-build release/provenance tooling.')
          replace_once('README.md',
              '`9955be0561807550a7ad1444d8d013d783820188`',
              '`426314b183f220f66a315a24f9b1122a464909b9`')
          replace_once('README.md',
              '- Issue #295 regenerated the current traceable, non-publishable P13 development runtime artifact from source `9955be0561807550a7ad1444d8d013d783820188`: Actions run `34833881774`, artifact `p13-runtime-evidence-9955be056180-analyzer-v2`, ID `10343017256`, digest `sha256:b3e5a07a5a012f9c1f4deec32389ad83a0e8550580f60de408db14644de5f1fe`. The artifact does not grant runtime acceptance; #159 remains open for genuine Figma Desktop evidence.',
              '- Issue #295 regenerated the current traceable, non-publishable P13 development runtime artifact from source `9955be0561807550a7ad1444d8d013d783820188`: Actions run `34833881774`, artifact `p13-runtime-evidence-9955be056180-analyzer-v2`, ID `10343017256`, digest `sha256:b3e5a07a5a012f9c1f4deec32389ad83a0e8550580f60de408db14644de5f1fe`. The artifact does not grant runtime acceptance; #159 remains open for genuine Figma Desktop evidence.\n- PR #298 synchronized the canonical P13/P14 docs after security/parity work and guarded squash-merged as `127c7215a15a36a2aabc62da79a02708903f4cb9`.\n- PR #300 added a deterministic development-only P14 runtime review packet bound to exact plugin/build provenance, persisted evidence, full Figma context and analyzer-bound P13 identity while keeping all four authority flags false; guarded squash merge `3a1f2f96617304aa4251aa4f3e4e112bce13612a`.\n- PR #302 disabled persisted checkout credentials in all four permanent trusted workflows and enforced the security contract; Integration Readiness proved canonical public refs remain fetchable without persisted credentials; guarded squash merge `5295a40839b093a77b3c6d2dc98daa6ac63d5067`.\n- PR #304 established the documented Elementor v0.4/container template contract and bounded offline validator; guarded squash merge `4c6e0f63718a6b38b056c82207e25973356d0d66`.\n- PR #306 added the read-only Elementor capability registry/report for directly documented classic widget IDs `heading`, `image`, and `button`; guarded squash merge `c242197a2d0a0dd24d7364db5f10c1fb6fa76e13`.\n- PR #308 added the deterministic non-authorizing Elementor candidate artifact envelope. Import validation remains `NOT_RUN`, download remains disabled, and target-compatibility/production-acceptance claims remain false; guarded squash merge `426314b183f220f66a315a24f9b1122a464909b9`.')
          replace_once('README.md',
              '| P15 Elementor native export + validation | PREFLIGHT FROZEN / IMPLEMENTATION NOT STARTED | 0% | `░░░░░░░░░░` | R0+R1 refresh as needed; versioned v3/v4 adapter + real import proof |',
              '| P15 Elementor native export + validation | CORE FOUNDATION IN PROGRESS / TARGET IMPORT UNVALIDATED | N/A | `──────────` | v0.4/container validator + bounded widget capability report + non-authorizing candidate envelope merged; Figma semantic mapping/generation, WordPress import validation and product download remain unwired |')
          replace_once('README.md',
              'P15-P26 implementation is not started; P27 release execution is not started.',
              'P15 core foundation is in progress with target import still unvalidated; P16-P26 implementation is not started; P27 release execution is not started.')

          # P14 foundation
          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md',
              'Status: CORE IMPLEMENTATION + READ-ONLY GUIDED PREPARE RUNTIME PREVIEW — CONFIRMATION/MUTATION UNWIRED  \nRoadmap: #119  \nCurrent status synchronization: #297',
              'Status: CORE IMPLEMENTATION IN PROGRESS / RUNTIME UNWIRED  \nRoadmap: #119  \nCanonical status synchronized through P14 review-packet and P15 foundation merges')
          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md',
              '2. a development-only **read-only Guided Prepare preview** driven by exact current P13 Build-Ready evidence, including a non-authorizing proposed-change review artifact and precise persisted-evidence rejection diagnostics.',
              '2. a development-only **read-only Guided Prepare preview** driven by exact current P13 Build-Ready evidence, including a non-authorizing proposed-change review artifact, an exact-context deterministic runtime review packet and precise persisted-evidence rejection diagnostics.')
          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md',
              '- #280/#281 — persisted-evidence rejection diagnostics and precise fresh-Audit guidance.',
              '- #280/#281 — persisted-evidence rejection diagnostics and precise fresh-Audit guidance;\n- #299/#300 — deterministic read-only runtime review packet bound to exact current plugin/build identity, persisted evidence timestamp, full file/page/frame context, analyzer-bound P13 identity and P14 plan summary.')
          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md',
              'The generated publishable release UI strips the development-only P14 preview/review-binding surface.',
              'The generated publishable release UI strips the development-only P14 preview/review-binding/review-packet surfaces.')
          marker = '## First real P13 safe-preparation opportunity\n'
          insert = '''## Deterministic runtime review packet\n\nPR #300 adds a development-only `P14 Runtime Review Packet` for exact human-review provenance after freshness checks pass. It binds the review artifact to:\n\n- current plugin version and compiled runtime build `sourceSha`, `runId`, and `runNumber`;\n- persisted evidence capture time and matching persisted build provenance;\n- exact file key, page ID/name and frame ID/name;\n- analyzer-bound P13 run ID, structural hash, config hash and analyzer version;\n- P14 preview status/counts/blockers/plan digest and a defensive snapshot of the proposed-change review manifest.\n\nThe packet is deterministic JSON and is not a signature, confirmation token, persisted approval or execution authorization. Its authority flags remain `acceptanceAuthority=false`, `targetCompatibilityClaim=false`, `mutationEnabled=false`, and `confirmationEnabled=false`. The publishable release UI explicitly forbids the packet surface and export filename.\n\n'''
          p = Path('docs/P14_FOUNDATION_IMPLEMENTATION.md')
          text = p.read_text()
          if text.count(marker) != 1:
              raise SystemExit('P14 foundation: insertion marker mismatch')
          p.write_text(text.replace(marker, insert + marker, 1))
          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md',
              '`9955be0561807550a7ad1444d8d013d783820188`\n\nCanonical status synchronization is tracked by #297 on `docs/post-security-p13-parity-297`.\n\nP12 remains at its retained 80% release-exit state. P15-P26 remain preflight-frozen / implementation-not-started. P27 #182 remains the final production-release gate.',
              '`426314b183f220f66a315a24f9b1122a464909b9`\n\nP12 remains at its retained 80% release-exit state. P15 now has a bounded non-authorizing Elementor foundation (v0.4/container validation, documented-core capability reporting and candidate envelope), but real target import remains unvalidated and no Figma-to-Elementor generation/download surface is wired. P16-P26 remain preflight-frozen / implementation-not-started. P27 #182 remains the final production-release gate.')
          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md',
              'After #297 status synchronization, the next authority-bearing P13 step is genuine Figma Desktop evidence under #159 using the current analyzer-v2 traceable development artifact.',
              'The next authority-bearing P13 step remains genuine Figma Desktop evidence under #159 using the current analyzer-v2 traceable development artifact.')

          # Project state
          replace_once('memory-bank/PROJECT_STATE.md',
              '7. development-only read-only P14 Guided Prepare preview with exact evidence freshness, proposed-change review binding and persisted-evidence rejection diagnostics;\n8. exact-build release/provenance and fail-closed P12 publisher-evidence tooling.',
              '7. development-only read-only P14 Guided Prepare preview with exact evidence freshness, proposed-change review binding, exact runtime review packet and persisted-evidence rejection diagnostics;\n8. bounded P15 Elementor foundation with v0.4/container validation, documented-core widget capability reporting and a non-authorizing candidate artifact envelope;\n9. exact-build release/provenance and fail-closed P12 publisher-evidence tooling.')
          replace_once('memory-bank/PROJECT_STATE.md',
              'Current verified main after security hardening and analyzer-v2 offline parity alignment:\n\n`9955be0561807550a7ad1444d8d013d783820188`',
              'Current verified main after P14 review-packet, workflow-credential hardening and first P15 foundation slices:\n\n`426314b183f220f66a315a24f9b1122a464909b9`')
          replace_once('memory-bank/PROJECT_STATE.md',
              '- #294 P13 offline analyzer-v2 parity -> `9955be0561807550a7ad1444d8d013d783820188`.\n\nCurrent docs-only synchronization:\n\n- issue #297;\n- branch `docs/post-security-p13-parity-297`;\n- scope limited to README, P14 foundation and memory-bank state/next-actions.',
              '- #294 P13 offline analyzer-v2 parity -> `9955be0561807550a7ad1444d8d013d783820188`;\n- #298 canonical docs sync -> `127c7215a15a36a2aabc62da79a02708903f4cb9`;\n- #300 P14 deterministic runtime review packet -> `3a1f2f96617304aa4251aa4f3e4e112bce13612a`;\n- #302 persisted checkout-credential hardening -> `5295a40839b093a77b3c6d2dc98daa6ac63d5067`;\n- #304 Elementor v0.4/container validator -> `4c6e0f63718a6b38b056c82207e25973356d0d66`;\n- #306 Elementor read-only capability registry/report -> `c242197a2d0a0dd24d7364db5f10c1fb6fa76e13`;\n- #308 non-authorizing Elementor candidate artifact envelope -> `426314b183f220f66a315a24f9b1122a464909b9`.')
          replace_once('memory-bank/PROJECT_STATE.md',
              '- #297 — **ACTIVE docs-only synchronization** through current security/parity/artifact truth.\n\nFocused issues #275, #280, #284, #285, #288 and #295 are completed through their reviewed implementation/artifact flows.',
              'Focused issues #275, #280, #284, #285, #288, #295, #297, #299, #301, #303, #305 and #307 are completed through their reviewed implementation/artifact flows.')
          replace_once('memory-bank/PROJECT_STATE.md',
              '- #280/#281 — precise persisted-evidence rejection diagnostics and fresh-Audit guidance.',
              '- #280/#281 — precise persisted-evidence rejection diagnostics and fresh-Audit guidance;\n- #299/#300 — deterministic exact-context runtime review packet with all P14 authority flags still false.')
          replace_once('memory-bank/PROJECT_STATE.md',
              '## P15-P26 state\n\nP15-P26 remain **preflight frozen / implementation not started**. They may proceed under roadmap #119 when dependency order is reached, with R0 refresh and R1 acceptance contracts where required.',
              '''## P15 state\n\nP15 is now **CORE FOUNDATION IN PROGRESS / TARGET IMPORT UNVALIDATED**. Three bounded offline/read-only layers are merged:\n\n- PR #304 — documented Elementor data version `0.4` modern `container`/`widget` contract with bounded validation; legacy `section`/`column`, Atomic `e-*`, unknown element types, malformed settings, duplicate IDs and resource-limit violations fail closed;\n- PR #306 — versioned read-only capability registry/report for directly evidenced classic widget IDs `heading`, `image`, and `button`; unregistered widgets are `REVIEW_REQUIRED`, with no Pro/add-on availability inference;\n- PR #308 — deterministic candidate artifact envelope with `REJECTED_INVALID_TEMPLATE`, `REVIEW_REQUIRED`, or `READY_FOR_TARGET_IMPORT_VALIDATION` state while `importValidationStatus=NOT_RUN`, `downloadEnabled=false`, `targetCompatibilityClaim=false`, and `productionAcceptance=false`.\n\nNo Figma-to-Elementor semantic auto-mapping/generator, WordPress connection, real Elementor import proof, product download control, Elementor Pro/third-party mapping or Atomic generation has been accepted.\n\n## P16-P26 state\n\nP16-P26 remain **preflight frozen / implementation not started** and proceed under roadmap #119 with R0/R1 gates as applicable.''')
          replace_once('memory-bank/PROJECT_STATE.md',
              'Complete #297 docs-only synchronization and exact-head gates. Then use the current #295 artifact only for genuine #159 Figma Desktop evidence capture/parity review; do not manufacture runtime acceptance in repository CI. Target-neutral/read-only P14 work may continue without changing the locked confirmation/mutation/compatibility authority state.',
              'Keep #159 genuine Figma Desktop evidence as the prerequisite before real P14 mutation exposure. In parallel, continue P15 only through bounded deterministic target-adapter slices: next work must bind any future import-validation evidence to an exact candidate and must not enable product download or target-compatibility authority before real Elementor target validation exists.')

          # Next actions
          start = '## Immediate action — #297 current security/parity status synchronization\n'
          end = '## After #297 — genuine #159 Figma Desktop evidence\n'
          p = Path('memory-bank/NEXT_ACTIONS.md')
          text = p.read_text()
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('NEXT_ACTIONS immediate-action section markers mismatch')
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          replacement = '''## Immediate action — P15 exact-candidate import-validation contract\n\nClassification: **PLANNED / NON-AUTHORITATIVE TARGET EVIDENCE**.\n\nBuild from the merged P15 foundation without guessing Figma widget semantics. The next slice should define deterministic identity/binding for one validated candidate artifact and the shape of a future real Elementor import-validation receipt. It must keep `downloadEnabled=false`, `targetCompatibilityClaim=false`, and `productionAcceptance=false` until genuine target import evidence exists.\n\nDo not introduce a WordPress connection, Pro/add-on availability inference, Atomic generation or product download UI merely to satisfy the offline contract.\n\n## Parallel required runtime evidence — genuine #159 Figma Desktop evidence\n'''
          p.write_text(before + replacement + after)
          replace_once('memory-bank/NEXT_ACTIONS.md',
              '- P14 — deterministic core + fresh read-only Guided Prepare + review manifest/binding + persisted-evidence rejection diagnostics active in development; confirmation/mutation still unwired;\n- P15-P26 — preflight frozen / implementation not started;',
              '- P14 — deterministic core + fresh read-only Guided Prepare + review manifest/binding + exact runtime review packet + persisted-evidence rejection diagnostics active in development; confirmation/mutation still unwired;\n- P15 — core foundation in progress / target import unvalidated: v0.4/container validator, bounded documented-core capability report and non-authorizing candidate envelope are merged;\n- P16-P26 — preflight frozen / implementation not started;')
          old = '''## Definition of done for #297\n\n#297 is complete only when:\n\n1. the four canonical docs/status files match current main/security/parity/artifact truth;\n2. stale #282 current-action references and old current-main SHA are removed from active status text;\n3. no runtime/test/config/workflow files appear in the final diff;\n4. README status/schema contracts remain valid, including the exact P14 status token and empty production registry wording;\n5. no runtime, compatibility or production-authority claim is inflated;\n6. CI + Integration Readiness + Final Release + cross-platform Offline Acceptance pass on the exact docs head;\n7. review state is clean and guarded merge succeeds.\n\nAfter that, proceed from the genuine #159 operator evidence step or another explicitly non-authorizing P14 slice; do not simulate real-Figma acceptance.\n'''
          new = '''## Current guardrails for next work\n\n1. #159 genuine Figma Desktop evidence remains required before real P14 mutation exposure.\n2. P14 production safe-recipe registry remains empty and all four authority flags remain false.\n3. P15 candidate artifacts are not target-import validated; download/compatibility/production authority remains disabled.\n4. Future P15 import-validation evidence must bind to an exact deterministic candidate and retain explicit target/platform version evidence.\n5. #287 remains an admin-level repository protection residual until branch rules are actually enabled.\n6. P12 historical publishing evidence remains unchanged and P27 owns final live release-exit evidence.\n'''
          if old not in p.read_text():
              raise SystemExit('NEXT_ACTIONS #297 done section mismatch')
          p.write_text(p.read_text().replace(old, new, 1))

          # Ensure canonical invariants before committing.
          checks = {
              'README.md': [
                  'CORE IMPLEMENTATION IN PROGRESS / RUNTIME UNWIRED',
                  'production registry remains empty',
                  'CORE FOUNDATION IN PROGRESS / TARGET IMPORT UNVALIDATED',
                  'config/runtime-artifacts.json` schema v3',
              ],
              'memory-bank/PROJECT_STATE.md': [
                  '`config/runtime-artifacts.json` is runtime artifact registry schema v3',
                  'acceptanceAuthority=false',
                  'targetCompatibilityClaim=false',
                  'mutationEnabled=false',
                  'confirmationEnabled=false',
              ],
              'memory-bank/NEXT_ACTIONS.md': [
                  'Runtime artifact preflight requires `config/runtime-artifacts.json` schema-v3',
                  'production safe-recipe registry remains empty',
              ],
          }
          for file, needles in checks.items():
              content = Path(file).read_text()
              for needle in needles:
                  if needle not in content:
                      raise SystemExit(f'{file}: missing invariant {needle!r}')
          PY
          npm ci
          npm run status:verify
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "README.md docs/P14_FOUNDATION_IMPLEMENTATION.md memory-bank/NEXT_ACTIONS.md memory-bank/PROJECT_STATE.md "
      - name: Commit docs and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/docs-sync-309.yml
          git add README.md docs/P14_FOUNDATION_IMPLEMENTATION.md memory-bank/PROJECT_STATE.md memory-bank/NEXT_ACTIONS.md .github/workflows/docs-sync-309.yml
          git diff --cached --check
          git commit -m "Docs: sync P14 review packet and P15 foundation status (#309)"
          git push origin HEAD:docs/p14-p15-status-sync-309
