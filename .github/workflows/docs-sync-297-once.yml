name: Docs Sync 297 Once

on:
  pull_request:
    paths:
      - '.github/workflows/docs-sync-297-once.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/post-security-p13-parity-297'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact docs branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply bounded canonical status replacements
        shell: bash
        run: |
          test "$GITHUB_HEAD_REF" = "docs/post-security-p13-parity-297"
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # README
          replace_once('README.md',
            '- `#182` — P27 final production-release gate coordinating remaining live/manual release evidence and final release decision.\n- `#282` — docs-only synchronization of canonical P13/P14 status through verified PR #281.\n\nCurrent verified main before #282 docs synchronization is:\n\n`801075561f22a1738219e58e9f39096705dc80ac`',
            '- `#182` — P27 final production-release gate coordinating remaining live/manual release evidence and final release decision.\n- `#287` — repository-admin branch-protection/ruleset hardening remains open because it requires GitHub administration access.\n\nCurrent verified main is:\n\n`9955be0561807550a7ad1444d8d013d783820188`')

          readme_anchor = '- PR #281 preserved persisted-evidence inspection status/reasons (`VALID`, `EMPTY`, `INVALID`, `READ_FAILED`, `QUARANTINED`) and surfaced exact fresh-Audit diagnostics in the development P13 viewer and P14 preview. Exact head `e201f43a7b11355daa2b73c957f82ce397bb6003` passed CI #1028, P12 Final Release Artifact #339 and P12 Offline Acceptance #383 before guarded squash merge `801075561f22a1738219e58e9f39096705dc80ac`. Integration Readiness did not trigger for this code-only diff.'
          replace_once('README.md', readme_anchor, readme_anchor + '''\n- PR #283 synchronized the canonical P13/P14 status docs through PR #281 and guarded squash-merged as `54fad8332e9ef4d41c5ccd2c5ccda4fb10247c5c`; exact head passed CI #1030, Integration Readiness #349, P12 Final Release Artifact #341 and P12 Offline Acceptance #385.\n- PR #286 hardened dependency/workflow supply-chain controls with a committed lockfile, `npm ci`, immutable first-party action SHAs, Dependabot and secret-file ignore coverage, then guarded squash-merged as `245a045fcbc30bd2ec81edb06dba65119e358a50`. Exact head passed CI #1048, Integration Readiness #362, P12 Final Release Artifact #359 and P12 Offline Acceptance #403; a one-time locked `npm audit --audit-level=high` reported 0 vulnerabilities.\n- PR #293 hardened the P3 UI pixel-broker boundary so malformed/tampered metrics and oversized broker images fail closed, then guarded squash-merged as `47dbc078b0a41cbbe5301d6e0d95d5ca33cc8721`. Exact head passed CI #1054, P12 Final Release Artifact #365 and P12 Offline Acceptance #409; Integration Readiness did not trigger for this code-only diff.\n- PR #294 aligned the operator-facing P13 offline parity intake with `p13-core-v2` analyzer-bound run identity and guarded squash-merged as `9955be0561807550a7ad1444d8d013d783820188`. Exact head `68189da1fba9b42610cc932e1193851c8c7e9636` passed CI #1056, P12 Final Release Artifact #367 and P12 Offline Acceptance #411; Integration Readiness did not trigger for this code-only diff.\n- Issue #295 regenerated the current traceable, non-publishable P13 development runtime artifact from source `9955be0561807550a7ad1444d8d013d783820188`: Actions run `34833881774`, artifact `p13-runtime-evidence-9955be056180-analyzer-v2`, ID `10343017256`, digest `sha256:b3e5a07a5a012f9c1f4deec32389ad83a0e8550580f60de408db14644de5f1fe`. The artifact does not grant runtime acceptance; #159 remains open for genuine Figma Desktop evidence.''')

          old_p14_row = '| P14 Target-Ready Duplicate + Guided Prepare | CORE IMPLEMENTATION IN PROGRESS / RUNTIME UNWIRED | N/A | `──────────` | Complete #282 status sync; read-only preview requires current analyzer/fresh evidence and shows rejection diagnostics; real candidate remains REVIEW/BLOCKED because production registry remains empty; retained-duplicate mutation runtime is unwired; #159 required before real Figma mutation exposure |'
          new_p14_row = '| P14 Target-Ready Duplicate + Guided Prepare | CORE IMPLEMENTATION IN PROGRESS / RUNTIME UNWIRED | N/A | `──────────` | Read-only preview requires current analyzer/fresh evidence and shows rejection diagnostics; real candidate remains REVIEW/BLOCKED because production registry remains empty; retained-duplicate mutation runtime is unwired; #159 current real-Figma evidence remains required before real Figma mutation exposure |'
          replace_once('README.md', old_p14_row, new_p14_row)

          readme_evidence_anchor = 'Persisted evidence inspection distinguishes `VALID`, `EMPTY`, `INVALID`, `READ_FAILED` and `QUARANTINED`. Rejection/read/quarantine reasons are bounded. The development P13 evidence viewer and P14 Guided Prepare preview surface those reasons and require a fresh Audit rather than silently treating rejected evidence as current.'
          replace_once('README.md', readme_evidence_anchor, readme_evidence_anchor + '''\n\nThe operator-facing offline parity intake now independently enforces `p13-core-v2`, requires the analyzer-bound `runId`, includes analyzer version in exact run identity and emits explicit per-side run-identity evidence while keeping `generatedAt` non-semantic. Stale analyzer evidence and forged run IDs fail before a parity receipt is written.\n\nThe current traceable development artifact for the next genuine #159 attempt is `p13-runtime-evidence-9955be056180-analyzer-v2` (artifact ID `10343017256`, source `9955be0561807550a7ad1444d8d013d783820188`). It is explicitly non-authorizing and do-not-publish.''')

          replace_once('README.md', '```bash\nnpm install\nnpm run status:verify', '```bash\nnpm ci\nnpm run status:verify')

          # P14 foundation doc
          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md', 'Current status synchronization: #282', 'Current status synchronization: #297')
          p14_prov_anchor = '- `generatedAt` remains non-semantic runtime metadata.'
          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md', p14_prov_anchor, p14_prov_anchor + '''\n\nPR #294 extends the same identity contract to the operator-facing offline runtime-parity intake. The script now requires current `p13-core-v2` input on both sides, requires exact analyzer-bound run IDs, includes analyzer version in `sameRunIdentity` and receipt evidence, and rejects stale/forged identity before writing an acceptance-candidate receipt.''')

          p14_diag_anchor = 'The existing `loadLatestP13RuntimeEvidence(): bundle | null` helper remains compatible; valid-evidence semantics do not change.'
          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md', p14_diag_anchor, p14_diag_anchor + '''\n\n## Current real-Figma evidence candidate\n\nIssue #295 regenerated the traceable development artifact after the analyzer-v2 parity and security changes. The current operator candidate is:\n\n- source `9955be0561807550a7ad1444d8d013d783820188`;\n- Actions run `34833881774`;\n- artifact `p13-runtime-evidence-9955be056180-analyzer-v2`;\n- artifact ID `10343017256`;\n- digest `sha256:b3e5a07a5a012f9c1f4deec32389ad83a0e8550580f60de408db14644de5f1fe`;\n- analyzer `p13-core-v2`;\n- plugin ID `1680034649341961379`;\n- `networkAccess.allowedDomains=["none"]`;\n- `acceptanceAuthority=false`, `productionReleaseArtifact=false`, `doNotPublish=true`, `targetCompatibilityClaim=false`.\n\nThe artifact-only branch was returned to zero content diff after capture. This is current input for the genuine #159 Figma Desktop step, not runtime acceptance or production authority.''')

          p14_verify_anchor = 'Earlier retained review-manifest / real-candidate / human-review-binding proof remains recorded in PRs #269, #270 and #272.'
          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md', p14_verify_anchor, '''### PR #286 — supply-chain hardening\n\nGuarded squash merge `245a045fcbc30bd2ec81edb06dba65119e358a50` retained a deterministic npm lockfile, `npm ci`, immutable first-party action pins, weekly Dependabot and secret-file ignore coverage. Exact head passed CI #1048, Integration Readiness #362, P12 Final Release Artifact #359 and P12 Offline Acceptance #403.\n\n### PR #293 — P3 pixel-broker fail-closed hardening\n\nGuarded squash merge `47dbc078b0a41cbbe5301d6e0d95d5ca33cc8721` validates UI-broker pixel evidence before it can satisfy P3 and bounds encoded/decoded image work. Exact head passed CI #1054, P12 Final Release Artifact #365 and P12 Offline Acceptance #409; Integration Readiness did not trigger for the code-only diff.\n\n### PR #294 — offline analyzer-v2 parity identity\n\nExact head `68189da1fba9b42610cc932e1193851c8c7e9636` passed CI #1056, P12 Final Release Artifact #367 and P12 Offline Acceptance #411 before guarded squash merge `9955be0561807550a7ad1444d8d013d783820188`. Integration Readiness did not trigger for the code-only diff.\n\n''' + p14_verify_anchor)

          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md', '''Current main is:\n\n`801075561f22a1738219e58e9f39096705dc80ac`\n\nCanonical status synchronization is tracked by #282 on `docs/p13-v2-evidence-diagnostics-282`.''', '''Current main is:\n\n`9955be0561807550a7ad1444d8d013d783820188`\n\nCanonical status synchronization is tracked by #297 on `docs/post-security-p13-parity-297`.''')
          replace_once('docs/P14_FOUNDATION_IMPLEMENTATION.md', '''After #282 status synchronization closes, run the next focused P13/P14 implementation-gap audit. Do not infer that current analyzer provenance, persisted-evidence diagnostics, a real P13 candidate or a review manifest authorizes confirmation or mutation. Any future confirmation/mutation surface requires an explicit separate contract preserving exact evidence freshness, production recipe authorization, candidate-only mutation, validation/re-score/source-immutability gates, fail-closed cleanup, and #159 real-Figma runtime evidence before real mutation exposure.''', '''After #297 status synchronization, the next authority-bearing P13 step is genuine Figma Desktop evidence under #159 using the current analyzer-v2 traceable development artifact. Until that evidence is captured and separately reviewed, do not expose real P14 Figma mutation. Target-neutral/read-only P14 work may continue, but current analyzer provenance, offline parity, persisted-evidence diagnostics, the real P13 candidate and the review manifest remain non-authorizing. Any future confirmation/mutation surface requires an explicit separate contract preserving exact evidence freshness, production recipe authorization, candidate-only mutation, validation/re-score/source-immutability gates and fail-closed cleanup.''')

          # PROJECT_STATE
          replace_once('memory-bank/PROJECT_STATE.md', 'Last updated: 2026-09-13', 'Last updated: 2026-09-14')
          old_main_block = '''Current verified main after P13 persisted-evidence diagnostic hardening:\n\n`801075561f22a1738219e58e9f39096705dc80ac`\n\nThat is the guarded squash merge of PR #281.\n\nCurrent docs-only synchronization:\n\n- issue #282;\n- branch `docs/p13-v2-evidence-diagnostics-282`;\n- scope limited to README, P14 foundation and memory-bank state/next-actions.'''
          new_main_block = '''Current verified main after security hardening and analyzer-v2 offline parity alignment:\n\n`9955be0561807550a7ad1444d8d013d783820188`\n\nRecent guarded merge line:\n\n- #283 docs sync -> `54fad8332e9ef4d41c5ccd2c5ccda4fb10247c5c`;\n- #286 supply-chain security -> `245a045fcbc30bd2ec81edb06dba65119e358a50`;\n- #293 P3 pixel-broker fail-closed security -> `47dbc078b0a41cbbe5301d6e0d95d5ca33cc8721`;\n- #294 P13 offline analyzer-v2 parity -> `9955be0561807550a7ad1444d8d013d783820188`.\n\nCurrent docs-only synchronization:\n\n- issue #297;\n- branch `docs/post-security-p13-parity-297`;\n- scope limited to README, P14 foundation and memory-bank state/next-actions.'''
          replace_once('memory-bank/PROJECT_STATE.md', old_main_block, new_main_block)
          replace_once('memory-bank/PROJECT_STATE.md', '- #282 — **ACTIVE docs-only synchronization** through PR #281.\n\nFocused issues #275 and #280 are completed through PRs #279 and #281.', '- #287 — **OPEN repository-admin security hardening**. Main branch protection/ruleset enforcement requires GitHub administration access and is not represented as fixed by code changes.\n- #297 — **ACTIVE docs-only synchronization** through current security/parity/artifact truth.\n\nFocused issues #275, #280, #284, #285, #288 and #295 are completed through their reviewed implementation/artifact flows.')

          project_p13_anchor = 'The compatibility helper `loadLatestP13RuntimeEvidence(): bundle | null` remains available; accepted evidence semantics are unchanged.'
          replace_once('memory-bank/PROJECT_STATE.md', project_p13_anchor, project_p13_anchor + '''\n\nPR #294 brings the offline operator intake under the same current identity contract: both plugin evidence and CLI Build-Ready input must use `p13-core-v2`, each run ID must bind exact structural/config/analyzer identity, analyzer version participates in `sameRunIdentity`, and stale/forged identity fails before a receipt is written. `generatedAt` remains the intentionally ignored semantic-comparison field.\n\nIssue #295 then regenerated the traceable development artifact for the genuine #159 attempt from current source `9955be0561807550a7ad1444d8d013d783820188`: run `34833881774`, artifact `p13-runtime-evidence-9955be056180-analyzer-v2`, ID `10343017256`, digest `sha256:b3e5a07a5a012f9c1f4deec32389ad83a0e8550580f60de408db14644de5f1fe`. It remains non-authorizing/do-not-publish and #159 remains open.''')

          project_verify_anchor = 'Earlier retained review-manifest / real-candidate / review-binding proof remains recorded in PRs #269, #270 and #272.'
          replace_once('memory-bank/PROJECT_STATE.md', project_verify_anchor, '''### PR #286 — dependency/workflow supply-chain hardening\n\n- guarded squash merge `245a045fcbc30bd2ec81edb06dba65119e358a50`;\n- CI #1048 — PASS;\n- Integration Readiness #362 — PASS;\n- P12 Final Release Artifact #359 — PASS;\n- P12 Offline Acceptance #403 — PASS Windows/macOS/Ubuntu;\n- one-time locked npm audit reported 0 vulnerabilities.\n\n### PR #293 — P3 pixel-broker fail-closed hardening\n\n- exact head `fe8dd4c25802eb77acd375f3e14874568db9f988`;\n- CI #1054 — PASS;\n- P12 Final Release Artifact #365 — PASS;\n- P12 Offline Acceptance #409 — PASS Windows/macOS/Ubuntu;\n- Integration Readiness did not trigger for the code-only diff;\n- guarded squash merge `47dbc078b0a41cbbe5301d6e0d95d5ca33cc8721`.\n\n### PR #294 — analyzer-v2 offline runtime parity intake\n\n- exact head `68189da1fba9b42610cc932e1193851c8c7e9636`;\n- CI #1056 — PASS;\n- P12 Final Release Artifact #367 — PASS;\n- P12 Offline Acceptance #411 — PASS Windows/macOS/Ubuntu;\n- Integration Readiness did not trigger for the code-only diff;\n- guarded squash merge `9955be0561807550a7ad1444d8d013d783820188`.\n\n''' + project_verify_anchor)
          replace_once('memory-bank/PROJECT_STATE.md', '''Complete #282 docs-only synchronization and exact-head gates. After merge, audit the next P13/P14 implementation gap without treating analyzer provenance, evidence diagnostics, the review manifest or the real P13 candidate as confirmation/mutation authority.''', '''Complete #297 docs-only synchronization and exact-head gates. Then use the current #295 artifact only for genuine #159 Figma Desktop evidence capture/parity review; do not manufacture runtime acceptance in repository CI. Target-neutral/read-only P14 work may continue without changing the locked confirmation/mutation/compatibility authority state.''')

          # NEXT_ACTIONS: replace the stale immediate/after block through the #159 heading.
          next_path = Path('memory-bank/NEXT_ACTIONS.md')
          next_text = next_path.read_text().replace('Last updated: 2026-09-13', 'Last updated: 2026-09-14', 1)
          start = next_text.index('## Immediate action — #282')
          end = next_text.index('## #159 — P13 real-plugin runtime/parity acceptance')
          new_immediate = '''## Immediate action — #297 current security/parity status synchronization\n\nClassification: **ACTIVE / DOCS ONLY**.\n\nBranch:\n\n`docs/post-security-p13-parity-297`\n\nBase main:\n\n`9955be0561807550a7ad1444d8d013d783820188`\n\nRequired surfaces only:\n\n- `README.md`;\n- `docs/P14_FOUNDATION_IMPLEMENTATION.md`;\n- `memory-bank/PROJECT_STATE.md`;\n- `memory-bank/NEXT_ACTIONS.md`.\n\nRecord the completed sequence through security hardening, analyzer-v2 offline parity and the current non-publishable P13 runtime artifact while preserving every P14 authority lock and the historical P12 publishing candidate.\n\nBefore merge, exact docs head must pass CI, Integration Readiness, P12 Final Release Artifact, P12 Offline Acceptance on Windows/macOS/Ubuntu, clean review-thread state and current/mergeable branch state.\n\n## After #297 — genuine #159 Figma Desktop evidence\n\nThe current traceable operator artifact is `p13-runtime-evidence-9955be056180-analyzer-v2`, artifact ID `10343017256`, source `9955be0561807550a7ad1444d8d013d783820188`, digest `sha256:b3e5a07a5a012f9c1f4deec32389ad83a0e8550580f60de408db14644de5f1fe`.\n\nUse it only for the real Figma Desktop evidence step. Repository CI cannot substitute for that runtime evidence. Preserve these boundaries:\n\n- current analyzer `p13-core-v2`;\n- exact analyzer-bound run identity;\n- stale/forged evidence fails closed;\n- Guided Prepare remains development-only/read-only;\n- `acceptanceAuthority=false`;\n- `targetCompatibilityClaim=false`;\n- `mutationEnabled=false`;\n- `confirmationEnabled=false`;\n- production safe-recipe registry remains empty;\n- no real retained-duplicate Figma mutation command/adapter is exposed;\n- publishable release UI remains free of development-only P14 controls;\n- #159 evidence is required before real P14 Figma mutation exposure.\n\n'''
          next_text = next_text[:start] + new_immediate + next_text[end:]
          next_path.write_text(next_text)

          next_text = next_path.read_text()
          start = next_text.index('## #159 — P13 real-plugin runtime/parity acceptance')
          end = next_text.index('## #84 — P12 retained release-exit truth')
          new_159 = '''## #159 — P13 real-plugin runtime/parity acceptance\n\nClassification: **OPEN / required before real P14 mutation exposure**.\n\nCurrent implementation and operator tooling are ready, but genuine real-plugin runtime acceptance remains pending. Use the current #295 artifact, not the superseded pre-analyzer-bound pack.\n\nRequired genuine sequence:\n\n1. import the current development artifact in Figma Desktop;\n2. open the intended accepted real file/frame and run Audit on exactly one current Frame;\n3. open the P13 runtime evidence developer viewer and copy the exact evidence JSON unchanged;\n4. require `p13-core-v2`, exact analyzer-bound run ID, traceable build identity and real file/page/frame context;\n5. generate/use the matching current CLI Build-Ready report for that exact deterministic identity;\n6. run the current `p13:runtime-parity` intake;\n7. review any mismatches explicitly rather than normalizing them away;\n8. retain a separate internal runtime-acceptance decision.\n\n#159 does not block target-neutral P14 core/read-only development. It remains a prerequisite before real P14 Figma mutation exposure.\n\n## #287 — repository-admin security enforcement\n\nClassification: **OPEN / ADMIN-LEVEL RESIDUAL**.\n\nCode-side supply-chain and pixel-broker security hardening is merged, but `main` branch protection/ruleset enforcement requires GitHub administration access unavailable to the current connector. Required admin controls remain PR enforcement, conversation resolution, blocking force-push/deletion and required exact-head CI/release/offline checks. Do not describe this repository setting as fixed until it is actually enabled.\n\n'''
          next_path.write_text(next_text[:start] + new_159 + next_text[end:])

          next_proof_anchor = '''### PR #281 — persisted-evidence diagnostics\n\n- exact head `e201f43a7b11355daa2b73c957f82ce397bb6003`;\n- CI #1028 — PASS;\n- P12 Final Release Artifact #339 — PASS;\n- P12 Offline Acceptance #383 — PASS Windows/macOS/Ubuntu;\n- Integration Readiness did not trigger for the code-only diff;\n- guarded squash merge `801075561f22a1738219e58e9f39096705dc80ac`.'''
          replace_once('memory-bank/NEXT_ACTIONS.md', next_proof_anchor, next_proof_anchor + '''\n\n### PR #286 — supply-chain hardening\n\n- guarded squash merge `245a045fcbc30bd2ec81edb06dba65119e358a50`;\n- CI #1048, Integration Readiness #362, Final Release #359 and Offline #403 — PASS;\n- locked npm advisory scan — 0 vulnerabilities.\n\n### PR #293 — P3 pixel-broker hardening\n\n- guarded squash merge `47dbc078b0a41cbbe5301d6e0d95d5ca33cc8721`;\n- CI #1054, Final Release #365 and Offline #409 — PASS;\n- Integration Readiness did not trigger for the code-only diff.\n\n### PR #294 — offline analyzer-v2 parity\n\n- guarded squash merge `9955be0561807550a7ad1444d8d013d783820188`;\n- exact head `68189da1fba9b42610cc932e1193851c8c7e9636`;\n- CI #1056, Final Release #367 and Offline #411 — PASS;\n- Integration Readiness did not trigger for the code-only diff.\n\n### Issue #295 — current P13 runtime evidence artifact\n\n- run `34833881774`;\n- artifact ID `10343017256`;\n- digest `sha256:b3e5a07a5a012f9c1f4deec32389ad83a0e8550580f60de408db14644de5f1fe`;\n- artifact branch returned to zero content diff;\n- artifact remains non-authorizing/do-not-publish.''')

          next_text = next_path.read_text()
          start = next_text.index('## Definition of done for #282')
          next_text = next_text[:start] + '''## Definition of done for #297\n\n#297 is complete only when:\n\n1. the four canonical docs/status files match current main/security/parity/artifact truth;\n2. stale #282 current-action references and old current-main SHA are removed from active status text;\n3. no runtime/test/config/workflow files appear in the final diff;\n4. README status/schema contracts remain valid, including the exact P14 status token and empty production registry wording;\n5. no runtime, compatibility or production-authority claim is inflated;\n6. CI + Integration Readiness + Final Release + cross-platform Offline Acceptance pass on the exact docs head;\n7. review state is clean and guarded merge succeeds.\n\nAfter that, proceed from the genuine #159 operator evidence step or another explicitly non-authorizing P14 slice; do not simulate real-Figma acceptance.\n'''
          next_path.write_text(next_text)
          PY

      - name: Verify canonical status invariants
        shell: bash
        run: |
          node scripts/verify-readme-progress.mjs
          grep -F '| P14 Target-Ready Duplicate + Guided Prepare | CORE IMPLEMENTATION IN PROGRESS / RUNTIME UNWIRED | N/A | `──────────` |' README.md
          grep -F 'production registry remains empty' README.md
          grep -F 'Machine-readable operational registry: `config/runtime-artifacts.json` schema v3.' README.md
          grep -F '`config/runtime-artifacts.json` is runtime artifact registry schema v3' memory-bank/PROJECT_STATE.md
          grep -F 'Runtime artifact preflight requires `config/runtime-artifacts.json` schema-v3' memory-bank/NEXT_ACTIONS.md
          grep -F 'acceptanceAuthority=false' docs/P14_FOUNDATION_IMPLEMENTATION.md
          grep -F 'targetCompatibilityClaim=false' docs/P14_FOUNDATION_IMPLEMENTATION.md
          grep -F 'mutationEnabled=false' docs/P14_FOUNDATION_IMPLEMENTATION.md
          grep -F 'confirmationEnabled=false' docs/P14_FOUNDATION_IMPLEMENTATION.md
          git diff --check

      - name: Remove one-time workflow and commit docs only
        shell: bash
        run: |
          rm .github/workflows/docs-sync-297-once.yml
          git add -- README.md docs/P14_FOUNDATION_IMPLEMENTATION.md memory-bank/PROJECT_STATE.md memory-bank/NEXT_ACTIONS.md .github/workflows/docs-sync-297-once.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' README.md docs/P14_FOUNDATION_IMPLEMENTATION.md memory-bank/NEXT_ACTIONS.md memory-bank/PROJECT_STATE.md | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync security and analyzer-v2 P13 status'
          git push origin HEAD:"$GITHUB_HEAD_REF"
