name: P15 Real Elementor Target Proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p15-real-target-proof-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-target-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mariadb:
        image: mariadb@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Install repository dependencies
        run: npm ci

      - name: Freeze exact canonical P15 v3 vector
        run: |
          npm run p15:elementor-first-proof-vector -- \
            --out-dir dist-p15/p15-elementor-first-proof-vector-v3

      - name: Prepare proof identity and output paths
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist-p15/p15-real-target-proof"
          echo "P15_PROOF_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "P15_EVIDENCE_REFERENCE=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "P15_VECTOR_DIR=$GITHUB_WORKSPACE/dist-p15/p15-elementor-first-proof-vector-v3" >> "$GITHUB_ENV"
          echo "P15_VECTOR_PATH=$GITHUB_WORKSPACE/dist-p15/p15-elementor-first-proof-vector-v3/template.json" >> "$GITHUB_ENV"
          echo "P15_TEMPLATE_SHA256=$(jq -r '.fileSha256.template' dist-p15/p15-elementor-first-proof-vector-v3/manifest.json)" >> "$GITHUB_ENV"
          echo "P15_PROOF_OUT_DIR=$GITHUB_WORKSPACE/dist-p15/p15-real-target-proof" >> "$GITHUB_ENV"
          echo "P15_BASE_URL=http://127.0.0.1:8080" >> "$GITHUB_ENV"

      - name: Install PHP runtime extensions
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mysql php-curl php-zip php-mbstring php-xml unzip

      - name: Provision exact WordPress 6.8 and Elementor 4.2.4
        run: |
          set -euo pipefail

          WP_ROOT="$RUNNER_TEMP/p15-wordpress"
          rm -rf "$WP_ROOT"
          curl --retry 3 --fail --silent --show-error \
            https://wordpress.org/wordpress-6.8.tar.gz \
            -o "$RUNNER_TEMP/wordpress-6.8.tar.gz"
          printf '%s  %s\n' \
            'f7dbedc423ddb3f2f3e98e9140f1720bfd6d4a8f4873c85da2e62f6a078de10a' \
            "$RUNNER_TEMP/wordpress-6.8.tar.gz" \
            | sha256sum --check --strict -
          WORDPRESS_ARCHIVE_SHA256="$(sha256sum "$RUNNER_TEMP/wordpress-6.8.tar.gz" | awk '{print $1}')"
          tar -xzf "$RUNNER_TEMP/wordpress-6.8.tar.gz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/wordpress" "$WP_ROOT"

          cat > "$WP_ROOT/wp-config.php" <<'PHP'
          <?php
          define( 'DB_NAME', 'wordpress' );
          define( 'DB_USER', 'wordpress' );
          define( 'DB_PASSWORD', 'wordpress' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'DB_CHARSET', 'utf8mb4' );
          define( 'DB_COLLATE', '' );
          define( 'AUTH_KEY', 'p15-proof-auth-key' );
          define( 'SECURE_AUTH_KEY', 'p15-proof-secure-auth-key' );
          define( 'LOGGED_IN_KEY', 'p15-proof-logged-in-key' );
          define( 'NONCE_KEY', 'p15-proof-nonce-key' );
          define( 'AUTH_SALT', 'p15-proof-auth-salt' );
          define( 'SECURE_AUTH_SALT', 'p15-proof-secure-auth-salt' );
          define( 'LOGGED_IN_SALT', 'p15-proof-logged-in-salt' );
          define( 'NONCE_SALT', 'p15-proof-nonce-salt' );
          define( 'WP_MEMORY_LIMIT', '256M' );
          define( 'WP_MAX_MEMORY_LIMIT', '256M' );
          define( 'WP_DEBUG', false );
          define( 'DISABLE_WP_CRON', true );
          define( 'WP_HOME', 'http://127.0.0.1:8080' );
          define( 'WP_SITEURL', 'http://127.0.0.1:8080' );
          $table_prefix = 'wp_';
          if ( ! defined( 'ABSPATH' ) ) {
              define( 'ABSPATH', __DIR__ . '/' );
          }
          require_once ABSPATH . 'wp-settings.php';
          PHP

          nohup php -S 127.0.0.1:8080 -t "$WP_ROOT" \
            > "$P15_PROOF_OUT_DIR/php-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/p15-php-server.pid"

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/wp-admin/install.php \
              > /dev/null; then
              break
            fi
            sleep 1
          done

          ADMIN_PASSWORD="$(openssl rand -hex 24)"
          curl --fail --silent --show-error --location \
            --request POST \
            --data-urlencode "weblog_title=P15 Real Target Proof" \
            --data-urlencode "user_name=p15proofadmin" \
            --data-urlencode "admin_password=$ADMIN_PASSWORD" \
            --data-urlencode "admin_password2=$ADMIN_PASSWORD" \
            --data-urlencode "admin_email=p15-proof@example.invalid" \
            --data-urlencode "blog_public=0" \
            --data-urlencode "Submit=Install WordPress" \
            "http://127.0.0.1:8080/wp-admin/install.php?step=2" \
            -o "$P15_PROOF_OUT_DIR/wordpress-install-response.html"

          curl --retry 3 --fail --silent --show-error \
            https://downloads.wordpress.org/plugin/elementor.4.2.4.zip \
            -o "$RUNNER_TEMP/elementor.4.2.4.zip"
          printf '%s  %s\n' \
            'eaff579f54079b72063c4ee67e607228eeb5d7eaff4cb13e889a262a1d3ca7a3' \
            "$RUNNER_TEMP/elementor.4.2.4.zip" \
            | sha256sum --check --strict -
          ELEMENTOR_ARCHIVE_SHA256="$(sha256sum "$RUNNER_TEMP/elementor.4.2.4.zip" | awk '{print $1}')"
          printf '%s\n' \
            "{\"wordpress68TarGz\":\"$WORDPRESS_ARCHIVE_SHA256\",\"elementor424Zip\":\"$ELEMENTOR_ARCHIVE_SHA256\"}" \
            > "$P15_PROOF_OUT_DIR/upstream-download-sha256.json"
          unzip -q "$RUNNER_TEMP/elementor.4.2.4.zip" -d "$WP_ROOT/wp-content/plugins"

          mkdir -p "$WP_ROOT/wp-content/plugins/p15-real-target-proof-bridge"
          cp scripts/p15-real-target-proof-bridge.php \
            "$WP_ROOT/wp-content/plugins/p15-real-target-proof-bridge/p15-real-target-proof-bridge.php"

          P15_WP_ROOT="$WP_ROOT" php -r '
          require getenv("P15_WP_ROOT") . "/wp-load.php";
          require_once ABSPATH . "wp-admin/includes/plugin.php";
          foreach ( array(
              "elementor/elementor.php",
              "p15-real-target-proof-bridge/p15-real-target-proof-bridge.php",
          ) as $plugin ) {
              if ( ! is_plugin_active( $plugin ) ) {
                  $result = activate_plugin( $plugin, "", false, false );
                  if ( is_wp_error( $result ) ) {
                      fwrite( STDERR, "P15 activation failed for " . $plugin . ": " . $result->get_error_message() . PHP_EOL );
                      exit( 2 );
                  }
              }
          }
          $kit_id = (int) get_option( "elementor_active_kit", 0 );
          if ( $kit_id <= 0 ) {
              fwrite( STDERR, "Elementor activation did not create a default kit." . PHP_EOL );
              exit( 3 );
          }
          fwrite( STDOUT, "elementor_active_kit=" . $kit_id . PHP_EOL );
          '

          curl --fail --silent --show-error \
            "$P15_BASE_URL/?p15_proof_observe=$P15_PROOF_TOKEN" \
            -o "$P15_PROOF_OUT_DIR/pre-browser-server-observation.json"

          jq -e '.importResult == "PASS"' \
            "$P15_PROOF_OUT_DIR/pre-browser-server-observation.json"
          jq -e '.environment.wordpressVersion == "6.8"' \
            "$P15_PROOF_OUT_DIR/pre-browser-server-observation.json"
          jq -e '.environment.elementorVersion == "4.2.4"' \
            "$P15_PROOF_OUT_DIR/pre-browser-server-observation.json"
          jq -e '.templateType == "page"' \
            "$P15_PROOF_OUT_DIR/pre-browser-server-observation.json"

      - name: Resolve policy-supported Chrome
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Google Chrome is unavailable on the runner." >&2
            exit 2
          fi
          echo "P15_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Observe real Elementor import editor and render
        id: browser-proof
        continue-on-error: true
        run: node scripts/p15-real-target-proof-browser.mjs

      - name: Run repository P15 evidence intakes
        id: p15-intakes
        if: always()
        run: |
          set +e

          ENV_CODE=99
          PROOF_CODE=99
          CHAIN_CODE=99

          if [ -f "$P15_PROOF_OUT_DIR/environment-evidence.json" ]; then
            npm run p15:elementor-target-environment-intake -- \
              --evidence "$P15_PROOF_OUT_DIR/environment-evidence.json" \
              --out "$P15_PROOF_OUT_DIR/environment-intake.json"
            ENV_CODE=$?
          fi

          if [ -f "$P15_PROOF_OUT_DIR/proof-evidence.json" ]; then
            npm run p15:elementor-target-proof-intake -- \
              --candidate "$P15_VECTOR_DIR/candidate.json" \
              --profile "$P15_VECTOR_DIR/target-profile.json" \
              --proof "$P15_PROOF_OUT_DIR/proof-evidence.json" \
              --out "$P15_PROOF_OUT_DIR/proof-intake.json"
            PROOF_CODE=$?

            npm run p15:elementor-target-proof-chain-intake -- \
              --candidate "$P15_VECTOR_DIR/candidate.json" \
              --profile "$P15_VECTOR_DIR/target-profile.json" \
              --environment "$P15_PROOF_OUT_DIR/environment-evidence.json" \
              --proof "$P15_PROOF_OUT_DIR/proof-evidence.json" \
              --out "$P15_PROOF_OUT_DIR/chain-intake.json"
            CHAIN_CODE=$?
          fi

          echo "P15_ENV_INTAKE_CODE=$ENV_CODE" >> "$GITHUB_ENV"
          echo "P15_PROOF_INTAKE_CODE=$PROOF_CODE" >> "$GITHUB_ENV"
          echo "P15_CHAIN_INTAKE_CODE=$CHAIN_CODE" >> "$GITHUB_ENV"
          exit 0

      - name: Retain server diagnostics
        if: always()
        run: |
          set +e
          cp "$P15_PROOF_OUT_DIR/php-server.log" \
            "$P15_PROOF_OUT_DIR/php-server-final.log" 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: p15-real-elementor-target-proof
          path: |
            dist-p15/p15-elementor-first-proof-vector-v3/
            dist-p15/p15-real-target-proof/
          if-no-files-found: error

      - name: Enforce qualified exact-bound proof chain
        if: always()
        run: |
          set -euo pipefail
          test "$P15_ENV_INTAKE_CODE" = "0"
          test "$P15_PROOF_INTAKE_CODE" = "0"
          test "$P15_CHAIN_INTAKE_CODE" = "0"

          jq -e '.classification == "QUALIFIED_FOR_BOUND_TARGET_PROOF"' \
            "$P15_PROOF_OUT_DIR/environment-intake.json"
          jq -e '.classification == "BOUND_FULL_PASS"' \
            "$P15_PROOF_OUT_DIR/proof-intake.json"
          jq -e '.classification == "CHAIN_FULL_PASS"' \
            "$P15_PROOF_OUT_DIR/chain-intake.json"

          jq -e '.candidateBindingMatches == true and .profileBindingMatches == true' \
            "$P15_PROOF_OUT_DIR/proof-intake.json"
          jq -e '.environmentQualified == true and .runtimeBindingMatches == true and .evidenceReferenceMatches == true and .chronologyValid == true' \
            "$P15_PROOF_OUT_DIR/chain-intake.json"
