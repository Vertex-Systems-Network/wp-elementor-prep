name: One-shot P12 rehearsal status sync

on:
  push:
    branches: [docs/p12-p5-rehearsal-sync]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[status-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/p12-p5-rehearsal-sync
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Synchronize status surfaces
        run: node scripts/one-shot-p12-rehearsal-status-sync.mjs
      - name: Verify status contract before commit
        run: npm run status:verify
      - name: Remove one-shot helpers and commit docs only
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/one-shot-p12-rehearsal-status-sync.mjs .github/workflows/one-shot-p12-rehearsal-status-sync.yml
          git config user.name "P12 Status Sync"
          git config user.email "p12-status-sync@invalid.local"
          git add README.md memory-bank/PROJECT_STATE.md memory-bank/ROADMAP.md memory-bank/NEXT_ACTIONS.md memory-bank/CHANGELOG.md
          git add -u scripts/one-shot-p12-rehearsal-status-sync.mjs .github/workflows/one-shot-p12-rehearsal-status-sync.yml
          if git diff --cached --quiet; then
            echo 'No status changes required.'
            exit 0
          fi
          git commit -m 'docs: record P5 integration rehearsal checkpoint [status-sync]'
          git push origin HEAD:docs/p12-p5-rehearsal-sync
