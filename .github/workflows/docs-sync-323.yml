name: Docs Sync 323

on:
  push:
    branches: [docs/p15-r1-status-sync-323]
    paths:
      - '.github/workflows/docs-sync-323.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Apply bounded canonical status replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # README
          replace_once('README.md',
              '- P15 Elementor foundation: documented v0.4/container validation, bounded widget-capability reporting and a non-authorizing candidate artifact envelope;',
              '- P15 Elementor R1 foundation: v0.4/container validation, bounded widget-capability reporting, exact candidate/import-evidence binding, immutable declared target profiles, read-only profile assessment and a non-authorizing global-reference review gate;')
          replace_once('README.md',
              'Current verified main is:\n\n`426314b183f220f66a315a24f9b1122a464909b9`',
              'Current verified main is:\n\n`d603ce87a645160204d2de6fd458279ba7b3bf3f`')
          replace_once('README.md',
