name: Apply WP Builders Prepear Rename

on:
  push:
    branches:
      - chore/rename-wp-builders-prepear

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Apply exact display-name rename
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = [
              ('Pella Elementor Prep', 'WP Builders Prepear'),
              ('# WP Elementor Prep', '# WP Builders Prepear'),
              ('Open Elementor Prep', 'Open WP Builders Prepear'),
          ]
          # The semantic-pin fixture models immutable accepted P5 #488 bytes and must stay historical.
          skip = {
              '.github/workflows/rename-audit.yml',
              'CHANGELOG.md',
              'memory-bank/CHANGELOG.md',
              'tests/runtime-manifest-semantic-pin.test.mjs',
          }
          changed = []
          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              if name in skip:
                  continue
              p = Path(name)
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  p.write_text(updated, encoding='utf-8')
                  changed.append(name)
          if not changed:
              raise SystemExit('No product-name surfaces changed')
          print('Changed product-name surfaces:')
          print('\n'.join(changed))

          changelog = Path('memory-bank/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## 2026-09-10\n\n'
          entry = (
              '### Plugin display-name rename — WP Builders Prepear\n\n'
              '- User-requested shipped plugin/product display name changed from `Pella Elementor Prep` / `WP Elementor Prep` to exactly `WP Builders Prepear`.\n'
              '- Updated development/release manifests, release contract config, Community listing, development/release UI titles, current operator docs and generic runtime manifest fixtures.\n'
              '- Updated the release menu label from `Open Elementor Prep` to `Open WP Builders Prepear`.\n'
              '- The canonical P5 #488 semantic-pin fixture intentionally retains `Pella Elementor Prep` because it models immutable accepted artifact bytes; registry hash and accepted provenance remain unchanged.\n'
              '- Technical repository/npm/CLI slug `wp-elementor-prep`, Figma plugin ID/provenance identities and historical accepted runtime artifacts remain unchanged.\n'
              '- Branding-only change: no progress percentage or runtime acceptance credit changes.\n\n'
          )
          if marker not in text:
              raise SystemExit('Expected changelog date marker missing')
          if entry not in text:
              changelog.write_text(text.replace(marker, marker + entry, 1), encoding='utf-8')
          PY

          # No stale current display-name references outside immutable history/provenance fixtures.
          if git grep -n -E 'Pella Elementor Prep|# WP Elementor Prep|Open Elementor Prep' -- . \
            ':!memory-bank/CHANGELOG.md' ':!CHANGELOG.md' ':!.github/workflows/rename-audit.yml' \
            ':!tests/runtime-manifest-semantic-pin.test.mjs'; then
            echo 'Unexpected stale current display-name reference remains.' >&2
            exit 1
          fi

          grep -F '"name": "WP Builders Prepear"' manifest.template.json
          grep -F '"name": "WP Builders Prepear"' manifest.release.template.json
          grep -F '"pluginName": "WP Builders Prepear"' config/plugin-release.json
          grep -F '"name": "WP Builders Prepear"' community/listing.template.json
          grep -F '<title>WP Builders Prepear</title>' src/ui/ui.html
          grep -F '<h1>WP Builders Prepear</h1>' src/ui/ui.html
          grep -F '<title>WP Builders Prepear</title>' src/ui/release-ui.html
          grep -F '<h1>WP Builders Prepear</h1>' src/ui/release-ui.html
          grep -F '# WP Builders Prepear' README.md
          grep -F "name: 'Pella Elementor Prep'" tests/runtime-manifest-semantic-pin.test.mjs
          node -e "const p=require('./package.json'); if(p.name!=='wp-elementor-prep') process.exit(1)"
          grep -F 'wp-elementor-prep CLI' src/cli/index.ts

      - name: Verify complete repository and release contracts
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run status:verify
          npm run typecheck
          npm test
          npm run build
          npm run build:cli
          npm run verify:release-contract
          npm run test:release-package
          npm run community:verify
          npm run p12:offline
          git diff --check

      - name: Commit clean rename result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WP Builders Prepear Rename"
          git config user.email "wp-builders-prepear@invalid.local"
          git rm -f .github/workflows/rename-audit.yml
          git add README.md community/listing.template.json config/plugin-release.json \
            docs/P11_RELEASE_DISTRIBUTION.md docs/P5_COMPILED_RUNTIME_SELF_TEST.md \
            manifest.release.template.json manifest.template.json memory-bank/CHANGELOG.md \
            src/ui/release-ui.html src/ui/ui.html tests/runtime-artifact-preflight.test.mjs \
            tests/runtime-closure-archive-intake.test.mjs tests/runtime-closure-intake.test.mjs
          git commit -m "Rename plugin display name to WP Builders Prepear"
          git push origin HEAD:chore/rename-wp-builders-prepear
