name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FIGMA_PLUGIN_ID: ${{ vars.FIGMA_PLUGIN_ID || '000000000000000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Write Figma build provenance
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'source_sha=%s\nworkflow_sha=%s\nhead_ref=%s\nbase_ref=%s\nrun_id=%s\nfigma_plugin_id=%s\n' \
            "$SOURCE_SHA" "$GITHUB_SHA" "$GITHUB_HEAD_REF" "$GITHUB_BASE_REF" "$GITHUB_RUN_ID" "$FIGMA_PLUGIN_ID" \
            > dist/BUILD_INFO.txt
          if [ "$FIGMA_PLUGIN_ID" = "000000000000000000" ]; then
            cat > dist/IMPORT_NOTES.txt <<'EOF'
          This build used the repository's placeholder Figma plugin id (000000000000000000).
          Figma assigns plugin ids for registered development/published plugins. If Figma rejects this manifest during development import,
          configure the repository variable FIGMA_PLUGIN_ID with a Figma-assigned development plugin id and rerun CI, or replace only the
          manifest.json id locally before import. Do not treat CI success alone as imported-Figma runtime proof.
          EOF
          else
            printf 'This build used configured Figma plugin id %s. CI success is not imported-Figma runtime proof; run the compiled self-test in Figma.\n' \
              "$FIGMA_PLUGIN_ID" > dist/IMPORT_NOTES.txt
          fi
      - name: Upload Figma development build
        uses: actions/upload-artifact@v4
        with:
          name: figma-plugin-dist-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
