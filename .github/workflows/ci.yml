name: CI

on:
  pull_request:
  push:
    branches: [main, feat/p7-batch-queue-core]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FIGMA_PLUGIN_ID: ${{ vars.FIGMA_PLUGIN_ID || '000000000000000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Build Figma development plugin
        env:
          WPEP_BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WPEP_BUILD_RUN_ID: ${{ github.run_id }}
          WPEP_BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: npm run build
      - name: Verify Figma development bundle
        env:
          EXPECTED_DEV_COMMAND: p7-runtime-evidence
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_NUMBER: ${{ github.run_number }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, statSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/manifest.json', 'utf8'));
          const required = [manifest.main, manifest.ui, 'verify-p7-closure.mjs'];
          if (manifest.id !== process.env.FIGMA_PLUGIN_ID) throw new Error(`manifest id ${manifest.id} != configured ${process.env.FIGMA_PLUGIN_ID}`);
          for (const file of required) {
            if (!file || !existsSync(`dist/${file}`) || statSync(`dist/${file}`).size === 0) throw new Error(`missing/empty artifact target: ${file}`);
          }
          if (!Array.isArray(manifest.menu) || !manifest.menu.some((item) => item.command === process.env.EXPECTED_DEV_COMMAND)) throw new Error(`missing expected developer command: ${process.env.EXPECTED_DEV_COMMAND}`);
          for (const artifactFile of ['dist/code.js', 'dist/verify-p7-closure.mjs']) {
            const code = readFileSync(artifactFile, 'utf8');
            for (const value of [process.env.EXPECTED_SOURCE_SHA, process.env.EXPECTED_RUN_ID, process.env.EXPECTED_RUN_NUMBER]) {
              if (!value || !code.includes(value)) throw new Error(`${artifactFile} missing build provenance value: ${value}`);
            }
          }
          console.log('Verified Figma bundle + exact-artifact closure verifier provenance.');
          NODE
      - name: Verify offline P7 closure CLI
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_NUMBER: ${{ github.run_number }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const build = {
            sourceSha: process.env.EXPECTED_SOURCE_SHA,
            runId: process.env.EXPECTED_RUN_ID,
            runNumber: process.env.EXPECTED_RUN_NUMBER,
          };
          const coreProof = {
            schemaVersion: 1,
            gateVersion: 'p5-runtime-proof-v3',
            passedAt: '2026-09-08T09:59:59.000Z',
          };
          const receipt = {
            schemaVersion: 1,
            gateVersion: coreProof.gateVersion,
            proofPassedAt: coreProof.passedAt,
            build: { ...build },
          };
          const snapshot = (finalStatus, total, cancellation = null) => ({
            schemaVersion: 1,
            build: { ...build },
            runKey: finalStatus === 'COMPLETED' ? 'stress-run' : 'cancel-run',
            startedAt: '2026-09-08T10:00:00.000Z',
            elapsedMs: 1000,
            segmentCount: 1,
            stateTransitionCount: 2,
            checkpointPauseCount: 0,
            totalProcessorMs: 900,
            maxConcurrentProcessors: 1,
            attemptEvidenceTruncated: false,
            attempts: [{
              sequence: 1,
              frameIdAtStart: 'frame-1',
              frameName: 'One',
              attempt: 1,
              startedAt: '2026-09-08T10:00:00.100Z',
              durationMs: 900,
              outcome: 'SUCCEEDED',
              committedFrameId: null,
              error: null,
              usedJsHeapBytesBefore: null,
              usedJsHeapBytesAfter: null,
            }],
            checkpointEvidenceTruncated: false,
            checkpointResolutions: [],
            cancellation,
            memorySamplingSupported: false,
            memorySampleCount: 0,
            observedPeakUsedJsHeapBytesAtSamplePoints: null,
            finalStatus,
            finalFinishedCount: total,
            finalTotalCount: total,
          });
          const stress = snapshot('COMPLETED', 60);
          const cancellation = snapshot('CANCELLED', 2, {
            requestedAt: '2026-09-08T10:00:00.500Z',
            activeFrameIdAtRequest: 'frame-1',
            settledAt: '2026-09-08T10:00:01.000Z',
            finalStatus: 'CANCELLED',
          });
          const bundle = {
            schemaVersion: 2,
            accepted: true,
            failures: [],
            currentBuild: build,
            p5Prerequisite: {
              valid: true,
              passedAt: coreProof.passedAt,
              coreProof,
              receipt,
            },
            runtimeAcceptance: { accepted: true, failures: [] },
            stress,
            cancellation,
          };
          writeFileSync('/tmp/p7-pass.json', JSON.stringify(bundle));
          writeFileSync('/tmp/p7-other-build.json', JSON.stringify({
            ...bundle,
            currentBuild: { ...build, runNumber: String(Number(build.runNumber) + 1) },
          }));
          writeFileSync('/tmp/p7-forged-prerequisite.json', JSON.stringify({
            ...bundle,
            p5Prerequisite: {
              ...bundle.p5Prerequisite,
              receipt: {
                ...receipt,
                proofPassedAt: '2026-09-08T09:00:00.000Z',
              },
            },
          }));
          NODE
          node dist/verify-p7-closure.mjs < /tmp/p7-pass.json | grep '"accepted": true'
          if node dist/verify-p7-closure.mjs < /tmp/p7-other-build.json > /tmp/p7-other.out 2>&1; then
            echo 'offline verifier unexpectedly accepted different-build closure evidence'
            exit 1
          fi
          grep 'different build than this verifier artifact' /tmp/p7-other.out
          if node dist/verify-p7-closure.mjs < /tmp/p7-forged-prerequisite.json > /tmp/p7-forged.out 2>&1; then
            echo 'offline verifier unexpectedly accepted forged P5 prerequisite evidence'
            exit 1
          fi
          grep 'P5-prerequisite verdict does not match canonical proof/receipt recomputation' /tmp/p7-forged.out
          grep 'P5 deterministic runtime proof is not bound to this exact P7 plugin build' /tmp/p7-forged.out
          if printf '{}\n' | node dist/verify-p7-closure.mjs > /tmp/p7-invalid.out 2>&1; then
            echo 'offline verifier unexpectedly accepted malformed closure evidence'
            exit 1
          fi
          grep '"accepted": false' /tmp/p7-invalid.out
      - name: Verify deterministic local-import preparation
        run: |
          npm run prepare:figma-import -- 123456789012345678 dist dist-local
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const hash = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const manifest = JSON.parse(readFileSync('dist-local/manifest.json', 'utf8'));
          if (manifest.id !== '123456789012345678') throw new Error('prepared manifest did not bind requested local plugin id');
          for (const file of [manifest.main, manifest.ui]) {
            if (hash(`dist/${file}`) !== hash(`dist-local/${file}`)) throw new Error(`local import preparation changed compiled target ${file}`);
          }
          if (!readFileSync('dist-local/LOCAL_IMPORT_INFO.txt', 'utf8').includes('compiled_targets_unchanged=true')) throw new Error('local import proof note is missing unchanged-target assertion');
          console.log('Verified manifest-only local Figma import preparation.');
          NODE
      - name: Package standalone local-import helper
        run: |
          cp scripts/prepare-figma-import.mjs dist/prepare-figma-import.mjs
          test -s dist/prepare-figma-import.mjs
      - name: Write Figma build provenance
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'source_sha=%s\nworkflow_sha=%s\nhead_ref=%s\nbase_ref=%s\nrun_id=%s\nrun_number=%s\nfigma_plugin_id=%s\n' \
            "$SOURCE_SHA" "$GITHUB_SHA" "$GITHUB_HEAD_REF" "$GITHUB_BASE_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$FIGMA_PLUGIN_ID" \
            > dist/BUILD_INFO.txt
          if [ "$FIGMA_PLUGIN_ID" = "000000000000000000" ]; then
            cat > dist/IMPORT_NOTES.txt <<'EOF'
          This build used the repository's placeholder Figma plugin id (000000000000000000).
          After unpacking this artifact, run:
            node prepare-figma-import.mjs <your-figma-plugin-id> . dist-local
          Then import dist-local/manifest.json in Figma. The helper preserves compiled code/UI byte-for-byte and changes only manifest.json id.
          Exported P7 closure JSON can be independently checked with the verifier from this same artifact:
            node verify-p7-closure.mjs < p7-closure.json
          The v2 closure export includes the raw P5 core proof + exact-build P7 receipt so the verifier recomputes that prerequisite independently.
          Do not treat CI success, manifest preparation, or offline verification as imported-Figma runtime proof.
          EOF
          else
            printf 'This build used configured Figma plugin id %s. Exported P7 closure can be checked with node verify-p7-closure.mjs < p7-closure.json. CI success is not imported-Figma runtime proof.\n' "$FIGMA_PLUGIN_ID" > dist/IMPORT_NOTES.txt
          fi
      - name: Upload Figma development build
        uses: actions/upload-artifact@v4
        with:
          name: figma-plugin-dist-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
