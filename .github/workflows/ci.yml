name: CI

on:
  pull_request:
  push:
    branches: [main, feat/p5-safe-recipes]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FIGMA_PLUGIN_ID: ${{ vars.FIGMA_PLUGIN_ID || '000000000000000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Build Figma development plugin
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build
      - name: Verify Figma development bundle
        env:
          EXPECTED_DEV_COMMAND: p5-runtime-self-test
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, statSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/manifest.json', 'utf8'));
          const required = [manifest.main, manifest.ui];
          if (manifest.id !== process.env.FIGMA_PLUGIN_ID) throw new Error(`manifest id ${manifest.id} != configured ${process.env.FIGMA_PLUGIN_ID}`);
          for (const file of required) {
            if (!file || !existsSync(`dist/${file}`) || statSync(`dist/${file}`).size === 0) throw new Error(`missing/empty manifest target: ${file}`);
          }
          if (!Array.isArray(manifest.menu) || !manifest.menu.some((item) => item.command === process.env.EXPECTED_DEV_COMMAND)) {
            throw new Error(`missing expected developer command: ${process.env.EXPECTED_DEV_COMMAND}`);
          }
          const code = readFileSync('dist/code.js', 'utf8');
          for (const [label, value] of [
            ['source sha', process.env.SOURCE_SHA],
            ['Actions run id', process.env.GITHUB_RUN_ID],
            ['Actions run number', process.env.GITHUB_RUN_NUMBER],
          ]) {
            if (!value || !code.includes(value)) throw new Error(`compiled plugin missing ${label}: ${value ?? '<missing>'}`);
          }
          console.log(`Verified Figma bundle + compiled provenance: ${manifest.main}, ${manifest.ui}, ${process.env.EXPECTED_DEV_COMMAND}`);
          NODE
      - name: Write Figma build provenance
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'source_sha=%s\nworkflow_sha=%s\nhead_ref=%s\nbase_ref=%s\nrun_id=%s\nrun_number=%s\nfigma_plugin_id=%s\n' \
            "$SOURCE_SHA" "$GITHUB_SHA" "$GITHUB_HEAD_REF" "$GITHUB_BASE_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$FIGMA_PLUGIN_ID" \
            > dist/BUILD_INFO.txt
          if [ "$FIGMA_PLUGIN_ID" = "000000000000000000" ]; then
            cat > dist/IMPORT_NOTES.txt <<'EOF'
          This build used the repository's placeholder Figma plugin id (000000000000000000).
          Figma assigns plugin ids for registered development/published plugins. If Figma rejects this manifest during development import,
          configure the repository variable FIGMA_PLUGIN_ID with a Figma-assigned development plugin id and rerun CI, or replace only the
          manifest.json id locally before import. Do not treat CI success alone as imported-Figma runtime proof.
          EOF
          else
            printf 'This build used configured Figma plugin id %s. CI success is not imported-Figma runtime proof; run the compiled self-test in Figma.\n' \
              "$FIGMA_PLUGIN_ID" > dist/IMPORT_NOTES.txt
          fi
      - name: Upload Figma development build
        uses: actions/upload-artifact@v4
        with:
          name: figma-plugin-dist-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
