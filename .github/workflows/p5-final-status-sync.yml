name: P5 Final Status Sync

on:
  push:
    branches:
      - docs/p5-final-status-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Synchronize P5 final status
        run: node scripts/p5-final-status-sync.mjs
      - name: Verify status contract
        run: |
          npm install
          npm run status:verify
          git diff --check
      - name: Commit clean status-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "P5 Status Sync"
          git config user.email "p5-status-sync@invalid.local"
          git rm -f .github/workflows/p5-final-status-sync.yml scripts/p5-final-status-sync.mjs
          git add README.md memory-bank/PROJECT_STATE.md memory-bank/ROADMAP.md memory-bank/NEXT_ACTIONS.md memory-bank/CHANGELOG.md
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' README.md memory-bank/CHANGELOG.md memory-bank/NEXT_ACTIONS.md memory-bank/PROJECT_STATE.md memory-bank/ROADMAP.md | sort)"
          test "$changed" = "$expected"
          git commit -m "Docs: record final P5 acceptance and advance P12"
          git push origin HEAD:docs/p5-final-status-sync
