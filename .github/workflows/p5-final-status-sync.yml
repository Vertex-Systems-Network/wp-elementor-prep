name: P5 Final Status Sync

on:
  push:
    branches:
      - docs/p5-final-status-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Synchronize status surfaces
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          function read(p){ return fs.readFileSync(p,'utf8'); }
          function write(p,s){ fs.writeFileSync(p,s); }
          function one(p, from, to){
            let s=read(p);
            const n=s.split(from).length-1;
            if(n!==1) throw new Error(`${p}: expected one match, found ${n}: ${from.slice(0,80)}`);
            write(p,s.replace(from,to));
          }
          function reOne(p, re, to){
            let s=read(p); const m=s.match(re);
            if(!m || (m.length===0)) throw new Error(`${p}: regex not found ${re}`);
            const probe=[...s.matchAll(new RegExp(re.source, re.flags.includes('g')?re.flags:re.flags+'g'))];
            if(probe.length!==1) throw new Error(`${p}: expected one regex match, found ${probe.length}`);
            write(p,s.replace(re,to));
          }

          // README — live top-level status and current critical path.
          one('README.md',
            '| P5 Conservative Safe Fix | 🟡 IMPLEMENTED / VALIDATION DEFERRED | 94% | `█████████░` | P12 real Figma closure → fresh P5→then-current-main `CODE_CONFLICT` resolution preserving current-main safety → merge #6 |',
            '| P5 Conservative Safe Fix | ✅ COMPLETE / PRODUCTION ACCEPTED | 100% | `██████████` | Real Figma Desktop acceptance + hardened closure-intake + PR #99 merge PASS; keep regression coverage |');
          one('README.md',
            '| P6 Advanced structures | 🟠 IMPLEMENTED / FINAL INTEGRATION PENDING | 80% | `████████░░` | Post-P5 rehearsal 10→0 PASS; after actual P5 merge refresh resolution → fresh artifact → real positive/refusal closure #7 |',
            '| P6 Advanced structures | 🟠 IMPLEMENTED / FINAL INTEGRATION PENDING | 80% | `████████░░` | P5 is merged; refresh onto current main → fresh final artifact → real positive/refusal closure #7 |');
          one('README.md',
            '| P7 60+ Frame batch queue | 🟠 IMPLEMENTED / FINAL INTEGRATION PENDING | 80% | `████████░░` | Post-P5 rehearsal 15→0 PASS; after actual P5 merge refresh resolution → fresh artifact → 60+ stress + active cancellation closure #8 |',
            '| P7 60+ Frame batch queue | 🟠 IMPLEMENTED / FINAL INTEGRATION PENDING | 80% | `████████░░` | P5 is merged; after P6/final-line refresh → fresh artifact → 60+ stress + active cancellation closure #8 |');
          one('README.md',
            '| P12 Final integrated validation | 🧪 IN PROGRESS | 20% | `██░░░░░░░░` | Offline cross-platform + P5/P6/P7 integration rehearsals PASS → next genuine P5 Desktop/runtime closure + real API/plugin acceptance |',
            '| P12 Final integrated validation | 🧪 IN PROGRESS | 40% | `████░░░░░░` | Offline cross-platform slice + genuine P5 Desktop/closure/integration slice PASS → next P6 final-line runtime closure |');
          one('README.md','**Overall active project progress:** `█████████░ 93%`','**Overall active project progress:** `██████████ 95%`');
          one('README.md',
            '> The 93% figure preserves the historical P0–P7 core-delivery denominator. P12 progress is tracked separately and does not rewrite the verified historical denominator.',
            '> Historical P0–P7 core progress is now 95%: P0–P5 are 100%, while P6/P7 remain 80% (760 / 800 weighted phase-points). P12 validation is tracked separately.');
          one('README.md','- P12 final validation: `██░░░░░░░░ 20%`','- P12 final validation: `████░░░░░░ 40%`');
          one('README.md',
            'The P12 `20%` credit is intentionally conservative: only the completed, machine-observed offline/cross-platform matrix is counted. Real Figma Desktop, real credentialed API, P5/P6/P7 closure, plugin parity and final Community readiness remain uncredited.',
            'The P12 `40%` credit now consists of two retained major validation slices: 20% cross-platform/offline acceptance + 20% genuine P5 Figma Desktop/runtime closure and final integration. P6/P7 real closure, credentialed API/plugin parity and final Community readiness remain uncredited.');
          one('README.md',
            '- P5/P6/P7 runtime acceptance must use genuine final-line evidence and current-main closure intake;',
            '- P5 runtime acceptance is complete and merged; P6/P7 runtime acceptance must still use genuine final-line evidence and current-main closure intake;');
          one('README.md',
            '- ⚠️ rehearsal evidence is explicitly `acceptanceAuthority: false`: P5 remains 94%, P12 remains 20%, and real Figma Desktop/rendered-pixel/closure evidence is still mandatory.',
            '- ✅ historical rehearsal evidence was non-authorizing at the time and is now superseded by the genuine P5 Desktop acceptance, closure-intake PASS and final PR #99 merge recorded below.');
          one('README.md',
            '- ⚠️ both evidence bundles are explicitly `acceptanceAuthority: false`. P6 stays 80%, P7 stays 80%, P12 stays 20%; real Figma closure and fresh final-line artifacts remain mandatory.',
            '- ⚠️ both downstream rehearsal bundles remain non-authorizing. P6/P7 stay 80%; fresh post-P5 artifacts and genuine real-Figma closures remain mandatory.');
          reOne('README.md', /### Next critical path — P5[\s\S]*?After P5, P6 and P7 require fresh exact final-line artifacts and real runtime closure\./,
`### P5 final acceptance checkpoint — COMPLETE

- ✅ real Figma development plugin ID \`1679803102348456572\` used for the canonical #488-derived import;
- ✅ real Figma Desktop \`P5 Compiled Runtime Acceptance: PASS\` with \`accepted: true\`, no failures and \`leftovers: 0\`;
- ✅ forced reject returned rendered-pixel evidence (\`changedPixelPct: 5.4545\`) while the original remained untouched;
- ✅ restore and finalize paths both passed Full P3 and cleared checkpoints;
- ✅ current-main hardened closure run \`34463444342\` completed with canonical #488 ZIP SHA MATCH, immutable files 5/5 MATCH, manifest semantic MATCH and verifier exit 0;
- ✅ retained closure artifact \`10146495702\`, SHA-256 \`e17f0f25821fb52d8cf6427f2bda99e154eb188a62d278bbea299f6402a533d8\`;
- ✅ final integration PR #99 CI #661 + P12 Offline #16 PASS, mergeable with zero review/thread blockers;
- ✅ squash merge \`91c3feda1e8841f5b07ec189c5289c701ce199f5\`, issue #6 closed completed;
- ✅ post-merge CI #662, Integration Readiness #118 and P12 Offline #17 PASS.

Evidence provenance note: the conversation inventory did not expose a separate mounted \`.json\` attachment, so the repository-retained evidence file is an exact reconstruction of the JSON text supplied by the user. The real Desktop screenshot/result and the hardened verifier both agree on acceptance.

### Next critical path — P6

P6 now requires a fresh post-P5/current-main integration build, registry entry/preflight, real image-bearing positive calibration + preservation refusal, current-main closure intake PASS, then merge/close #7. P7 follows with its fresh 60+ stress/cancellation closure.`);

          // PROJECT_STATE — current queue, percentages, immediate target.
          one('memory-bank/PROJECT_STATE.md',
            'P9–P11 implementation is complete. P12 #84 is the sole release-expansion final validation gate and is now `20%` complete after the cross-platform offline acceptance slice.',
            'P9–P11 implementation is complete. P12 #84 is the sole release-expansion final validation gate and is now `40%` complete after cross-platform offline acceptance plus genuine P5 Desktop/runtime closure and final integration.');
          one('memory-bank/PROJECT_STATE.md',
            'Only properties directly exercised by retained evidence receive P12 credit. Real Figma Desktop/runtime/API, P5/P6/P7 closure and Community review remain pending.',
            'Only properties directly exercised by retained evidence receive P12 credit. P5 real Desktop/runtime closure is complete; real Figma API/plugin parity, P6/P7 closure and Community review remain pending.');
          one('memory-bank/PROJECT_STATE.md',
            '- #6 — P5 Safe Fix: implementation complete, genuine Figma closure + final current-main integration pending;\n- #7 — P6 Advanced structures: implementation complete on reference head, fresh final-line artifact/runtime closure pending after P5;',
            '- #6 — P5 Safe Fix: CLOSED COMPLETED after real Desktop acceptance, closure-intake PASS and PR #99 merge;\n- #7 — P6 Advanced structures: implementation complete on reference head, now unblocked for fresh post-P5 final-line artifact/runtime closure;');
          one('memory-bank/PROJECT_STATE.md',
            '| P5 Safe Fix | IMPLEMENTED / VALIDATION DEFERRED | 94% | Genuine P12 Figma Desktop closure → current-main integration → merge #6 |',
            '| P5 Safe Fix | COMPLETE / PRODUCTION ACCEPTED | 100% | Real Desktop + closure-intake + PR #99 merge PASS |');
          one('memory-bank/PROJECT_STATE.md',
            '| P12 final validation | IN PROGRESS | 20% | Next critical path: genuine P5 Desktop/runtime closure |',
            '| P12 final validation | IN PROGRESS | 40% | Next critical path: P6 fresh final-line runtime closure |');
          one('memory-bank/PROJECT_STATE.md',
            'Historical P0–P7 core progress remains `93%` under its original denominator.',
            'Historical P0–P7 core progress is now `95%` under its original eight-phase denominator: P0–P5 at 100%, P6/P7 at 80%.');
          one('memory-bank/PROJECT_STATE.md',
            'Canonical #488 + retained ZIP also passed current-contract `runtime:preflight` in run `34416999458`. The rehearsal is explicitly non-authorizing and does not replace genuine Figma Desktop evidence; P5 remains `94%` and P12 remains `20%`.',
            'Canonical #488 + retained ZIP also passed current-contract `runtime:preflight` in run `34416999458`. This historical rehearsal was non-authorizing; it has now been superseded by genuine P5 Desktop acceptance, current-main closure-intake PASS and final merge #99.');
          reOne('memory-bank/PROJECT_STATE.md', /## P5 current technical state[\s\S]*?Final integration must refresh this list after genuine P5 closure because main may move\./,
`## P5 final technical state — COMPLETE

Canonical P5 #488 real Desktop evidence passed for source \`810d98d6e09cb4cf3fe4758fcb07e87734254a8e\` / run \`34242984963\` (#488). Current-main closure run \`34463444342\` completed with canonical archive SHA MATCH, immutable 5/5 MATCH, manifest semantic MATCH and same-artifact verifier exit 0. Final integration PR #99 passed CI #661 and merged as \`91c3feda1e8841f5b07ec189c5289c701ce199f5\`; post-merge CI #662, Integration Readiness #118 and P12 Offline #17 passed. Issue #6 is closed completed.`);
          one('memory-bank/PROJECT_STATE.md',
            'P6 #494 and P7 #490 remain engineering/reference artifacts only. Final production integration requires fresh exact builds after final P5 merge and real runtime evidence in P12.',
            'P6 #494 and P7 #490 remain engineering/reference artifacts only. P5 is now merged, so P6 is unblocked for a fresh exact final-line build and real closure; P7 follows on the resulting final line.');
          one('memory-bank/PROJECT_STATE.md',
            '- genuine P5 Figma Desktop runtime/rendered-pixel closure;\n- P5 current-main integration and merge;\n',
            '');
          one('memory-bank/PROJECT_STATE.md',
            'Next critical path is genuine P5 Figma Desktop/runtime acceptance. If the environment cannot import/run the exact development-plugin artifact, do not fabricate evidence or merge P5; continue only with other independently genuine P12 checks.',
            'Next critical path is P6 fresh post-P5 integration/build → final-closure-eligible registry/preflight → genuine real-Figma positive/refusal evidence → current-main closure intake → merge/close #7.');

          // ROADMAP — live rows and accepted P5 slice.
          one('memory-bank/ROADMAP.md',
            '| P5 | Conservative Safe Fix recipes + exact-build proof | IMPLEMENTED / VALIDATION DEFERRED | 94% | `█████████░` | P12 genuine Desktop closure → current-main integration → merge #6 |',
            '| P5 | Conservative Safe Fix recipes + exact-build proof | COMPLETE / PRODUCTION ACCEPTED | 100% | `██████████` | Real Desktop + closure-intake + PR #99 merge PASS |');
          one('memory-bank/ROADMAP.md',
            '| P6 | Advanced timeline/carousel/milestone/page normalization | IMPLEMENTED / FINAL INTEGRATION PENDING | 80% | `████████░░` | P12 after P5 → fresh registered artifact → positive/refusal closure #7 |',
            '| P6 | Advanced timeline/carousel/milestone/page normalization | IMPLEMENTED / FINAL INTEGRATION PENDING | 80% | `████████░░` | P5 merged → fresh post-P5 registered artifact → real positive/refusal closure #7 |');
          one('memory-bank/ROADMAP.md',
            '| P12 | Final integrated validation/release acceptance | IN PROGRESS | 20% | `██░░░░░░░░` | Cross-platform offline slice PASS; next genuine P5 Desktop/runtime closure |',
            '| P12 | Final integrated validation/release acceptance | IN PROGRESS | 40% | `████░░░░░░` | Offline slice + genuine P5 slice PASS; next P6 final-line runtime closure |');
          one('memory-bank/ROADMAP.md','**Historical core P0–P7 progress:** `█████████░ 93%`','**Historical core P0–P7 progress:** `██████████ 95%`');
          one('memory-bank/ROADMAP.md','This remains the original core denominator.','This remains the original eight-phase core denominator: P0–P5 are complete, P6/P7 remain at 80%.');
          one('memory-bank/ROADMAP.md','**P12 final validation:** `██░░░░░░░░ 20%`.','**P12 final validation:** `████░░░░░░ 40%`.');
          one('memory-bank/ROADMAP.md',
            'The 20% credit is limited to retained cross-platform/offline evidence. No credit is assigned for pending real Figma Desktop/API/runtime/Community gates.',
            'The 40% credit consists of retained cross-platform/offline acceptance (20%) plus genuine P5 Figma Desktop/runtime closure and final integration (20%). P6/P7, real API/plugin parity and Community readiness remain pending.');
          reOne('memory-bank/ROADMAP.md', /## P5 — next critical path[\s\S]*?Integration Readiness #104 refreshed the pre-closure conflict set to 11 paths\. This map must be refreshed again after genuine closure because main may move\./,
`## P5 final acceptance — COMPLETE

The artifact remains registered in \`config/runtime-artifacts.json\` schema v3 as the current final-closure-eligible P5 build.

Real Figma Desktop acceptance passed with plugin ID \`1679803102348456572\`, canonical source \`810d98d6e09cb4cf3fe4758fcb07e87734254a8e\`, run #488, rendered-pixel reject/restore/finalize evidence and zero leftovers. Current-main closure run \`34463444342\` passed all archive/artifact/evidence/verifier gates. PR #99 passed CI #661 and merged at \`91c3feda1e8841f5b07ec189c5289c701ce199f5\`; issue #6 is closed.

## P6 — next critical path

Resolve/rebuild P6 on merged P5/current main, publish/register a fresh exact final artifact, run genuine image-bearing positive + preservation-refusal observations in Figma, pass current-main closure intake, then merge/close #7.`);
          one('memory-bank/ROADMAP.md','- P5 real Desktop/rendered-pixel closure + final integration;\n','');
          one('memory-bank/ROADMAP.md',
            'This is maintenance, not product/runtime acceptance. P12 remains 20%, P5 94%, P6/P7 80%, and historical core 93%.',
            'This maintenance did not itself consume acceptance credit; subsequent genuine P5 completion moved P5 to 100%, P12 to 40%, and historical core to 95%.');

          // NEXT_ACTIONS — P6 is now the active product gate.
          one('memory-bank/NEXT_ACTIONS.md',
            'P9–P11 implementation is complete. P12 #84 is active at `20%` after the cross-platform offline acceptance slice.',
            'P9–P11 implementation is complete. P12 #84 is active at `40%` after cross-platform offline acceptance plus genuine P5 Desktop/runtime closure and final integration.');
          one('memory-bank/NEXT_ACTIONS.md',
            '- #6 — P5 Safe Fix: **next critical path**; exact artifact ready, genuine Desktop/rendered-pixel closure + final main integration pending;\n- #7 — P6 Advanced structures: waits for P5 final merge, then fresh artifact + real positive/refusal closure;\n- #8 — P7 Batch queue: waits for P5 final merge, then fresh artifact + real 60+ stress/cancel closure;\n- #84 — P12 final integrated validation, 20% complete.',
            '- #6 — P5 Safe Fix: CLOSED COMPLETED; real Desktop acceptance + closure-intake + PR #99 merge PASS;\n- #7 — P6 Advanced structures: **next critical path**; fresh post-P5 artifact + real positive/refusal closure;\n- #8 — P7 Batch queue: follows final P6/P5 line with fresh 60+ stress/cancel closure;\n- #84 — P12 final integrated validation, 40% complete.');
          one('memory-bank/NEXT_ACTIONS.md',
            'Canonical #488 + retained ZIP current-contract preflight also PASSed in run `34416999458`. Do not merge the rehearsal branch or count this as runtime acceptance. The next action remains genuine exact-artifact Figma Desktop closure, followed by a fresh integration refresh.',
            'Canonical #488 + retained ZIP current-contract preflight also PASSed in run `34416999458`. This historical rehearsal is now superseded by genuine P5 Desktop acceptance, closure run `34463444342`, and PR #99 merge.');
          reOne('memory-bank/NEXT_ACTIONS.md', /## Immediate P5 sequence[\s\S]*?## Current integration fact[\s\S]*?This list is a pre-closure planning fact only; refresh again before final P5 integration\./,
`## Completed P5 final sequence

- real Figma development plugin ID \`1679803102348456572\` used;
- canonical #488-derived plugin imported and Runtime Self-Test passed in genuine Figma Desktop;
- acceptance JSON: accepted true / failures empty / leftovers 0;
- rendered-pixel forced-reject, restore and finalize calibration passed;
- current-main closure run \`34463444342\`: PASS with canonical ZIP SHA MATCH, immutable 5/5, manifest semantic MATCH, verifier exit 0;
- final integration PR #99 CI #661 + P12 Offline #16 PASS;
- merge \`91c3feda1e8841f5b07ec189c5289c701ce199f5\`; #6 closed;
- post-merge CI #662 + Integration Readiness #118 + P12 Offline #17 PASS.

## Immediate P6 sequence

1. refresh/resolve canonical P6 against merged P5/current main;
2. run full repository/provenance/release checks;
3. publish and register a fresh exact P6 artifact as final-closure eligible;
4. current-main final-closure preflight PASS;
5. genuine Figma image-bearing positive calibration + preservation refusal;
6. export unedited \`p6-closure.json\`;
7. current-main \`runtime:closure-intake -- p6 ...\` PASS;
8. merge P6 and close #7.`);
          one('memory-bank/NEXT_ACTIONS.md','## After P5','## After P5 — downstream order');
          one('memory-bank/NEXT_ACTIONS.md','- historical P0–P7 core progress: `93%`;','- historical P0–P7 core progress: `95%`;');
          one('memory-bank/NEXT_ACTIONS.md','- P12 final validation: `20%`.','- P12 final validation: `40%`.');
          one('memory-bank/NEXT_ACTIONS.md',
            '- These rehearsals are `acceptanceAuthority: false`; they do not change P6/P7/P12 percentages or remove real-Figma/fresh-artifact closure requirements.',
            '- These rehearsals remain non-authorizing for P6/P7; P5 is now genuinely accepted/merged, while P6/P7 still require fresh artifacts and real-Figma closure.');
          one('memory-bank/NEXT_ACTIONS.md',
            '- This does not consume P12 acceptance credit. The immediate next product action remains genuine P5 Figma Desktop/rendered-pixel closure.',
            '- This maintenance did not itself consume P12 credit. Genuine P5 completion subsequently moved the immediate product action to P6 final-line closure.');

          // CHANGELOG — prepend immutable completion record.
          const changelog='memory-bank/CHANGELOG.md';
          let c=read(changelog);
          const marker='### P5 genuine Desktop acceptance, hardened closure and final integration';
          if(c.includes(marker)) throw new Error('CHANGELOG P5 final marker already exists');
          const entry=`## 2026-09-10\n\n${marker}\n\n- Real Figma development plugin ID: \`1679803102348456572\`.\n- Canonical P5 #488 real Desktop Runtime Self-Test: accepted true, failures empty, forced reject rendered-pixel evidence, restore/finalize PASS, leftovers 0.\n- Current-main hardened closure run \`34463444342\`: PASS; canonical ZIP SHA MATCH; immutable files 5/5 MATCH; manifest semantic MATCH; verifier exit 0.\n- Evidence raw-byte SHA-256: \`ce5800eb3c5fb3e57d56ac61ffcb0e97d9d569d3d4097f103c546c1605c5a8b5\`; retained closure artifact \`10146495702\`, ZIP SHA-256 \`e17f0f25821fb52d8cf6427f2bda99e154eb188a62d278bbea299f6402a533d8\`.\n- Provenance note: repository evidence file was reconstructed exactly from the user-provided JSON text because conversation inventory did not expose a separately mounted JSON attachment.\n- Fresh 11-conflict current-main integration resolution passed full suite in run \`34463779753\`; generated residue removed before PR.\n- PR #99: CI #661 PASS, P12 Offline #16 PASS, mergeable, reviews 0, threads 0; squash merge \`91c3feda1e8841f5b07ec189c5289c701ce199f5\`.\n- Post-merge: CI #662 PASS, Integration Readiness #118 PASS, P12 Offline #17 PASS. Issue #6 closed completed.\n- P5: 100%; historical P0–P7 core: 95%; P12: 40%. P6 is now the next genuine final-line runtime gate.\n\n`;
          c = c.replace(/^# Changelog\n\n/, '# Changelog\n\n'+entry);
          write(changelog,c);
          NODE

          npm install
          npm run status:verify
          git diff --check

      - name: Commit clean status-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "P5 Status Sync"
          git config user.email "p5-status-sync@invalid.local"
          git rm -f .github/workflows/p5-final-status-sync.yml
          git add README.md memory-bank/PROJECT_STATE.md memory-bank/ROADMAP.md memory-bank/NEXT_ACTIONS.md memory-bank/CHANGELOG.md
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' README.md memory-bank/CHANGELOG.md memory-bank/NEXT_ACTIONS.md memory-bank/PROJECT_STATE.md memory-bank/ROADMAP.md | sort)"
          test "$changed" = "$expected"
          git commit -m "Docs: record final P5 acceptance and advance P12"
          git push origin HEAD:docs/p5-final-status-sync
