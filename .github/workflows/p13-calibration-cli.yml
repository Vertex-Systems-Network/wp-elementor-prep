name: P13 Calibration CLI

on:
  push:
    branches:
      - p13/real-baseline-calibration
    paths:
      - .github/workflows/p13-calibration-cli.yml

permissions:
  contents: write

jobs:
  build-calibration-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p13/real-baseline-calibration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Verify exact calibration source
        run: |
          test "$(git rev-parse HEAD^)" = "c27f8d14535eaf362831047623b920bde863cbd9"
      - name: Install and build self-contained CLI
        run: |
          npm install
          npm run build:cli
          sha256sum dist-cli/elementor-prep.mjs > dist-cli/SHA256SUMS.txt
          printf '%s\n' "sourceSha=c27f8d14535eaf362831047623b920bde863cbd9" > dist-cli/CALIBRATION-PROVENANCE.txt
          printf '%s\n' "workflowRun=${GITHUB_RUN_ID}" >> dist-cli/CALIBRATION-PROVENANCE.txt
          printf '%s\n' "workflowRunNumber=${GITHUB_RUN_NUMBER}" >> dist-cli/CALIBRATION-PROVENANCE.txt
      - name: Upload calibration CLI
        uses: actions/upload-artifact@v7
        with:
          name: p13-calibration-cli-c27f8d14535e
          path: dist-cli/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary workflow from branch
        run: |
          git rm .github/workflows/p13-calibration-cli.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary P13 calibration workflow"
          git push origin HEAD:p13/real-baseline-calibration
