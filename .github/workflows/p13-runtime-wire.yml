name: P13 Runtime Evidence Wire

on:
  push:
    branches:
      - p13/runtime-evidence-parity

permissions:
  contents: write

jobs:
  wire-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p13/runtime-evidence-parity
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Apply guarded main wiring
        run: node scripts/_p13-wire-runtime.mjs
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Run focused P13 runtime tests
        run: npx vitest run tests/p13-runtime-evidence.test.ts tests/p13-runtime-parity-intake.test.mjs
      - name: Build plugin
        run: npm run build
      - name: Commit wiring and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin/main.ts
          git rm scripts/_p13-wire-runtime.mjs .github/workflows/p13-runtime-wire.yml
          git commit -m "P13: wire runtime evidence capture and viewer"
          git push origin HEAD:p13/runtime-evidence-parity
