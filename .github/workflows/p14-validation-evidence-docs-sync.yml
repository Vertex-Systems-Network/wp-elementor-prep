name: P14 Validation Evidence Docs Sync

on:
  push:
    branches:
      - p14/validation-check-evidence
    paths:
      - scripts/p14-validation-evidence-docs-sync.py
      - .github/workflows/p14-validation-evidence-docs-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p14/validation-check-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify exact branch scope
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "p14/validation-check-evidence"
          test -f scripts/p14-validation-evidence-docs-sync.py
          test -f .github/workflows/p14-validation-evidence-docs-sync.yml
      - name: Apply exact documentation sync
        run: python scripts/p14-validation-evidence-docs-sync.py
      - name: Install dependencies
        run: npm install
      - name: Verify repository status contract and type safety
        run: |
          set -euo pipefail
          npm run status:verify
          npm run typecheck
      - name: Commit verified docs sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/P14_FOUNDATION_IMPLEMENTATION.md
          git diff --cached --quiet && { echo "No docs changes staged"; exit 1; }
          git commit -m "docs: document bounded P14 validation check evidence"
          git push origin HEAD:p14/validation-check-evidence
