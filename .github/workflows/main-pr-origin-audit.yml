name: Main PR Origin Audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main-pr-origin-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-pr-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require non-forced merged PR association for main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          FORCED_UPDATE: ${{ github.event.forced }}
        run: |
          node <<'NODE'
          const repository = process.env.REPOSITORY ?? '';
          const sha = process.env.COMMIT_SHA ?? '';
          const token = process.env.GH_TOKEN ?? '';
          const forcedUpdate = process.env.FORCED_UPDATE ?? '';

          if (!repository.includes('/') || !sha || !token || !['true', 'false'].includes(forcedUpdate)) {
            console.error('MAIN_PR_ORIGIN_AUDIT_ERROR: missing workflow context.');
            process.exit(2);
          }

          if (forcedUpdate === 'true') {
            console.error('MAIN_PR_ORIGIN_AUDIT_FAILED: forced update to main detected.');
            process.exit(1);
          }

          const url = `https://api.github.com/repos/${repository}/commits/${sha}/pulls`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'wp-elementor-prep-main-pr-origin-audit',
          };

          for (let attempt = 1; attempt <= 6; attempt += 1) {
            let response;
            try {
              response = await fetch(url, { headers });
            } catch {
              if (attempt < 6) {
                await new Promise((resolve) => setTimeout(resolve, 2000));
                continue;
              }
              console.error('MAIN_PR_ORIGIN_AUDIT_ERROR: GitHub association request failed.');
              process.exit(2);
            }

            if (!response.ok) {
              console.error(`MAIN_PR_ORIGIN_AUDIT_ERROR: GitHub association request returned HTTP ${response.status}.`);
              process.exit(2);
            }

            const payload = await response.json();
            if (!Array.isArray(payload)) {
              console.error('MAIN_PR_ORIGIN_AUDIT_ERROR: unexpected GitHub association response.');
              process.exit(2);
            }

            const mergedMainPull = payload.find((pull) => (
              pull
              && typeof pull === 'object'
              && typeof pull.merged_at === 'string'
              && pull.merged_at.length > 0
              && pull.base
              && pull.base.ref === 'main'
            ));

            if (mergedMainPull) {
              console.log(`MAIN_PR_ORIGIN_AUDIT_PASS: main commit is associated with merged PR #${mergedMainPull.number}.`);
              process.exit(0);
            }

            if (attempt < 6) {
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
          }

          console.error('MAIN_PR_ORIGIN_AUDIT_FAILED: main commit is not associated with a merged pull request targeting main.');
          process.exit(1);
          NODE
