name: P13-P27 Status Memory Sync

on:
  push:
    branches:
      - p14/cancellation-check-hardening

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p14/cancellation-check-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Apply exact status-memory sync
        run: python scripts/status-p13-p27-sync.py
      - name: Install dependencies
        run: npm install
      - name: Verify status contract
        run: npm run status:verify
      - name: Commit verified status-memory sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            memory-bank/PROJECT_STATE.md \
            memory-bank/ROADMAP.md \
            memory-bank/NEXT_ACTIONS.md
          git diff --cached --quiet && { echo "No status-memory changes staged"; exit 1; }
          git commit -m "docs: synchronize P13-P27 roadmap status memory"
          git push origin HEAD:p14/cancellation-check-hardening
