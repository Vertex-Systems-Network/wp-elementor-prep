name: P7 Production Acceptance Status Sync Temp

on:
  push:
    branches:
      - docs/p7-production-acceptance-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize P7/P12 status surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          def replace_regex_once(text, pattern, replacement, label):
              out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 regex match, found {count}')
              return out

          # README
          p = 'README.md'
          s = read(p)
          s = replace_once(s,
              '| P7 60+ Frame batch queue | 🟠 IMPLEMENTED / RUNTIME CLOSURE PENDING | 80% | `████████░░` | Fresh exact final-line artifact registered + exact-current-main preflight PASS → genuine 60+ stress + active cancellation closure #8 |',
              '| P7 60+ Frame batch queue | ✅ COMPLETE / PRODUCTION ACCEPTED | 100% | `██████████` | Genuine 64-Frame sequential stress + active cancellation + current-main closure intake + PR #110 merge PASS |',
              'README P7 row')
          s = replace_once(s,
              '| P12 Final integrated validation | 🧪 IN PROGRESS | 60% | `██████░░░░` | Offline + genuine P5 + genuine P6 slices PASS → next P7 final-line runtime closure |',
              '| P12 Final integrated validation | 🧪 IN PROGRESS | 80% | `████████░░` | Offline + genuine P5 + genuine P6 + genuine P7 retained slices PASS; real API/plugin parity + final release/Community readiness remain |',
              'README P12 row')
          s = replace_once(s,
              '**Overall active project progress:** `██████████ 98%`',
              '**Overall active project progress:** `██████████ 100%`',
              'README overall')
          s = replace_once(s,
              '> Historical P0–P7 core progress is now 98%: P0–P6 are 100% and P7 remains 80% (780 / 800 phase-points, rounded). P12 validation is tracked separately.',
              '> Historical P0–P7 core progress is now 100%: P0–P7 are all production-complete under the original eight-phase denominator (800 / 800 phase-points). P12 validation is tracked separately.',
              'README historical core')
          s = replace_once(s,
              '- P12 final validation: `██████░░░░ 60%`',
              '- P12 final validation: `████████░░ 80%`',
              'README release P12')
          s = replace_once(s,
              'The P12 `60%` credit is three retained major validation slices: 20% cross-platform/offline acceptance + 20% genuine P5 Figma Desktop/runtime closure and final integration + 20% genuine P6 positive/refusal runtime closure, current-main intake and final integration. P7 real closure, credentialed API/plugin parity and final Community readiness remain uncredited.',
              'The P12 `80%` credit is four retained major validation slices: 20% cross-platform/offline acceptance + 20% genuine P5 Figma Desktop/runtime closure and final integration + 20% genuine P6 positive/refusal runtime closure/current-main intake/final integration + 20% genuine P7 64-Frame sequential stress/active cancellation/current-main intake/final integration. Real credentialed API/plugin parity and final release/Community readiness remain uncredited.',
              'README P12 credit')
          s = replace_once(s,
              '- P5 and P6 runtime acceptance are complete and merged; P7 runtime acceptance must still use genuine final-line evidence and current-main closure intake;',
              '- P5, P6 and P7 runtime acceptance are complete and merged with genuine exact-build evidence and current-main closure intake;',
              'README runtime policy')
          s = s.replace('## Current repository checkpoint — 2026-09-10', '## Current repository checkpoint — 2026-09-11', 1)
          s = replace_once(s,
              '- ✅ P7 fresh final-line source `d6bf2e12e3d877be125d336e423001baef92831b` passed 81 files / 387 tests plus typecheck/build/release/Community/P12-offline gates in run `34497801237`; artifact `figma-plugin-dist-p7-final-v2-1` (ID `10160543369`, ZIP SHA-256 `b0f16004d35f70aca7bb9edc65f162afe731db4c7d02044b4518e4b31ef685fc`) is registered final-closure eligible via PR #108, and exact merged-main preflight `34499068236` PASS. Genuine Figma stress/cancellation evidence remains pending.',
              '- ✅ P7 final-line source `d6bf2e12e3d877be125d336e423001baef92831b` passed 81 files / 387 tests plus typecheck/build/release/Community/P12-offline gates in run `34497801237`; retained artifact `figma-plugin-dist-p7-final-v2-1` (ID `10160543369`, ZIP SHA-256 `b0f16004d35f70aca7bb9edc65f162afe731db4c7d02044b4518e4b31ef685fc`) then passed genuine 64-Frame sequential stress + active cancellation closure, exact-current-main intake `34524838931`, and merged via PR #110 as `f1ee668329de9b05f05885fbc70192a391e5b2c9`; issue #8 is closed completed.',
              'README P7 checkpoint bullet')
          s = replace_regex_once(s,
              r'### P7 final-line closure-preparation checkpoint — repo-side complete\n\n.*?(?=\n### P5 integration rehearsal checkpoint — non-authorizing)',
              '''### P7 final acceptance checkpoint — COMPLETE\n\n- ✅ final two-parent source: `d6bf2e12e3d877be125d336e423001baef92831b`;\n- ✅ final integration run `34497801237`: strict typecheck + 81 test files / 387 tests + plugin/CLI/release/Community/P12-offline PASS;\n- ✅ retained artifact `figma-plugin-dist-p7-final-v2-1`, ID `10160543369`, ZIP SHA-256 `b0f16004d35f70aca7bb9edc65f162afe731db4c7d02044b4518e4b31ef685fc`;\n- ✅ exact-build P5 prerequisite / P7 receipt PASS in real Figma Desktop;\n- ✅ genuine 64-Frame stress evidence: all 64 terminal with `maxConcurrentProcessors = 1`;\n- ✅ genuine cooperative cancellation evidence retained with active frame identity at request and final `CANCELLED` status;\n- ✅ untouched schema-v2 closure SHA-256 `d2cf6853d4063599fc1f04b4f16507d1be75a6a1e556d6eedb4a5bfc9dd79ab9`;\n- ✅ exact-current-main closure intake run `34524838931` PASS: retained archive digest MATCH, immutable 5/5 MATCH, same-artifact verifier exit 0;\n- ✅ PR #110 CI #682 + P12 Offline #37 PASS and merge `f1ee668329de9b05f05885fbc70192a391e5b2c9`; issue #8 closed completed;\n- ✅ P7 = 100%, historical P0–P7 core = 100%, retained P12 validation = 80%.\n''',
              'README P7 acceptance block')
          s = s.replace('final P5/P6/P7 release menu exposure after those runtime lines integrate;', 'final integrated P5/P6/P7 release menu exposure audit;', 1)
          write(p, s)

          # PROJECT_STATE
          p = 'memory-bank/PROJECT_STATE.md'
          s = read(p).replace('Last updated: 2026-09-10', 'Last updated: 2026-09-11', 1)
          s = replace_once(s,
              'P9–P11 implementation is complete. P12 #84 is the sole release-expansion final validation gate and is now `60%` complete after cross-platform offline acceptance plus genuine P5 and P6 Desktop/runtime closure and final integration.',
              'P9–P11 implementation is complete. P12 #84 is the sole release-expansion final validation gate and is now `80%` complete after cross-platform offline acceptance plus genuine P5, P6 and P7 Desktop/runtime closure and final integration.',
              'PROJECT policy')
          s = replace_once(s,
              'Only properties directly exercised by retained evidence receive P12 credit. P5 and P6 real Desktop/runtime closure are complete; real Figma API/plugin parity, P7 closure and Community review remain pending.',
              'Only properties directly exercised by retained evidence receive P12 credit. P5, P6 and P7 real Desktop/runtime closure are complete; real Figma API/plugin parity, final integrated release readiness and Community review remain pending.',
              'PROJECT retained')
          s = replace_once(s,
              '- #8 — P7 Batch queue: next critical path; fresh final-line artifact registered + exact-current-main preflight PASS; genuine 60+ stress/cancel closure pending;\n- #84 — P12 final integrated validation/release acceptance, active at 60%.',
              '- #8 — P7 Batch queue: CLOSED COMPLETED after genuine 64-Frame stress + active cancellation closure, current-main intake PASS and PR #110 merge;\n- #84 — P12 final integrated validation/release acceptance, active at 80%.',
              'PROJECT queue')
          s = replace_once(s,
              '| P7 batch queue | IMPLEMENTED / RUNTIME CLOSURE PENDING | 80% | Fresh exact artifact registered + exact-current-main preflight PASS; genuine 60+ stress/cancel closure #8 |',
              '| P7 batch queue | COMPLETE / PRODUCTION ACCEPTED | 100% | Genuine 64-Frame stress + active cancellation + current-main intake + PR #110 merge PASS |',
              'PROJECT P7 row')
          s = replace_once(s,
              '| P12 final validation | IN PROGRESS | 60% | Next critical path: genuine P7 60+ stress + active-cancellation runtime closure |',
              '| P12 final validation | IN PROGRESS | 80% | Next: real Figma API/plugin parity + final integrated release/Community readiness |',
              'PROJECT P12 row')
          s = replace_once(s,
              'Historical P0–P7 core progress is now `98%` under its original eight-phase denominator: P0–P6 at 100%, P7 at 80% (780/800 phase-points, rounded).',
              'Historical P0–P7 core progress is now `100%` under its original eight-phase denominator: P0–P7 are complete (800/800 phase-points).',
              'PROJECT core')
          s = replace_once(s,
              'P6 #494 remains reference-only. Fresh final-line P6 artifact `figma-plugin-dist-p6-final-v2-1` at `ae691fac3c65dcdaf472392e6895fd402ae8fa3c` passed genuine Figma positive/refusal closure and exact current-main intake, then PR #106 merged as `dfbed556f0a6de564ca5c9afb395b7b2dd62abc8`; #7 is closed completed. P7 #490 remains reference-only; fresh exact final-line P7 source `d6bf2e12e3d877be125d336e423001baef92831b` produced registered artifact `figma-plugin-dist-p7-final-v2-1` (ID `10160543369`) and exact-current-main preflight `34499068236` PASS. Genuine P7 runtime stress/cancellation closure remains.',
              'P6 #494 remains reference-only. Fresh final-line P6 artifact `figma-plugin-dist-p6-final-v2-1` at `ae691fac3c65dcdaf472392e6895fd402ae8fa3c` passed genuine Figma positive/refusal closure and exact current-main intake, then PR #106 merged as `dfbed556f0a6de564ca5c9afb395b7b2dd62abc8`; #7 is closed completed. P7 #490 remains reference-only; fresh final-line P7 source `d6bf2e12e3d877be125d336e423001baef92831b` produced retained artifact `figma-plugin-dist-p7-final-v2-1` (ID `10160543369`), passed genuine 64-Frame stress + active cancellation closure and exact-current-main intake `34524838931`, then PR #110 merged as `f1ee668329de9b05f05885fbc70192a391e5b2c9`; #8 is closed completed.',
              'PROJECT P6/P7 state')
          s = s.replace('- fresh P7 final-line artifact is registered/preflighted; real 60+ sequential stress/cancellation closure remains;\n', '', 1)
          s = replace_regex_once(s,
              r'## Immediate target\n\n.*?(?=\n## P6/P7 downstream integration rehearsal checkpoint)',
              '''## Immediate target\n\nP7 is production accepted and merged at `f1ee668329de9b05f05885fbc70192a391e5b2c9`. **NEXT:** complete the remaining P12 real Figma API/plugin parity, real plugin backlog/export quality, final integrated release identity/install/menu checks and Community-readiness exit review.\n''',
              'PROJECT immediate')
          write(p, s)

          # NEXT_ACTIONS
          p = 'memory-bank/NEXT_ACTIONS.md'
          s = read(p).replace('Last updated: 2026-09-10', 'Last updated: 2026-09-11', 1)
          s = replace_once(s,
              'P9–P11 implementation is complete. P12 #84 is active at `60%` after cross-platform offline acceptance plus genuine P5 and P6 Desktop/runtime closure and final integration.',
              'P9–P11 implementation is complete. P12 #84 is active at `80%` after cross-platform offline acceptance plus genuine P5, P6 and P7 Desktop/runtime closure and final integration.',
              'NEXT policy')
          s = replace_once(s,
              '- #8 — P7 Batch queue: **next critical path**; fresh final-line artifact registered and exact-current-main preflight PASS; genuine 60+ stress + active cancellation closure now remains;\n- #84 — P12 final integrated validation, 60% complete.',
              '- #8 — P7 Batch queue: CLOSED COMPLETED; genuine 64-Frame stress + active cancellation closure + current-main intake + PR #110 merge PASS;\n- #84 — P12 final integrated validation, 80% complete and now the sole active product/release path.',
              'NEXT queue')
          s = replace_regex_once(s,
              r'P7:\n- ✅ final two-parent source `d6bf2e12e3d877be125d336e423001baef92831b` built and verified;.*?(?=\n## P7 final-line repo-side preparation — COMPLETE)',
              '''P7:\n- ✅ final source `d6bf2e12e3d877be125d336e423001baef92831b` built and verified;\n- ✅ retained artifact `figma-plugin-dist-p7-final-v2-1` / ID `10160543369` registered final-closure eligible;\n- ✅ real Figma exact-build P5 prerequisite PASS;\n- ✅ genuine 64-Frame stress completed with `maxConcurrentProcessors = 1`;\n- ✅ cooperative active-frame cancellation retained and accepted;\n- ✅ untouched closure export accepted; exact-current-main intake `34524838931` PASS;\n- ✅ PR #110 merged as `f1ee668329de9b05f05885fbc70192a391e5b2c9`; #8 closed completed.\n''',
              'NEXT P7 sequence')
          s = replace_regex_once(s,
              r'## P7 final-line repo-side preparation — COMPLETE\n\n.*?(?=\n## Remaining P9/P10/P11 acceptance)',
              '''## P7 final acceptance — COMPLETE\n\n- exact source: `d6bf2e12e3d877be125d336e423001baef92831b`;\n- final integration run `34497801237`: 81 files / 387 tests plus all build/release/offline gates PASS;\n- retained artifact: `figma-plugin-dist-p7-final-v2-1`, ID `10160543369`, SHA-256 `b0f16004d35f70aca7bb9edc65f162afe731db4c7d02044b4518e4b31ef685fc`;\n- real Figma 64-Frame sequential stress + active cancellation closure: PASS;\n- untouched closure SHA-256 `d2cf6853d4063599fc1f04b4f16507d1be75a6a1e556d6eedb4a5bfc9dd79ab9`;\n- exact-current-main closure intake run `34524838931`: PASS;\n- PR #110 CI #682 + P12 Offline #37: PASS; merge `f1ee668329de9b05f05885fbc70192a391e5b2c9`;\n- percentages now: P7 100%, historical core 100%, P12 80%.\n''',
              'NEXT acceptance block')
          s = replace_once(s,
              '- historical P0–P7 core progress: `98%`;\n- P9 implementation: `100%`;\n- P10 implementation: `100%`, partial P12 acceptance;\n- P11 implementation: `100%`, partial P12 acceptance;\n- P12 final validation: `60%`.',
              '- historical P0–P7 core progress: `100%`;\n- P9 implementation: `100%`;\n- P10 implementation: `100%`, partial P12 acceptance;\n- P11 implementation: `100%`, partial P12 acceptance;\n- P12 final validation: `80%`.',
              'NEXT progress')
          write(p, s)

          # ROADMAP
          p = 'memory-bank/ROADMAP.md'
          s = read(p).replace('Last updated: 2026-09-10', 'Last updated: 2026-09-11', 1)
          s = replace_once(s,
              '| P7 | Sequential multi-frame/page batch queue | IMPLEMENTED / RUNTIME CLOSURE PENDING | 80% | `████████░░` | Fresh final-line artifact registered + exact-current-main preflight PASS → genuine 60+ stress/cancel closure #8 |',
              '| P7 | Sequential multi-frame/page batch queue | COMPLETE / PRODUCTION ACCEPTED | 100% | `██████████` | Genuine 64-Frame stress + active cancellation + current-main intake + PR #110 merge PASS |',
              'ROADMAP P7 row')
          s = replace_once(s,
              '| P12 | Final integrated validation/release acceptance | IN PROGRESS | 60% | `██████░░░░` | Offline + genuine P5 + genuine P6 slices PASS; next P7 final-line runtime closure |',
              '| P12 | Final integrated validation/release acceptance | IN PROGRESS | 80% | `████████░░` | Offline + genuine P5 + genuine P6 + genuine P7 retained slices PASS; real API/plugin parity + final release/Community readiness remain |',
              'ROADMAP P12 row')
          s = replace_once(s,
              '**Historical core P0–P7 progress:** `██████████ 98%`\n\nThis remains the original eight-phase core denominator: P0–P6 are complete and P7 remains at 80% (780/800 phase-points, rounded).\n\n**P12 final validation:** `██████░░░░ 60%`.\n\nThe 60% credit consists of retained cross-platform/offline acceptance (20%), genuine P5 Figma Desktop/runtime closure and final integration (20%), and genuine P6 Figma positive/refusal closure + current-main intake + final integration (20%). P7, real API/plugin parity and Community readiness remain pending.',
              '**Historical core P0–P7 progress:** `██████████ 100%`\n\nThis remains the original eight-phase core denominator: P0–P7 are all complete (800/800 phase-points).\n\n**P12 final validation:** `████████░░ 80%`.\n\nThe 80% credit consists of retained cross-platform/offline acceptance (20%), genuine P5 Figma Desktop/runtime closure and final integration (20%), genuine P6 Figma positive/refusal closure + current-main intake + final integration (20%), and genuine P7 64-Frame sequential stress + active cancellation closure + current-main intake + final integration (20%). Real API/plugin parity and final release/Community readiness remain pending.',
              'ROADMAP progress')
          s = replace_once(s,
              '## P7 — next critical path\n\nFresh exact P7 final-line source `d6bf2e12e3d877be125d336e423001baef92831b` is built, registered and exact-current-main preflighted. Run genuine 64-Frame sequential stress and active cancellation closure next.',
              '## P7 — COMPLETE / PRODUCTION ACCEPTED\n\nFresh exact P7 final-line source `d6bf2e12e3d877be125d336e423001baef92831b` passed genuine real-Figma 64-Frame sequential stress with max concurrency 1, cooperative active-frame cancellation, untouched closure verification and exact-current-main intake run `34524838931`; PR #110 merged as `f1ee668329de9b05f05885fbc70192a391e5b2c9` and issue #8 is closed completed.',
              'ROADMAP P7 section')
          s = replace_once(s,
              'P6 #494 and P7 #490 remain reference-only. P6 final-line artifact `figma-plugin-dist-p6-final-v2-1` at `ae691fac3c65dcdaf472392e6895fd402ae8fa3c` is runtime-accepted and merged through PR #106. P7 fresh final-line artifact `figma-plugin-dist-p7-final-v2-1` at `d6bf2e12e3d877be125d336e423001baef92831b` is registered final-closure eligible and exact-current-main preflight `34499068236` passed; genuine stress/cancel closure remains.',
              'P6 #494 and P7 #490 remain reference-only. P6 final-line artifact `figma-plugin-dist-p6-final-v2-1` at `ae691fac3c65dcdaf472392e6895fd402ae8fa3c` is runtime-accepted and merged through PR #106. P7 fresh final-line artifact `figma-plugin-dist-p7-final-v2-1` at `d6bf2e12e3d877be125d336e423001baef92831b` is runtime-accepted after genuine stress/cancellation closure + exact-current-main intake and merged through PR #110.',
              'ROADMAP P6/P7')
          s = s.replace('- P7 fresh real 60+ stress/cancellation closure;\n', '', 1)
          write(p, s)

          # CHANGELOG — prepend accepted closure record after title.
          p = 'memory-bank/CHANGELOG.md'
          s = read(p)
          entry = '''## 2026-09-11 — P7 genuine runtime closure and production merge\n\n- Exact final-line build `d6bf2e12e3d877be125d336e423001baef92831b` / run `34497801237` established a valid exact-build P5 prerequisite in real Figma Desktop.\n- Retained real-Figma stress evidence completed 64/64 terminal items with `maxConcurrentProcessors = 1`.\n- Retained cooperative cancellation evidence captured an active frame at request and settled to final `CANCELLED`; P7 runtime/closure acceptance returned accepted with zero failures.\n- Untouched schema-v2 closure export SHA-256 `d2cf6853d4063599fc1f04b4f16507d1be75a6a1e556d6eedb4a5bfc9dd79ab9` (281232 bytes).\n- Exact-current-main closure intake run `34524838931` reset to `f50ac7f8e39822e6278b7da06ca305285d9e6cad`, matched retained archive SHA `b0f16004d35f70aca7bb9edc65f162afe731db4c7d02044b4518e4b31ef685fc`, matched immutable files 5/5 and accepted same-artifact verifier exit 0.\n- PR #110 CI #682 and P12 Offline #37 passed; merge `f1ee668329de9b05f05885fbc70192a391e5b2c9`; issue #8 closed completed.\n- P7 = 100%; historical P0–P7 core = 100%; retained P12 final validation = 80%.\n\n'''
          if not s.startswith('# Changelog\n\n'):
              raise SystemExit('CHANGELOG heading unexpected')
          s = '# Changelog\n\n' + entry + s[len('# Changelog\n\n'):]
          write(p, s)
          PY

          npm run status:verify

          rm -f .github/workflows/p7-status-sync-temp.yml
          git config user.name "P7 Status Sync"
          git config user.email "p7-status-sync@invalid.local"
          git add README.md memory-bank/PROJECT_STATE.md memory-bank/NEXT_ACTIONS.md memory-bank/ROADMAP.md memory-bank/CHANGELOG.md .github/workflows/p7-status-sync-temp.yml
          git diff --cached --check
          git commit -m "docs: record P7 production acceptance"
          git push origin HEAD:docs/p7-production-acceptance-sync
