name: P13 Calibration Fix

on:
  push:
    branches:
      - p13/real-baseline-calibration
    paths:
      - .github/workflows/p13-calibration-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p13/real-baseline-calibration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Verify clean calibration base
        run: |
          expected="c27f8d14535eaf362831047623b920bde863cbd9"
          test "$(git merge-base HEAD origin/main)" = "$expected"
          actual="$(git diff --name-only "$expected"...HEAD | sort)"
          expected_files="$(printf '%s\n' '.github/workflows/p13-calibration-fix.yml' 'scripts/tmp-p13-calibration-fix.py' | sort)"
          test "$actual" = "$expected_files"
      - name: Apply guarded detector calibration patch
        run: python scripts/tmp-p13-calibration-fix.py
      - name: Install and run focused validation
        run: |
          npm install
          npm run typecheck
          npx vitest run tests/p13-responsive-risk.test.ts tests/p13-build-ready.test.ts
      - name: Commit calibrated detector and remove temporary files
        run: |
          git rm .github/workflows/p13-calibration-fix.yml scripts/tmp-p13-calibration-fix.py
          git add src/core/responsive-risk.ts tests/p13-responsive-risk.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P13: calibrate responsive-risk false-positive handling"
          git push origin HEAD:p13/real-baseline-calibration
