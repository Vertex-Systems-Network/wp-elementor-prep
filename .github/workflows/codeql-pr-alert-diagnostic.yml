name: CodeQL PR Alert Diagnostic

on:
  push:
    branches:
      - toolchain/node22-vitest5
    paths:
      - '.github/workflows/codeql-pr-alert-diagnostic.yml'

permissions:
  contents: read
  security-events: read

jobs:
  inspect-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print sanitized PR-scoped open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/code-scanning/alerts?pr=636&state=open&per_page=100" > alerts.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const alerts = JSON.parse(readFileSync('alerts.json', 'utf8'));
          const sanitized = alerts.map((alert) => ({
            number: alert.number,
            rule: alert.rule?.id ?? null,
            severity: alert.rule?.security_severity_level ?? alert.rule?.severity ?? null,
            description: alert.rule?.description ?? null,
            createdAt: alert.created_at ?? null,
            path: alert.most_recent_instance?.location?.path ?? null,
            startLine: alert.most_recent_instance?.location?.start_line ?? null,
            state: alert.state ?? null,
            classifications: alert.most_recent_instance?.classifications ?? [],
          }));
          console.log(JSON.stringify(sanitized, null, 2));
          NODE
