name: P6 Registered Artifact Preflight

on:
  push:
    branches:
      - chore/register-p6-final-ae691fa

permissions:
  contents: write
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Download exact registered P6 archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'https://api.github.com/repos/Vertex-Systems-Network/wp-elementor-prep/actions/artifacts/10150054305/zip' \
            -o /tmp/p6-final.zip
          printf '%s  %s\n' '4d96a313c93865029737f6ce0f05c09dda9c38a15a0d2594e2428bf360fe26c0' '/tmp/p6-final.zip' | sha256sum -c -
          mkdir -p /tmp/p6-final
          unzip -q /tmp/p6-final.zip -d /tmp/p6-final
      - name: Require final-closure preflight PASS
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run status:verify
          npm run runtime:preflight -- p6 /tmp/p6-final --archive=/tmp/p6-final.zip --intent=final-closure
          git diff --check
      - name: Remove one-shot workflow after proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P6 Artifact Registration'
          git config user.email 'p6-artifact-registration@invalid.local'
          rm .github/workflows/p6-register-preflight.yml
          git add -u .github/workflows/p6-register-preflight.yml
          git commit -m 'Remove completed P6 registration preflight workflow'
          git push origin HEAD:chore/register-p6-final-ae691fa
