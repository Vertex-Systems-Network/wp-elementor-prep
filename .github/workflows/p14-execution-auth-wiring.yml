name: P14 Execution Authorization Wiring

on:
  push:
    branches:
      - p14/execution-registry-authorization
    paths:
      - '.github/workflows/p14-execution-auth-wiring.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 6b8e29210c114eff465e36d5cac2cfd666c00276
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p14/execution-registry-authorization
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify bounded branch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA"..HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/p14-execution-auth-wiring.yml
          scripts/tmp-p14-execution-auth-wiring.py
          src/core/p14-plan-authorization.ts
          src/core/p14-preparation-types.ts
          tests/p14-plan-authorization.test.ts
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Apply exact execution authorization wiring
        run: python scripts/tmp-p14-execution-auth-wiring.py
      - name: Install dependencies
        run: npm install
      - name: Verify focused P14 contracts
        run: |
          npm run typecheck
          npx vitest run tests/p14-plan-authorization.test.ts tests/p14-retained-duplicate.test.ts tests/p14-integrity.test.ts
      - name: Commit product wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/p14-retained-duplicate-transaction.ts tests/p14-retained-duplicate.test.ts tests/p14-integrity.test.ts
          git commit -m "P14: enforce recipe authorization before transaction adapter access"
          git push origin HEAD:p14/execution-registry-authorization
      - name: Remove temporary wiring files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p14-execution-auth-wiring.yml scripts/tmp-p14-execution-auth-wiring.py
          git commit -m "chore: remove temporary P14 execution authorization wiring"
          git push origin HEAD:p14/execution-registry-authorization
