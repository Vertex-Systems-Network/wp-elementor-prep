name: P13 Runtime Evidence Artifact Once

on:
  pull_request:
    paths:
      - '.github/workflows/p13-runtime-artifact-once.yml'

permissions:
  contents: read

jobs:
  build-runtime-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'artifact/p13-runtime-v3-295'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 9955be0561807550a7ad1444d8d013d783820188
      FIGMA_PLUGIN_ID: '1680034649341961379'
      CURRENT_ANALYZER_VERSION: p13-core-v2
      ARTIFACT_NAME: p13-runtime-evidence-9955be056180-analyzer-v2
    steps:
      - name: Check out exact artifact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify artifact branch code equals exact source
        shell: bash
        run: |
          test "$(git rev-parse "$SOURCE_SHA")" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" -- . ':(exclude).github/workflows/p13-runtime-artifact-once.yml'

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Install exact locked dependencies
        run: npm ci

      - name: Build traceable development plugin
        run: npm run build

      - name: Verify runtime security and analyzer contracts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('dist/manifest.json', 'utf8'));
          if (manifest.id !== process.env.FIGMA_PLUGIN_ID) throw new Error('Unexpected plugin ID.');
          if (manifest.networkAccess?.allowedDomains?.length !== 1 || manifest.networkAccess.allowedDomains[0] !== 'none') {
            throw new Error('Development runtime artifact must remain network-free.');
          }
          if (!manifest.menu?.some((item) => item.command === 'p13-runtime-evidence')) {
            throw new Error('P13 runtime evidence developer command is missing.');
          }
          const code = await readFile('dist/code.js', 'utf8');
          if (!code.includes(process.env.SOURCE_SHA)) throw new Error('Compiled runtime is not bound to the exact source SHA.');
          if (!code.includes(process.env.CURRENT_ANALYZER_VERSION)) throw new Error('Compiled runtime is missing current analyzer identity.');
          NODE

      - name: Assemble and verify evidence artifact
        shell: bash
        run: |
          rm -rf p13-runtime-evidence
          mkdir -p p13-runtime-evidence
          cp dist/code.js dist/ui.html dist/manifest.json p13-runtime-evidence/
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const sha256 = async (path) => createHash('sha256').update(await readFile(path)).digest('hex');
          const provenance = {
            schemaVersion: 1,
            artifactType: 'p13-runtime-evidence-development',
            sourceSha: process.env.SOURCE_SHA,
            artifactBranchHead: process.env.GITHUB_SHA,
            actionsRunId: process.env.GITHUB_RUN_ID,
            actionsRunNumber: process.env.GITHUB_RUN_NUMBER,
            pluginId: process.env.FIGMA_PLUGIN_ID,
            analyzerVersion: process.env.CURRENT_ANALYZER_VERSION,
            acceptanceAuthority: false,
            productionReleaseArtifact: false,
            doNotPublish: true,
            targetCompatibilityClaim: false,
            networkAccess: { allowedDomains: ['none'] },
            developerCommand: 'p13-runtime-evidence',
            parityIntake: {
              script: 'scripts/p13-runtime-parity-intake.mjs',
              sha256: await sha256('scripts/p13-runtime-parity-intake.mjs'),
            },
            packageLockSha256: await sha256('package-lock.json'),
          };
          await writeFile(
            'p13-runtime-evidence/P13_RUNTIME_ARTIFACT_PROVENANCE.json',
            `${JSON.stringify(provenance, null, 2)}\n`,
            'utf8',
          );
          NODE
          cat > p13-runtime-evidence/README-P13-RUNTIME-EVIDENCE.txt <<'EOF'
          P13 DEVELOPMENT RUNTIME EVIDENCE ARTIFACT

          This artifact is for genuine Figma Desktop runtime evidence capture only.
          It is NOT a production release artifact and MUST NOT be published.

          Required operator flow:
          1. Import manifest.json as a development plugin in Figma Desktop.
          2. Open the intended accepted real file/frame.
          3. Run Audit on exactly one current Frame.
          4. Open "Developer: P13 Runtime Evidence + P14 Guided Prepare Preview".
          5. Copy the exact P13 runtime evidence JSON without editing it.
          6. Run the repository's current p13:runtime-parity intake against the matching CLI Build-Ready report.
          7. Perform a separate internal P13 acceptance review.

          acceptanceAuthority=false
          productionReleaseArtifact=false
          doNotPublish=true
          targetCompatibilityClaim=false
          EOF
          (
            cd p13-runtime-evidence
            sha256sum code.js ui.html manifest.json P13_RUNTIME_ARTIFACT_PROVENANCE.json README-P13-RUNTIME-EVIDENCE.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload traceable non-publishable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: p13-runtime-evidence/
          if-no-files-found: error
          retention-days: 30
