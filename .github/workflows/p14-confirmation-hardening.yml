name: P14 Confirmation Hardening

on:
  push:
    branches:
      - p14/explicit-plan-confirmation
    paths:
      - 'scripts/p14-confirmation-hardening.py'
      - '.github/workflows/p14-confirmation-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v7
        uses: actions/checkout@v7
        with:
          ref: p14/explicit-plan-confirmation
          fetch-depth: 0

      - name: Run actions/setup-node@v7
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verify bounded branch scope
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "p14/explicit-plan-confirmation"
          test -f scripts/p14-confirmation-hardening.py
          test -f .github/workflows/p14-confirmation-hardening.yml

      - name: Apply exact confirmation hardening
        run: python scripts/p14-confirmation-hardening.py

      - name: Install dependencies
        run: npm install

      - name: Verify focused P14 confirmation contracts
        run: |
          npm run typecheck
          npx vitest run \
            tests/p14-confirmation.test.ts \
            tests/p14-confirmation-transaction.test.ts \
            tests/p14-retained-duplicate.test.ts \
            tests/p14-integrity.test.ts \
            tests/p14-transaction-coordinator.test.ts \
            tests/p14-plan-authorization.test.ts \
            tests/p14-input-bounds.test.ts

      - name: Commit product hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/p14-preparation-confirmation.ts tests/p14-confirmation.test.ts tests/p14-confirmation-transaction.test.ts
          if git diff --cached --quiet; then
            echo "No product changes staged"
            exit 1
          fi
          git commit -m "P14: harden confirmation bounds and timestamps"
          git push origin HEAD:p14/explicit-plan-confirmation

      - name: Remove temporary hardening files
        if: success()
        run: |
          set -euo pipefail
          git pull --rebase origin p14/explicit-plan-confirmation
          git rm scripts/p14-confirmation-hardening.py .github/workflows/p14-confirmation-hardening.yml
          git commit -m "chore: remove temporary P14 confirmation hardening files"
          git push origin HEAD:p14/explicit-plan-confirmation
