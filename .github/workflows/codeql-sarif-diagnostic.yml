name: CodeQL SARIF Diagnostic

on:
  push:
    branches:
      - toolchain/node22-vitest5
    paths:
      - '.github/workflows/codeql-sarif-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node 22.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0

      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze without uploading
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          output: codeql-sarif
          upload: never

      - name: Upload short-lived SARIF diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif-diagnostic-${{ github.run_number }}
          path: codeql-sarif
          if-no-files-found: error
          retention-days: 1
