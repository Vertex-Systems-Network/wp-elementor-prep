name: P12 Downstream Conflict Probe

on:
  push:
    branches: [integration/p12-p5-rehearsal]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Fetch canonical refs
        run: |
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/p5-safe-recipes:refs/remotes/origin/feat/p5-safe-recipes' \
            '+refs/heads/feat/p6-advanced-structures:refs/remotes/origin/feat/p6-advanced-structures' \
            '+refs/heads/feat/p7-batch-queue-core:refs/remotes/origin/feat/p7-batch-queue-core'
      - name: Build the same resolved P5 rehearsal candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf downstream-conflict-probe
          mkdir -p downstream-conflict-probe
          cp src/ui/ui.html /tmp/p12-release-ui.html

          git config user.name "P12 Downstream Probe"
          git config user.email "p12-downstream-probe@invalid.local"

          set +e
          git merge --no-commit --no-ff origin/feat/p5-safe-recipes
          merge_exit=$?
          set -e
          if [ "$merge_exit" -ne 1 ]; then
            echo "Expected P5 merge conflicts; got exit $merge_exit" >&2
            exit 1
          fi

          git checkout --ours -- \
            .github/workflows/ci.yml \
            README.md \
            memory-bank/CHANGELOG.md \
            memory-bank/NEXT_ACTIONS.md \
            memory-bank/PROJECT_STATE.md \
            memory-bank/ROADMAP.md

          cp /tmp/p12-release-ui.html src/ui/release-ui.html
          node scripts/p12-resolve-p5-rehearsal.mjs
          node scripts/p12-update-p9-integration-contract.mjs
          git add -A

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo 'P5 rehearsal still has unresolved conflicts.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git commit -m 'P12 temporary resolved P5 candidate'
          git rev-parse HEAD > downstream-conflict-probe/resolved-p5-candidate.txt
          git rev-parse origin/main > downstream-conflict-probe/main-head.txt
          git rev-parse origin/feat/p5-safe-recipes > downstream-conflict-probe/p5-head.txt
          git rev-parse origin/feat/p6-advanced-structures > downstream-conflict-probe/p6-head.txt
          git rev-parse origin/feat/p7-batch-queue-core > downstream-conflict-probe/p7-head.txt
      - name: Probe P6 and P7 merges
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(cat downstream-conflict-probe/resolved-p5-candidate.txt)"

          probe() {
            track="$1"
            ref="$2"
            git reset --hard "$candidate"
            git clean -fd
            set +e
            git merge --no-commit --no-ff "$ref"
            exit_code=$?
            set -e
            printf '%s\n' "$exit_code" > "downstream-conflict-probe/${track}-merge-exit-code.txt"
            git diff --name-only --diff-filter=U | sort > "downstream-conflict-probe/${track}-conflicts.txt"
            git diff --stat > "downstream-conflict-probe/${track}-working-tree-stat.txt" || true
            if [ "$exit_code" -eq 0 ]; then
              git merge --abort || git reset --hard "$candidate"
            else
              git merge --abort
            fi
          }

          probe p6 origin/feat/p6-advanced-structures
          probe p7 origin/feat/p7-batch-queue-core
      - name: Emit machine-readable probe evidence
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const read = (name) => fs.readFileSync(`downstream-conflict-probe/${name}`, 'utf8').trim();
          const lines = (name) => {
            const value = read(name);
            return value ? value.split(/\r?\n/).filter(Boolean) : [];
          };
          const report = {
            schemaVersion: 1,
            kind: 'p12-downstream-conflict-probe',
            acceptanceAuthority: false,
            mainHead: read('main-head.txt'),
            p5Head: read('p5-head.txt'),
            p6Head: read('p6-head.txt'),
            p7Head: read('p7-head.txt'),
            resolvedP5Candidate: read('resolved-p5-candidate.txt'),
            p6: {
              mergeExitCode: Number(read('p6-merge-exit-code.txt')),
              conflicts: lines('p6-conflicts.txt')
            },
            p7: {
              mergeExitCode: Number(read('p7-merge-exit-code.txt')),
              conflicts: lines('p7-conflicts.txt')
            },
            note: 'Conflict probe only. Does not authorize P5/P6/P7 integration or runtime acceptance.'
          };
          fs.writeFileSync('downstream-conflict-probe/probe-evidence.json', JSON.stringify(report, null, 2) + '\n');
          NODE
          cat downstream-conflict-probe/probe-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: p12-downstream-conflict-probe
          path: downstream-conflict-probe
          if-no-files-found: error
