name: Docs Sync 309 Recovery

on:
  push:
    branches: [docs/p14-p15-status-sync-309]
    paths:
      - '.github/workflows/docs-sync-309-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Reuse bounded replacement script and normalize changed hard-break
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/docs-sync-309.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "          PY\n"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('Unable to extract bounded #309 replacement script')
          body = workflow.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(body), 'docs-sync-309-extracted.py', 'exec'), {})

          p = Path('docs/P14_FOUNDATION_IMPLEMENTATION.md')
          text = p.read_text()
          old = 'Status: CORE IMPLEMENTATION IN PROGRESS / RUNTIME UNWIRED  \n'
          new = 'Status: CORE IMPLEMENTATION IN PROGRESS / RUNTIME UNWIRED\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one changed P14 status hard-break, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          npm ci
          npm run status:verify
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "README.md docs/P14_FOUNDATION_IMPLEMENTATION.md memory-bank/NEXT_ACTIONS.md memory-bank/PROJECT_STATE.md "
      - name: Commit canonical docs and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/docs-sync-309.yml .github/workflows/docs-sync-309-recovery.yml
          git add README.md docs/P14_FOUNDATION_IMPLEMENTATION.md memory-bank/PROJECT_STATE.md memory-bank/NEXT_ACTIONS.md .github/workflows/docs-sync-309.yml .github/workflows/docs-sync-309-recovery.yml
          git diff --cached --check
          git commit -m "Docs: sync P14 review packet and P15 foundation status (#309)"
          git push origin HEAD:docs/p14-p15-status-sync-309
