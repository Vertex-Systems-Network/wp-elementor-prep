name: Security NPM Audit Once

on:
  pull_request:
    paths:
      - '.github/workflows/security-npm-audit-once.yml'
      - 'package-lock.json'
      - 'package.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=high
