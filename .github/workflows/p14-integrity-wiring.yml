name: P14 Integrity Wiring

on:
  push:
    branches:
      - p14/plan-receipt-integrity

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 80b70b922904da3863dbc17da93822ea127cb5f3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p14/plan-receipt-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify bounded branch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA"..HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/p14-integrity-wiring.yml
          scripts/tmp-p14-integrity-wiring.py
          src/core/p14-plan-integrity.ts
          src/core/p14-preparation-plan.ts
          src/core/p14-preparation-receipt.ts
          src/core/p14-preparation-types.ts
          tests/p14-integrity.test.ts
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Apply exact transaction wiring
        run: python scripts/tmp-p14-integrity-wiring.py
      - name: Install dependencies
        run: npm install
      - name: Verify focused P14 integrity contracts
        run: |
          npm run typecheck
          npx vitest run tests/p14-integrity.test.ts tests/p14-retained-duplicate.test.ts tests/p14-preparation-ordering.test.ts
      - name: Commit product wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/p14-retained-duplicate-transaction.ts
          git commit -m "P14: validate plans before retained duplicate runtime"
      - name: Remove temporary wiring files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p14-integrity-wiring.yml scripts/tmp-p14-integrity-wiring.py
          git commit -m "chore: remove temporary P14 integrity wiring"
          git push origin HEAD:p14/plan-receipt-integrity
