name: P12 Downstream Status Sync

on:
  push:
    branches: [docs/p12-downstream-rehearsal-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Apply targeted status synchronization
        run: node scripts/p12-sync-downstream-rehearsal-status.mjs
      - name: Verify status contract
        run: npm run status:verify
      - name: Remove one-shot helpers and commit docs-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "P12 Status Sync"
          git config user.email "p12-status-sync@invalid.local"
          git rm scripts/p12-sync-downstream-rehearsal-status.mjs .github/workflows/p12-downstream-status-sync.yml
          git add README.md memory-bank/PROJECT_STATE.md memory-bank/ROADMAP.md memory-bank/NEXT_ACTIONS.md memory-bank/CHANGELOG.md
          git commit -m 'docs: sync P6 and P7 rehearsal checkpoints'
          git push origin HEAD:docs/p12-downstream-rehearsal-sync
