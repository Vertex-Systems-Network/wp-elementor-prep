<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pella Elementor Prep</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; background: var(--figma-color-bg); color: var(--figma-color-text); }
    .app { padding: 16px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .sub { font-size: 11px; opacity: .65; margin-bottom: 16px; }
    .hero, .backlogHero { border: 1px solid var(--figma-color-border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .score { font-size: 34px; font-weight: 700; line-height: 1; }
    .status { font-size: 11px; font-weight: 700; margin-top: 5px; }
    .meta { font-size: 11px; opacity: .7; margin-top: 8px; }
    .row { border-top: 1px solid var(--figma-color-border); padding: 10px 0; }
    .row:first-child { border-top: 0; }
    .rowHead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .name { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { font-size: 10px; font-weight: 700; opacity: .75; white-space: nowrap; }
    .recipe { font-size: 10px; opacity: .72; margin-top: 3px; }
    .finding { font-size: 10px; opacity: .78; margin-top: 4px; line-height: 1.35; }
    .finding.error { opacity: 1; }
    .patternList, .roleList { margin-top: 5px; display: grid; gap: 3px; }
    .pattern, .role { font-size: 9px; opacity: .72; display: flex; justify-content: space-between; gap: 8px; }
    .role { opacity: .82; }
    .patternTarget, .roleTarget { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    details { margin-top: 5px; }
    summary { font-size: 10px; cursor: pointer; opacity: .65; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 9px; opacity: .7; margin: 5px 0 0; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    button { width: 100%; padding: 9px 10px; border-radius: 6px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg-secondary); color: var(--figma-color-text); font-weight: 600; cursor: pointer; }
    .empty { border: 1px dashed var(--figma-color-border); border-radius: 8px; padding: 18px; font-size: 12px; line-height: 1.5; opacity: .75; }
    .metricGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 10px; }
    .metric { font-size: 10px; opacity: .72; }
    .metric strong { display: block; font-size: 12px; opacity: 1; }
    .sectionTitle { font-size: 12px; font-weight: 700; margin: 16px 0 6px; }
    .backlogGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
    .backlogStat { border: 1px solid var(--figma-color-border); border-radius: 6px; padding: 6px; font-size: 9px; opacity: .75; }
    .backlogStat strong { display: block; font-size: 14px; opacity: 1; }
    .backlogItem { border-top: 1px solid var(--figma-color-border); padding: 9px 0; }
    .backlogItem:first-child { border-top: 0; }
    .backlogMeta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; font-size: 9px; opacity: .68; }
    .backlogAction { font-size: 10px; line-height: 1.35; margin-top: 5px; opacity: .8; }
    .backlogExports[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Pella Elementor Prep</h1>
    <div class="sub">Audit + actionable backlog + P3 read-only validator · no design mutations</div>
    <div id="root" class="empty">Select one Frame to audit, or two Frames to compare original vs candidate.</div>
    <div class="actions">
      <button id="audit">Run audit</button>
      <button id="validate">Compare 2 frames</button>
    </div>
    <div id="backlog-exports" class="actions backlogExports" hidden>
      <button id="export-backlog-json">Export backlog.json</button>
      <button id="export-backlog-md">Export backlog.md</button>
    </div>
  </div>

  <script>
    const root = document.getElementById('root');
    const backlogExports = document.getElementById('backlog-exports');
    let latestBacklogJson = '';
    let latestBacklogMarkdown = '';

    document.getElementById('audit').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'audit-request' } }, '*');
    });
    document.getElementById('validate').addEventListener('click', () => {
      root.className = 'empty';
      root.textContent = 'Exporting and comparing selected section frames…';
      backlogExports.hidden = true;
      parent.postMessage({ pluginMessage: { type: 'validation-request' } }, '*');
    });

    function downloadText(filename, content, type) {
      if (!content) return;
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    document.getElementById('export-backlog-json').addEventListener('click', () => {
      downloadText('backlog.json', latestBacklogJson, 'application/json;charset=utf-8');
    });
    document.getElementById('export-backlog-md').addEventListener('click', () => {
      downloadText('backlog.md', latestBacklogMarkdown, 'text/markdown;charset=utf-8');
    });

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function round(value, digits = 4) {
      const scale = 10 ** digits;
      return Math.round(value * scale) / scale;
    }

    async function decodePng(bytes) {
      const blob = new Blob([bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes)], { type: 'image/png' });
      const bitmap = await createImageBitmap(blob);
      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      if (!context) throw new Error('Canvas 2D context is unavailable.');
      context.drawImage(bitmap, 0, 0);
      const imageData = context.getImageData(0, 0, bitmap.width, bitmap.height);
      if (typeof bitmap.close === 'function') bitmap.close();
      return { width: imageData.width, height: imageData.height, data: imageData.data };
    }

    function comparePixels(before, after, channelTolerance) {
      const sameDimensions = before.width === after.width && before.height === after.height;
      if (!sameDimensions) {
        return {
          sameDimensions: false,
          widthBefore: before.width,
          heightBefore: before.height,
          widthAfter: after.width,
          heightAfter: after.height,
          totalPixels: 0,
          changedPixels: 0,
          changedPixelPct: 100,
          meanChannelDelta: 255,
          maxChannelDelta: 255,
          channelTolerance,
        };
      }

      const totalPixels = before.width * before.height;
      let changedPixels = 0;
      let sumChannelDelta = 0;
      let maxChannelDelta = 0;

      for (let pixel = 0; pixel < totalPixels; pixel += 1) {
        const offset = pixel * 4;
        let changed = false;
        for (let channel = 0; channel < 4; channel += 1) {
          const delta = Math.abs(before.data[offset + channel] - after.data[offset + channel]);
          sumChannelDelta += delta;
          maxChannelDelta = Math.max(maxChannelDelta, delta);
          if (delta > channelTolerance) changed = true;
        }
        if (changed) changedPixels += 1;
      }

      return {
        sameDimensions: true,
        widthBefore: before.width,
        heightBefore: before.height,
        widthAfter: after.width,
        heightAfter: after.height,
        totalPixels,
        changedPixels,
        changedPixelPct: totalPixels ? round((changedPixels / totalPixels) * 100) : 0,
        meanChannelDelta: totalPixels ? round(sumChannelDelta / (totalPixels * 4)) : 0,
        maxChannelDelta,
        channelTolerance,
      };
    }

    function renderBacklog(backlog) {
      if (!backlog || !Array.isArray(backlog.items)) return '';
      const summary = backlog.summary;
      const items = backlog.items.filter((item) => item.status !== 'RESOLVED').slice(0, 12).map((item) => {
        const context = item.contexts && item.contexts[0] ? item.contexts[0] : {};
        const location = [context.pageName, context.frameName, context.sectionName, context.nodeName].filter(Boolean).join(' / ');
        return `
          <div class="backlogItem">
            <div class="rowHead">
              <div class="name">${escapeHtml(item.title)}</div>
              <div class="badge">${escapeHtml(item.category)} · ${escapeHtml(item.priority)}</div>
            </div>
            <div class="backlogMeta">
              <span>${escapeHtml(item.id)}</span>
              <span>${escapeHtml(item.status)}</span>
              <span>${escapeHtml(item.delta)}</span>
              <span>${escapeHtml(item.code)}</span>
              <span>${item.occurrences} occurrence${item.occurrences === 1 ? '' : 's'}</span>
            </div>
            ${location ? `<div class="finding">${escapeHtml(location)}</div>` : ''}
            <div class="backlogAction">${escapeHtml(item.proposedAction)}</div>
          </div>`;
      }).join('');

      return `
        <div class="sectionTitle">Actionable backlog</div>
        <div class="backlogHero">
          <div class="rowHead">
            <div class="name">${summary.active} active items</div>
            <div class="badge">schema v${backlog.schemaVersion}</div>
          </div>
          <div class="backlogGrid">
            <div class="backlogStat"><strong>${summary.byCategory.ERROR}</strong>ERROR</div>
            <div class="backlogStat"><strong>${summary.byCategory.WARNING}</strong>WARNING</div>
            <div class="backlogStat"><strong>${summary.byCategory.IMPROVEMENT}</strong>IMPROVE</div>
            <div class="backlogStat"><strong>${summary.byCategory.INFO}</strong>INFO</div>
          </div>
          <div class="meta">Δ ${summary.byDelta.NEW} new · ${summary.byDelta.RESOLVED} resolved · ${summary.byDelta.REGRESSED} regressed · ${summary.byDelta.UNCHANGED} unchanged</div>
        </div>
        <div>${items || '<div class="empty">No active backlog items.</div>'}</div>
        ${summary.active > 12 ? `<div class="meta">Showing first 12 active items. Export JSON/Markdown for the full backlog.</div>` : ''}`;
    }

    function renderAudit(report, backlog) {
      const sections = report.sections.map((section) => {
        const first = section.findings[0];
        const detections = Array.isArray(section.detections)
          ? section.detections
          : (section.detection ? [section.detection] : []);
        const roles = Array.isArray(section.roleDetections) ? section.roleDetections : [];
        const primary = detections[0] || null;
        const primaryLabel = primary
          ? `${primary.semanticHint ? `${primary.semanticHint} ← ` : ''}${primary.pattern}`
          : 'pattern not classified yet';
        const recipe = primary ? `${primaryLabel} · confidence ${primary.confidence}%` : primaryLabel;
        const patternRows = detections.slice(0, 4).map((detection) => {
          const label = `${detection.semanticHint ? `${detection.semanticHint} ← ` : ''}${detection.pattern}`;
          return `
          <div class="pattern">
            <span class="patternTarget">${escapeHtml(label)} @ ${escapeHtml(detection.targetNodeName)}</span>
            <span>${detection.confidence}%</span>
          </div>`;
        }).join('');
        const roleRows = roles.slice(0, 3).map((role) => `
          <div class="role">
            <span class="roleTarget">preserve ${escapeHtml(role.role)} @ ${escapeHtml(role.targetNodeName)}</span>
            <span>${role.confidence}%</span>
          </div>`).join('');
        const evidence = (detections.length || roles.length)
          ? JSON.stringify({ detections, roles }, null, 2)
          : '';
        return `
          <div class="row">
            <div class="rowHead">
              <div class="name">${escapeHtml(section.name)}</div>
              <div class="badge">${section.score} · ${section.status}</div>
            </div>
            <div class="recipe">${escapeHtml(recipe)} · Auto Layout ${section.stats.autoLayoutCoveragePct}%</div>
            ${first ? `<div class="finding">${escapeHtml(first.title)}</div>` : ''}
            ${patternRows ? `<div class="patternList">${patternRows}</div>` : ''}
            ${roleRows ? `<div class="roleList">${roleRows}</div>` : ''}
            ${evidence ? `<details><summary>Detection evidence (${detections.length} patterns · ${roles.length} special roles)</summary><pre>${escapeHtml(evidence)}</pre></details>` : ''}
          </div>`;
      }).join('');

      root.className = '';
      root.innerHTML = `
        <div class="hero">
          <div class="score">${report.score}</div>
          <div class="status">${report.status}</div>
          <div class="meta">${escapeHtml(report.root.name)} · ${Math.round(report.root.width)} × ${Math.round(report.root.height)} · ${report.stats.nodes} nodes</div>
          <div class="meta">Auto Layout coverage ${report.stats.autoLayoutCoveragePct}% · ${report.sections.length} sections discovered</div>
        </div>
        <div>${sections || '<div class="empty">No sections discovered yet.</div>'}</div>
        ${renderBacklog(backlog)}`;
    }

    function renderValidation(message) {
      const report = message.report;
      const pixel = report.metrics.pixel;
      const findingRows = report.findings.map((item) => `
        <div class="row">
          <div class="rowHead"><div class="name">${escapeHtml(item.code)}</div><div class="badge">FAIL</div></div>
          <div class="finding error">${escapeHtml(item.title)} — ${escapeHtml(item.detail)}</div>
          <details><summary>Evidence</summary><pre>${escapeHtml(JSON.stringify(item.evidence, null, 2))}</pre></details>
        </div>`).join('');

      root.className = '';
      root.innerHTML = `
        <div class="hero">
          <div class="score">${report.passed ? 'PASS' : 'FAIL'}</div>
          <div class="status">P3 ${escapeHtml(report.thresholdVersion)} VALIDATION</div>
          <div class="meta">Before: ${escapeHtml(message.labels.before)}</div>
          <div class="meta">Candidate: ${escapeHtml(message.labels.after)}</div>
          <div class="meta">Render scale: ${round(message.renderScale * 100, 2)}%</div>
          <div class="metricGrid">
            <div class="metric"><strong>${report.metrics.textAnchorCountBefore}/${report.metrics.textAnchorCountAfter}</strong>text anchors</div>
            <div class="metric"><strong>${report.metrics.imageAnchorCountBefore}/${report.metrics.imageAnchorCountAfter}</strong>image anchors</div>
            <div class="metric"><strong>${round(report.metrics.maxTextPositionDriftPx, 3)} px</strong>max text move</div>
            <div class="metric"><strong>${round(report.metrics.maxImagePositionDriftPx, 3)} px</strong>max image move</div>
            <div class="metric"><strong>${pixel ? pixel.changedPixelPct : '—'}%</strong>changed pixels</div>
            <div class="metric"><strong>${pixel ? pixel.meanChannelDelta : '—'}</strong>mean channel Δ</div>
          </div>
        </div>
        ${findingRows || '<div class="empty">All current integrity and rendered-pixel gates passed.</div>'}`;
    }

    window.onmessage = async (event) => {
      const message = event.data.pluginMessage;
      if (!message) return;

      if (message.type === 'audit-error' || message.type === 'validation-error') {
        root.className = 'empty';
        root.textContent = message.message;
        if (message.type === 'audit-error') backlogExports.hidden = true;
        return;
      }

      if (message.type === 'audit-result') {
        latestBacklogJson = typeof message.backlogJson === 'string' ? message.backlogJson : '';
        latestBacklogMarkdown = typeof message.backlogMarkdown === 'string' ? message.backlogMarkdown : '';
        backlogExports.hidden = !(latestBacklogJson && latestBacklogMarkdown);
        renderAudit(message.report, message.backlog);
        return;
      }

      if (message.type === 'validation-pixel-request') {
        try {
          const [before, after] = await Promise.all([
            decodePng(message.beforePng),
            decodePng(message.afterPng),
          ]);
          const pixelMetrics = comparePixels(before, after, message.channelTolerance);
          parent.postMessage({
            pluginMessage: {
              type: 'validation-pixel-result',
              validationId: message.validationId,
              pixelMetrics,
            },
          }, '*');
        } catch (error) {
          root.className = 'empty';
          root.textContent = `Pixel comparison failed: ${error instanceof Error ? error.message : String(error)}`;
        }
        return;
      }

      if (message.type === 'validation-result') {
        backlogExports.hidden = true;
        renderValidation(message);
      }
    };
  </script>
</body>
</html>
