<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WP Builders Prepare</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; background: var(--figma-color-bg); color: var(--figma-color-text); }
    .app { padding: 16px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .sub { font-size: 11px; opacity: .65; margin-bottom: 16px; }
    .hero, .backlogHero { border: 1px solid var(--figma-color-border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .score { font-size: 34px; font-weight: 700; line-height: 1; }
    .status { font-size: 11px; font-weight: 700; margin-top: 5px; }
    .meta { font-size: 11px; opacity: .7; margin-top: 8px; }
    .row { border-top: 1px solid var(--figma-color-border); padding: 10px 0; }
    .row:first-child { border-top: 0; }
    .rowHead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .name { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { font-size: 10px; font-weight: 700; opacity: .75; white-space: nowrap; }
    .recipe { font-size: 10px; opacity: .72; margin-top: 3px; }
    .finding { font-size: 10px; opacity: .78; margin-top: 4px; line-height: 1.35; }
    .finding.error { opacity: 1; }
    .patternList, .roleList { margin-top: 5px; display: grid; gap: 3px; }
    .pattern, .role { font-size: 9px; opacity: .72; display: flex; justify-content: space-between; gap: 8px; }
    .role { opacity: .82; }
    .patternTarget, .roleTarget { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    details { margin-top: 5px; }
    summary { font-size: 10px; cursor: pointer; opacity: .65; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 9px; opacity: .7; margin: 5px 0 0; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .inlineActions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .inlineActions.one { grid-template-columns: 1fr; }
    button { width: 100%; padding: 9px 10px; border-radius: 6px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg-secondary); color: var(--figma-color-text); font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    .smallButton { font-size: 10px; padding: 7px 8px; }
    #batch { grid-column: 1 / -1; }
    .empty { border: 1px dashed var(--figma-color-border); border-radius: 8px; padding: 18px; font-size: 12px; line-height: 1.5; opacity: .75; }
    .metricGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 10px; }
    .metric { font-size: 10px; opacity: .72; }
    .metric strong { display: block; font-size: 12px; opacity: 1; }
    .sectionTitle { font-size: 12px; font-weight: 700; margin: 16px 0 6px; }
    .backlogGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
    .backlogStat { border: 1px solid var(--figma-color-border); border-radius: 6px; padding: 6px; font-size: 9px; opacity: .75; }
    .backlogStat strong { display: block; font-size: 14px; opacity: 1; }
    .backlogItem { border-top: 1px solid var(--figma-color-border); padding: 9px 0; }
    .backlogItem:first-child { border-top: 0; }
    .backlogMeta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; font-size: 9px; opacity: .68; }
    .backlogAction { font-size: 10px; line-height: 1.35; margin-top: 5px; opacity: .8; }
    .exportPanel[hidden] { display: none; }
    .checkpoint { border: 1px solid var(--figma-color-border); border-radius: 8px; padding: 10px; margin: 10px 0; }
    .progressTrack { height: 6px; border-radius: 999px; overflow: hidden; background: var(--figma-color-bg-secondary); margin-top: 10px; }
    .progressFill { height: 100%; background: var(--figma-color-text); opacity: .72; }
  </style>
</head>
<body>
  <div class="app">
    <h1>WP Builders Prepare</h1>
    <div class="sub">Audit + P13 Build-Ready + read-only P14 Guided Prepare preview + P3 validator + P5 Safe Fix + P7 batch queue</div>
    <div id="root" class="empty">Select one Frame to audit/preview, two Frames to compare, or multiple Frames for P7 batch processing.</div>
    <div class="actions">
      <button id="audit">Run audit</button>
      <button id="p14-preview">Preview Guided Prepare</button>
      <button id="plan">Preview safe fixes</button>
      <button id="validate">Compare 2 frames</button>
      <button id="selftest">Runtime self-test</button>
      <button id="batch">Run selected batch</button>
    </div>
    <div id="export-panel" class="actions exportPanel" hidden>
      <button id="export-audit-json">Export audit-report.json</button>
      <button id="export-audit-md">Export audit-report.md</button>
      <button id="export-backlog-json">Export backlog.json</button>
      <button id="export-backlog-md">Export backlog.md</button>
      <button id="export-build-ready-json">Export build-ready-report.json</button>
    </div>
  </div>

  <script>
    const root = document.getElementById('root');
    const exportPanel = document.getElementById('export-panel');
    let latestAuditJson = '';
    let latestAuditMarkdown = '';
    let latestBacklogJson = '';
    let latestBacklogMarkdown = '';
    let latestBuildReadyJson = '';

    function post(type, extra = {}) {
      parent.postMessage({ pluginMessage: { type, ...extra } }, '*');
    }

    document.getElementById('audit').addEventListener('click', () => post('audit-request'));
    document.getElementById('p14-preview').addEventListener('click', () => {
      root.className = 'empty';
      root.textContent = 'Loading the read-only P14 Guided Prepare preview from persisted P13 Build-Ready evidence…';
      exportPanel.hidden = true;
      post('p14-plan-preview-request');
    });
    document.getElementById('plan').addEventListener('click', () => {
      root.className = 'empty';
      root.textContent = 'Classifying conservative P5 Safe Fix eligibility…';
      exportPanel.hidden = true;
      post('safe-plan-request');
    });
    document.getElementById('validate').addEventListener('click', () => {
      root.className = 'empty';
      root.textContent = 'Exporting and comparing selected section frames…';
      exportPanel.hidden = true;
      post('validation-request');
    });
    document.getElementById('batch').addEventListener('click', () => {
      root.className = 'empty';
      root.textContent = 'Preparing selected Frames for bounded sequential P7 processing…';
      exportPanel.hidden = true;
      post('batch-start-request');
    });
    document.getElementById('selftest').addEventListener('click', () => {
      root.className = 'empty';
      root.textContent = 'Running disposable compiled P5 → P3 pixel broker → P4 self-test…';
      exportPanel.hidden = true;
      post('runtime-calibration-request');
    });

    function downloadText(filename, content, type) {
      if (!content) return;
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    document.getElementById('export-audit-json').addEventListener('click', () => {
      downloadText('audit-report.json', latestAuditJson, 'application/json;charset=utf-8');
    });
    document.getElementById('export-audit-md').addEventListener('click', () => {
      downloadText('audit-report.md', latestAuditMarkdown, 'text/markdown;charset=utf-8');
    });
    document.getElementById('export-backlog-json').addEventListener('click', () => {
      downloadText('backlog.json', latestBacklogJson, 'application/json;charset=utf-8');
    });
    document.getElementById('export-backlog-md').addEventListener('click', () => {
      downloadText('backlog.md', latestBacklogMarkdown, 'text/markdown;charset=utf-8');
    });
    document.getElementById('export-build-ready-json').addEventListener('click', () => {
      downloadText('build-ready-report.json', latestBuildReadyJson, 'application/json;charset=utf-8');
    });

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function round(value, digits = 4) {
      const scale = 10 ** digits;
      return Math.round(value * scale) / scale;
    }

    async function decodePng(bytes) {
      const blob = new Blob([bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes)], { type: 'image/png' });
      const bitmap = await createImageBitmap(blob);
      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      if (!context) throw new Error('Canvas 2D context is unavailable.');
      context.drawImage(bitmap, 0, 0);
      const imageData = context.getImageData(0, 0, bitmap.width, bitmap.height);
      if (typeof bitmap.close === 'function') bitmap.close();
      return { width: imageData.width, height: imageData.height, data: imageData.data };
    }

    function comparePixels(before, after, channelTolerance) {
      const sameDimensions = before.width === after.width && before.height === after.height;
      if (!sameDimensions) {
        return {
          sameDimensions: false,
          widthBefore: before.width,
          heightBefore: before.height,
          widthAfter: after.width,
          heightAfter: after.height,
          totalPixels: 0,
          changedPixels: 0,
          changedPixelPct: 100,
          meanChannelDelta: 255,
          maxChannelDelta: 255,
          channelTolerance,
        };
      }

      const totalPixels = before.width * before.height;
      let changedPixels = 0;
      let sumChannelDelta = 0;
      let maxChannelDelta = 0;

      for (let pixel = 0; pixel < totalPixels; pixel += 1) {
        const offset = pixel * 4;
        let changed = false;
        for (let channel = 0; channel < 4; channel += 1) {
          const delta = Math.abs(before.data[offset + channel] - after.data[offset + channel]);
          sumChannelDelta += delta;
          maxChannelDelta = Math.max(maxChannelDelta, delta);
          if (delta > channelTolerance) changed = true;
        }
        if (changed) changedPixels += 1;
      }

      return {
        sameDimensions: true,
        widthBefore: before.width,
        heightBefore: before.height,
        widthAfter: after.width,
        heightAfter: after.height,
        totalPixels,
        changedPixels,
        changedPixelPct: totalPixels ? round((changedPixels / totalPixels) * 100) : 0,
        meanChannelDelta: totalPixels ? round(sumChannelDelta / (totalPixels * 4)) : 0,
        maxChannelDelta,
        channelTolerance,
      };
    }

    function renderBacklog(backlog) {
      if (!backlog || !Array.isArray(backlog.items)) return '';
      const summary = backlog.summary;
      const items = backlog.items.filter((item) => item.status !== 'RESOLVED').slice(0, 12).map((item) => {
        const context = item.contexts && item.contexts[0] ? item.contexts[0] : {};
        const location = [context.pageName, context.frameName, context.sectionName, context.nodeName].filter(Boolean).join(' / ');
        return `
          <div class="backlogItem">
            <div class="rowHead">
              <div class="name">${escapeHtml(item.title)}</div>
              <div class="badge">${escapeHtml(item.category)} · ${escapeHtml(item.priority)}</div>
            </div>
            <div class="backlogMeta">
              <span>${escapeHtml(item.id)}</span>
              <span>${escapeHtml(item.status)}</span>
              <span>${escapeHtml(item.delta)}</span>
              <span>${escapeHtml(item.code)}</span>
              <span>${item.occurrences} occurrence${item.occurrences === 1 ? '' : 's'}</span>
            </div>
            ${location ? `<div class="finding">${escapeHtml(location)}</div>` : ''}
            <div class="backlogAction">${escapeHtml(item.proposedAction)}</div>
          </div>`;
      }).join('');

      return `
        <div class="sectionTitle">Actionable backlog</div>
        <div class="backlogHero">
          <div class="rowHead">
            <div class="name">${summary.active} active items</div>
            <div class="badge">schema v${backlog.schemaVersion}</div>
          </div>
          <div class="backlogGrid">
            <div class="backlogStat"><strong>${summary.byCategory.ERROR}</strong>ERROR</div>
            <div class="backlogStat"><strong>${summary.byCategory.WARNING}</strong>WARNING</div>
            <div class="backlogStat"><strong>${summary.byCategory.IMPROVEMENT}</strong>IMPROVE</div>
            <div class="backlogStat"><strong>${summary.byCategory.INFO}</strong>INFO</div>
          </div>
          <div class="meta">Δ ${summary.byDelta.NEW} new · ${summary.byDelta.RESOLVED} resolved · ${summary.byDelta.REGRESSED} regressed · ${summary.byDelta.UNCHANGED} unchanged</div>
        </div>
        <div>${items || '<div class="empty">No active backlog items.</div>'}</div>
        ${summary.active > 12 ? `<div class="meta">Showing first 12 active items. Export JSON/Markdown for the full backlog.</div>` : ''}`;
    }

    function checkpointHtml() {
      return `
        <div class="checkpoint">
          <div class="status">SAFE FIX CHECKPOINT PENDING</div>
          <div class="finding">The previous approved original is retained until you restore or explicitly finalize this commit.</div>
          <div class="inlineActions">
            <button class="smallButton" id="restoreCheckpoint">Restore original</button>
            <button class="smallButton" id="finalizeCheckpoint">Finalize fix</button>
          </div>
        </div>`;
    }

    function bindCheckpointActions() {
      const restore = document.getElementById('restoreCheckpoint');
      if (restore) restore.addEventListener('click', () => {
        root.className = 'empty';
        root.textContent = 'Restoring retained approved original…';
        post('safe-fix-restore-request');
      });
      const finalize = document.getElementById('finalizeCheckpoint');
      if (finalize) finalize.addEventListener('click', () => {
        if (!window.confirm('Finalize this Safe Fix? The retained previous original will be removed and this checkpoint cannot be restored afterward.')) return;
        root.className = 'empty';
        root.textContent = 'Finalizing Safe Fix checkpoint…';
        post('safe-fix-finalize-request');
      });
    }

    function renderAudit(report, backlog, buildReady) {
      const sections = report.sections.map((section) => {
        const first = section.findings[0];
        const detections = Array.isArray(section.detections)
          ? section.detections
          : (section.detection ? [section.detection] : []);
        const roles = Array.isArray(section.roleDetections) ? section.roleDetections : [];
        const primary = detections[0] || null;
        const primaryLabel = primary
          ? `${primary.semanticHint ? `${primary.semanticHint} ← ` : ''}${primary.pattern}`
          : 'pattern not classified yet';
        const recipe = primary ? `${primaryLabel} · confidence ${primary.confidence}%` : primaryLabel;
        const patternRows = detections.slice(0, 4).map((detection) => {
          const label = `${detection.semanticHint ? `${detection.semanticHint} ← ` : ''}${detection.pattern}`;
          return `
          <div class="pattern">
            <span class="patternTarget">${escapeHtml(label)} @ ${escapeHtml(detection.targetNodeName)}</span>
            <span>${detection.confidence}%</span>
          </div>`;
        }).join('');
        const roleRows = roles.slice(0, 3).map((role) => `
          <div class="role">
            <span class="roleTarget">preserve ${escapeHtml(role.role)} @ ${escapeHtml(role.targetNodeName)}</span>
            <span>${role.confidence}%</span>
          </div>`).join('');
        const evidence = (detections.length || roles.length)
          ? JSON.stringify({ detections, roles }, null, 2)
          : '';
        return `
          <div class="row">
            <div class="rowHead">
              <div class="name">${escapeHtml(section.name)}</div>
              <div class="badge">${section.score} · ${section.status}</div>
            </div>
            <div class="recipe">${escapeHtml(recipe)} · Auto Layout ${section.stats.autoLayoutCoveragePct}%</div>
            ${first ? `<div class="finding">${escapeHtml(first.title)}</div>` : ''}
            ${patternRows ? `<div class="patternList">${patternRows}</div>` : ''}
            ${roleRows ? `<div class="roleList">${roleRows}</div>` : ''}
            ${evidence ? `<details><summary>Detection evidence (${detections.length} patterns · ${roles.length} special roles)</summary><pre>${escapeHtml(evidence)}</pre></details>` : ''}
          </div>`;
      }).join('');

      root.className = '';
      root.innerHTML = `
        <div class="hero">
          <div class="score">${report.score}</div>
          <div class="status">${report.status}</div>
          <div class="meta">${escapeHtml(report.root.name)} · ${Math.round(report.root.width)} × ${Math.round(report.root.height)} · ${report.stats.nodes} nodes</div>
          <div class="meta">Auto Layout coverage ${report.stats.autoLayoutCoveragePct}% · ${report.sections.length} sections discovered</div>
        </div>
        ${buildReady ? `
          <div class="sectionTitle">Build-Ready Score 2.0</div>
          <div class="hero">
            <div class="score">${buildReady.score.score === null ? '—' : buildReady.score.score}</div>
            <div class="status">${escapeHtml(buildReady.score.status)} · P13 IMPLEMENTATION CANDIDATE</div>
            <div class="meta">Responsive risk ${escapeHtml(buildReady.responsiveRisk.level)} · evidence coverage ${Math.round(buildReady.coverage.overallCoverage * 100)}%</div>
            <div class="meta">${buildReady.findings.length} findings · ${buildReady.limitations.length} explicit limitations · target-agnostic read-only analysis</div>
          </div>` : ''}
        <div>${sections || '<div class="empty">No sections discovered yet.</div>'}</div>
        ${renderBacklog(backlog)}`;
    }

    function renderP14PlanPreview(message) {
      const preview = message.preview;
      const plan = preview.plan;
      const context = message.context || {};
      const locked = preview.acceptanceAuthority === false
        && preview.targetCompatibilityClaim === false
        && preview.mutationEnabled === false
        && preview.confirmationEnabled === false;
      const groups = [
        ['ELIGIBLE', 'Eligible changes'],
        ['NOOP', 'Already correct / no-op'],
        ['REVIEW', 'Review only'],
        ['REFUSED', 'Unsupported / refused'],
      ];
      const rows = plan ? groups.map(([decision, label]) => {
        const actions = plan.actions.filter((action) => action.decision === decision);
        if (!actions.length) return '';
        return `
          <div class="sectionTitle">${escapeHtml(label)} · ${actions.length}</div>
          ${actions.map((action) => `
            <div class="row">
              <div class="rowHead">
                <div class="name">${escapeHtml(action.recipeId || action.sourceRuleId)}</div>
                <div class="badge">${escapeHtml(action.decision)} · ${action.confidence}%</div>
              </div>
              <div class="recipe">${escapeHtml(action.sourceRuleId)}@${action.sourceRuleVersion} · ${action.targetNodeIds.length} target node(s)</div>
              ${action.mutationAllowlist.length ? `<div class="finding">Allowed fields: ${escapeHtml(action.mutationAllowlist.join(', '))}</div>` : ''}
              ${action.refusalCode ? `<div class="finding error">${escapeHtml(action.refusalCode)}</div>` : ''}
            </div>`).join('')}`;
      }).join('') : '';
      const blockers = plan && plan.blockers.length
        ? `<div class="sectionTitle">Blockers · ${plan.blockers.length}</div>${plan.blockers.map((blocker) => `
            <div class="row">
              <div class="rowHead"><div class="name">${escapeHtml(blocker.code)}</div><div class="badge">BLOCKED</div></div>
              <div class="finding error">${escapeHtml(blocker.detail)}</div>
            </div>`).join('')}`
        : '';
      const unavailable = !plan
        ? `<div class="empty">${preview.handoff.failures.length
            ? preview.handoff.failures.map((failure) => escapeHtml(failure)).join('<br>')
            : 'Persisted P13 evidence could not produce a P14 preparation plan.'}</div>`
        : '';

      root.className = '';
      root.innerHTML = `
        <div class="hero">
          <div class="score">${escapeHtml(preview.summary.status)}</div>
          <div class="status">P14 GUIDED PREPARE PREVIEW · ${locked ? 'READ-ONLY / LOCKED' : 'UNEXPECTED AUTHORITY'}</div>
          <div class="meta">${escapeHtml(context.frameName || 'Persisted frame')} · ${escapeHtml(context.pageName || 'unknown page')}</div>
          <div class="meta">Derived from exact persisted P13 Build-Ready evidence${message.capturedAt ? ` · ${escapeHtml(message.capturedAt)}` : ''}.</div>
          <div class="meta">acceptanceAuthority=false · targetCompatibilityClaim=false · mutationEnabled=false · confirmationEnabled=false</div>
          <div class="metricGrid">
            <div class="metric"><strong>${preview.summary.totalActions}</strong>total actions</div>
            <div class="metric"><strong>${preview.summary.eligible}</strong>eligible</div>
            <div class="metric"><strong>${preview.summary.noOp}</strong>no-op</div>
            <div class="metric"><strong>${preview.summary.review}</strong>review</div>
            <div class="metric"><strong>${preview.summary.refused}</strong>refused</div>
            <div class="metric"><strong>${preview.summary.blockers}</strong>blockers</div>
          </div>
          <div class="meta">Plan digest: ${escapeHtml(plan ? plan.planDigest : '—')}</div>
        </div>
        ${unavailable}
        ${rows}
        ${blockers}
        <details><summary>Read-only P14 preview JSON</summary><pre>${escapeHtml(message.previewJson || JSON.stringify(preview, null, 2))}</pre></details>`;
    }

    function renderSafePlan(message) {
      const counts = { ELIGIBLE: 0, REVIEW: 0, NOOP: 0, UNSUPPORTED: 0 };
      for (const plan of message.plans) counts[plan.decision] = (counts[plan.decision] || 0) + 1;
      const rows = message.plans.map((plan) => {
        const apply = message.mutationEnabled && plan.decision === 'ELIGIBLE' && plan.recipe
          ? `<div class="inlineActions one"><button class="smallButton applySafeFix" data-target="${escapeHtml(plan.targetNodeId)}" data-recipe="${escapeHtml(plan.recipe)}">Apply this Safe Fix</button></div>`
          : '';
        return `
          <div class="row">
            <div class="rowHead">
              <div class="name">${escapeHtml(plan.recipe || plan.pattern)}</div>
              <div class="badge">${escapeHtml(plan.decision)} · ${plan.confidence}%</div>
            </div>
            <div class="recipe">${escapeHtml(plan.semanticHint ? `${plan.semanticHint} ← ${plan.pattern}` : plan.pattern)} @ ${escapeHtml(plan.targetNodeName)}</div>
            <div class="finding">${escapeHtml(plan.reason)}</div>
            ${apply}
            <details><summary>Plan evidence</summary><pre>${escapeHtml(JSON.stringify(plan, null, 2))}</pre></details>
          </div>`;
      }).join('');

      const gateMessage = message.runtimeProofValid
        ? `Compiled runtime proof: PASS${message.runtimeProofPassedAt ? ` · ${escapeHtml(message.runtimeProofPassedAt)}` : ''}`
        : 'Compiled runtime proof: NOT PASSED — run Runtime self-test before mutation can unlock.';
      const mutationLabel = message.pendingUndo ? 'LOCKED — checkpoint pending' : (message.mutationEnabled ? 'UNLOCKED' : 'LOCKED');

      root.className = '';
      root.innerHTML = `
        ${message.pendingUndo ? checkpointHtml() : ''}
        <div class="hero">
          <div class="score">${counts.ELIGIBLE}</div>
          <div class="status">P5 SAFE FIX PREVIEW</div>
          <div class="meta">${escapeHtml(message.root.name)} · ${Math.round(message.root.width)} × ${Math.round(message.root.height)}</div>
          <div class="meta">Eligible ${counts.ELIGIBLE} · Review ${counts.REVIEW} · No-op ${counts.NOOP} · Unsupported ${counts.UNSUPPORTED}</div>
          <div class="meta">Mutation gate: ${mutationLabel}</div>
          <div class="meta">${gateMessage}</div>
        </div>
        ${rows || '<div class="empty">No supported layout detections were found for this selected Frame.</div>'}`;

      root.querySelectorAll('.applySafeFix').forEach((button) => {
        button.addEventListener('click', () => {
          const targetNodeId = button.getAttribute('data-target');
          const recipe = button.getAttribute('data-recipe');
          if (!targetNodeId || !recipe) return;
          root.className = 'empty';
          root.textContent = `Applying ${recipe} to a staged candidate and running full P3 validation…`;
          post('safe-fix-apply-request', { targetNodeId, recipe });
        });
      });
      bindCheckpointActions();
    }

    function renderValidation(message) {
      const report = message.report;
      const pixel = report.metrics.pixel;
      const findingRows = report.findings.map((item) => `
        <div class="row">
          <div class="rowHead"><div class="name">${escapeHtml(item.code)}</div><div class="badge">FAIL</div></div>
          <div class="finding error">${escapeHtml(item.title)} — ${escapeHtml(item.detail)}</div>
          <details><summary>Evidence</summary><pre>${escapeHtml(JSON.stringify(item.evidence, null, 2))}</pre></details>
        </div>`).join('');

      root.className = '';
      root.innerHTML = `
        <div class="hero">
          <div class="score">${report.passed ? 'PASS' : 'FAIL'}</div>
          <div class="status">P3 ${escapeHtml(report.thresholdVersion)} VALIDATION</div>
          <div class="meta">Before: ${escapeHtml(message.labels.before)}</div>
          <div class="meta">Candidate: ${escapeHtml(message.labels.after)}</div>
          <div class="meta">Render scale: ${round(message.renderScale * 100, 2)}%</div>
          <div class="metricGrid">
            <div class="metric"><strong>${report.metrics.textAnchorCountBefore}/${report.metrics.textAnchorCountAfter}</strong>text anchors</div>
            <div class="metric"><strong>${report.metrics.imageAnchorCountBefore}/${report.metrics.imageAnchorCountAfter}</strong>image anchors</div>
            <div class="metric"><strong>${round(report.metrics.maxTextPositionDriftPx, 3)} px</strong>max text move</div>
            <div class="metric"><strong>${round(report.metrics.maxImagePositionDriftPx, 3)} px</strong>max image move</div>
            <div class="metric"><strong>${pixel ? pixel.changedPixelPct : '—'}%</strong>changed pixels</div>
            <div class="metric"><strong>${pixel ? pixel.meanChannelDelta : '—'}</strong>mean channel Δ</div>
          </div>
        </div>
        ${findingRows || '<div class="empty">All current integrity and rendered-pixel gates passed.</div>'}`;
    }

    function renderSafeFixResult(message) {
      const transaction = message.transaction;
      const validation = transaction && transaction.validation;
      const pixel = validation && validation.metrics ? validation.metrics.pixel : null;
      const state = transaction ? transaction.state : 'SKIPPED';
      const detail = message.skippedReason || (transaction && transaction.error) || (validation && validation.passed === false
        ? 'Candidate failed mandatory validation and was discarded.'
        : 'Candidate completed the transaction pipeline.');

      root.className = '';
      root.innerHTML = `
        ${message.pendingUndo ? checkpointHtml() : ''}
        <div class="hero">
          <div class="score">${escapeHtml(state)}</div>
          <div class="status">P5 SAFE FIX RESULT</div>
          <div class="meta">Recipe: ${escapeHtml(message.plan.recipe || message.plan.pattern)} @ ${escapeHtml(message.plan.targetNodeName)}</div>
          <div class="meta">${escapeHtml(detail)}</div>
          ${validation ? `<div class="meta">Full P3: ${validation.passed ? 'PASS' : 'FAIL'} · changed pixels ${pixel ? `${pixel.changedPixelPct}%` : '—'}</div>` : ''}
        </div>
        <details><summary>Transaction evidence</summary><pre>${escapeHtml(JSON.stringify(message, null, 2))}</pre></details>`;
      bindCheckpointActions();
    }

    function renderRuntimeCalibration(message) {
      const result = message.result;
      root.className = '';
      root.innerHTML = `
        <div class="hero">
          <div class="score">${result.passed ? 'PASS' : 'FAIL'}</div>
          <div class="status">P5 COMPILED RUNTIME SELF-TEST</div>
          <div class="meta">Forced reject: ${result.forcedReject.validationRejected ? 'PASS' : 'FAIL'} · pixel evidence ${result.forcedReject.pixelEvidenceReturned ? 'YES' : 'NO'}</div>
          <div class="meta">Pass/commit/restore: ${result.passRestore.restored ? 'PASS' : 'FAIL'} · checkpoint cleared ${result.passRestore.checkpointCleared ? 'YES' : 'NO'}</div>
          <div class="meta">Leftovers: ${result.leftovers}</div>
          <div class="meta">Mutation gate: ${message.mutationGateUnlocked ? 'UNLOCKED' : 'LOCKED'}</div>
        </div>
        <details><summary>Self-test evidence</summary><pre>${escapeHtml(JSON.stringify(result, null, 2))}</pre></details>`;
    }

    function bindBatchActions() {
      const cancel = document.getElementById('batchCancel');
      if (cancel) cancel.addEventListener('click', () => post('batch-cancel-request'));

      const resume = document.getElementById('batchResume');
      if (resume) resume.addEventListener('click', () => {
        root.className = 'empty';
        root.textContent = 'Resuming bounded P7 queue…';
        post('batch-resume-request');
      });

      const restore = document.getElementById('batchRestore');
      if (restore) restore.addEventListener('click', () => {
        root.className = 'empty';
        root.textContent = 'Restoring the current batch checkpoint before continuing…';
        post('batch-checkpoint-restore-request');
      });

      const finalize = document.getElementById('batchFinalize');
      if (finalize) finalize.addEventListener('click', () => {
        if (!window.confirm('Finalize this batch Safe Fix checkpoint? P7 will re-audit the committed Frame and continue only after the real P5 checkpoint is finalized.')) return;
        root.className = 'empty';
        root.textContent = 'Re-auditing the committed Frame and finalizing the P7 checkpoint…';
        post('batch-checkpoint-finalize-request');
      });
    }

    function renderBatch(message) {
      const state = message.state;
      const summary = message.summary;
      const awaitingCheckpoint = state.items.some((item) => item.status === 'AWAITING_CHECKPOINT');
      const retryable = summary.failed > 0 || summary.cancelled > 0 || state.status === 'PAUSED';
      const active = state.status === 'RUNNING' || state.status === 'CANCELLING';

      const rows = state.items.map((item) => `
        <div class="row">
          <div class="rowHead">
            <div class="name">${escapeHtml(item.frameName)}</div>
            <div class="badge">${escapeHtml(item.status)}</div>
          </div>
          <div class="recipe">attempts ${item.attempts} · live id ${escapeHtml(item.frameId)}</div>
          ${item.error ? `<div class="finding error">${escapeHtml(item.error)}</div>` : ''}
          ${item.skipReason ? `<div class="finding">${escapeHtml(item.skipReason)}</div>` : ''}
        </div>`).join('');

      let controls = '';
      if (awaitingCheckpoint) {
        controls = `
          <div class="checkpoint">
            <div class="status">P7 CHECKPOINT PAUSE</div>
            <div class="finding">One committed frame is reversible. Resolve it before another frame can mutate.</div>
            <div class="inlineActions">
              <button class="smallButton" id="batchRestore">Restore this frame</button>
              <button class="smallButton" id="batchFinalize">Finalize & continue</button>
            </div>
            ${!message.cancelRequested ? '<div class="inlineActions one"><button class="smallButton" id="batchCancel">Cancel remaining frames</button></div>' : ''}
          </div>`;
      } else if (active) {
        controls = '<div class="inlineActions one"><button class="smallButton" id="batchCancel">Cancel after active frame settles</button></div>';
      } else if (retryable) {
        controls = '<div class="inlineActions one"><button class="smallButton" id="batchResume">Retry / resume batch</button></div>';
      }

      root.className = '';
      root.innerHTML = `
        <div class="hero">
          <div class="score">${summary.progressPct}%</div>
          <div class="status">P7 BATCH · ${escapeHtml(state.status)}</div>
          <div class="meta">Total ${summary.total} · done ${summary.finished} · success ${summary.succeeded} · failed ${summary.failed} · skipped ${summary.skipped} · cancelled ${summary.cancelled}</div>
          ${summary.awaitingCheckpoint ? `<div class="meta">Awaiting checkpoint: ${summary.awaitingCheckpoint}</div>` : ''}
          ${state.pauseReason ? `<div class="meta">${escapeHtml(state.pauseReason)}</div>` : ''}
          ${message.note ? `<div class="meta">${escapeHtml(message.note)}</div>` : ''}
          <div class="progressTrack"><div class="progressFill" style="width:${Math.max(0, Math.min(100, summary.progressPct))}%"></div></div>
        </div>
        ${controls}
        <div>${rows || '<div class="empty">The batch contains no Frames.</div>'}</div>`;
      bindBatchActions();
    }


    window.onmessage = async (event) => {
      const message = event.data.pluginMessage;
      if (!message) return;

      if (message.type === 'audit-error' || message.type === 'validation-error' || message.type === 'safe-fix-error' || message.type === 'batch-error') {
        root.className = 'empty';
        root.textContent = message.message;
        if (message.type === 'audit-error') exportPanel.hidden = true;
        return;
      }

      if (message.type === 'audit-result') {
        latestAuditJson = typeof message.auditJson === 'string' ? message.auditJson : '';
        latestAuditMarkdown = typeof message.auditMarkdown === 'string' ? message.auditMarkdown : '';
        latestBacklogJson = typeof message.backlogJson === 'string' ? message.backlogJson : '';
        latestBacklogMarkdown = typeof message.backlogMarkdown === 'string' ? message.backlogMarkdown : '';
        latestBuildReadyJson = typeof message.buildReadyJson === 'string' ? message.buildReadyJson : '';
        exportPanel.hidden = !(latestAuditJson && latestAuditMarkdown && latestBacklogJson && latestBacklogMarkdown && latestBuildReadyJson);
        renderAudit(message.report, message.backlog, message.buildReady);
        return;
      }

      if (message.type === 'p14-plan-preview-result') {
        exportPanel.hidden = true;
        renderP14PlanPreview(message);
        return;
      }

      if (message.type === 'p14-plan-preview-unavailable') {
        exportPanel.hidden = true;
        root.className = 'empty';
        root.textContent = message.message || 'P14 Guided Prepare preview is unavailable. Run Audit on exactly one Frame first.';
        return;
      }

      if (message.type === 'safe-plan-result') {
        renderSafePlan(message);
        return;
      }

      if (message.type === 'safe-fix-started') {
        root.className = 'empty';
        root.textContent = `Staging ${message.recipe} candidate for ${message.targetNodeName} and running full P3…`;
        return;
      }

      if (message.type === 'safe-fix-result') {
        renderSafeFixResult(message);
        return;
      }

      if (message.type === 'safe-fix-restore-result') {
        root.className = 'empty';
        root.textContent = message.restored
          ? 'Restore complete. The retained approved original is back in place and the committed candidate was removed.'
          : 'No Safe Fix checkpoint was pending.';
        return;
      }

      if (message.type === 'safe-fix-finalize-result') {
        root.className = 'empty';
        root.textContent = message.finalized
          ? 'Safe Fix finalized. The committed candidate remains and the retained previous original backup was removed.'
          : 'No Safe Fix checkpoint was pending.';
        return;
      }

      if (message.type === 'batch-state') {
        exportPanel.hidden = true;
        renderBatch(message);
        return;
      }

      if (message.type === 'runtime-calibration-started') {
        root.className = 'empty';
        root.textContent = 'Running disposable compiled P5 → FullFrameValidator → UI pixel broker → P4 self-test…';
        return;
      }

      if (message.type === 'runtime-calibration-result') {
        renderRuntimeCalibration(message);
        return;
      }

      if (message.type === 'validation-pixel-request') {
        try {
          const [before, after] = await Promise.all([
            decodePng(message.beforePng),
            decodePng(message.afterPng),
          ]);
          const pixelMetrics = comparePixels(before, after, message.channelTolerance);
          post('validation-pixel-result', {
            validationId: message.validationId,
            pixelMetrics,
          });
        } catch (error) {
          const errorMessage = error instanceof Error ? error.message : String(error);
          root.className = 'empty';
          root.textContent = `Pixel comparison failed: ${errorMessage}`;
          post('validation-pixel-error', {
            validationId: message.validationId,
            message: errorMessage,
          });
        }
        return;
      }

      if (message.type === 'validation-result') {
        exportPanel.hidden = true;
        renderValidation(message);
      }
    };
  </script>
</body>
</html>
